<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000" width="1100" height="1000">
  <!-- ============================================================= -->
  <!-- FROZEN DESIGN LAYER — geometry, colors, logo. NEVER edited.    -->
  <!-- Editable text = elements carrying data-field. Renderer only    -->
  <!-- swaps their text content + (if needed) shrinks font-size.      -->
  <!-- ============================================================= -->
  <rect x="0" y="0" width="1100" height="1000" fill="#ffffff"/>

  <!-- panel labels (frozen, not editable) -->
  <text x="40" y="95" font-family="Arial" font-size="20" fill="#9aa0a6">FRONT PANEL  170 × 40 mm</text>
  <text x="40" y="555" font-family="Arial" font-size="20" fill="#9aa0a6">BACK / LEGAL PANEL  170 × 40 mm</text>

  <!-- ===================== FRONT PANEL ===================== -->
  <g id="front">
    <rect x="40" y="110" width="1020" height="420" rx="14" fill="#eef7ef" stroke="#cfe6d2"/>
    <rect x="40" y="110" width="14" height="420" fill="#2e9e5b"/>

    <!-- LOGO LOCK (frozen reference) -->
    <text x="90" y="170" font-family="Arial" font-weight="bold" font-size="34" fill="#111111">das experten</text>
    <rect x="92" y="180" width="60" height="6" fill="#111"/><rect x="92" y="188" width="60" height="6" fill="#d11"/><rect x="92" y="196" width="60" height="6" fill="#f3c000"/>

    <!-- probiotic hero blob (frozen graphic) -->
    <circle cx="930" cy="300" r="90" fill="#2e9e5b" opacity="0.12"/>
    <circle cx="930" cy="300" r="55" fill="#2e9e5b" opacity="0.18"/>

    <!-- EDITABLE TEXT -->
    <text data-field="front.sku_name" data-maxw="700" data-x="90" data-x2="1000"
          x="90" y="270" font-family="Arial" font-weight="bold" font-size="72" fill="#1c6b3a">SYMBIOS</text>

    <text data-field="front.h1" data-maxw="900" data-x="90" data-x2="1000"
          x="90" y="330" font-family="Arial" font-weight="bold" font-size="30" fill="#222">Kem đánh răng probiotic làm sạch răng theo cơ chế sinh học.</text>

    <text data-field="front.h2" data-maxw="900" data-x="90" data-x2="1000"
          x="90" y="375" font-family="Arial" font-size="23" fill="#333">Tăng cường khả năng bảo vệ tự nhiên của nước bọt. Cải thiện hệ vi sinh khoang miệng.</text>

    <text data-field="front.claim" data-maxw="900" data-x="90" data-x2="1000"
          x="90" y="455" font-family="Arial" font-style="italic" font-size="22" fill="#1c6b3a">Bacillus coagulans — ông vua của các probiotic — hỗ trợ phòng ngừa sâu răng.</text>

    <text data-field="front.volume" data-maxw="180" data-x="90" data-x2="1000"
          x="90" y="505" font-family="Arial" font-weight="bold" font-size="26" fill="#111">70 ml</text>
  </g>

  <!-- ===================== BACK / LEGAL PANEL ===================== -->
  <g id="back">
    <rect x="40" y="570" width="1020" height="405" rx="14" fill="#fafafa" stroke="#e2e2e2"/>

    <text data-field="back.inci_label" data-maxw="300" data-x="70" data-x2="770"
          x="70" y="615" font-family="Arial" font-weight="bold" font-size="18" fill="#111">Thành phần:</text>
    <text data-field="back.inci" data-maxw="700" data-x="70" data-x2="770" data-wrap="1" data-lh="22" data-maxlines="2"
          x="70" y="645" font-family="Arial" font-size="15" fill="#333"><tspan x="70">Aqua, Sorbitol, Hydrated Silica, Glycerin, Bacillus Coagulans, Aroma, Sodium Fluoride (1450 ppm F).</tspan></text>

    <text data-field="back.importer" data-maxw="700" data-x="70" data-x2="770" data-wrap="1" data-lh="22" data-maxlines="2"
          x="70" y="715" font-family="Arial" font-size="15" fill="#333"><tspan x="70">Nhà nhập khẩu: Das Experten International LLC, Sharjah Media City, UAE.</tspan></text>

    <text data-field="back.warning" data-maxw="700" data-x="70" data-x2="770" data-wrap="1" data-lh="22" data-maxlines="2"
          x="70" y="790" font-family="Arial" font-size="15" fill="#555"><tspan x="70">Không nuốt. Để xa tầm tay trẻ em. Bảo quản ở nhiệt độ không quá 25°C.</tspan></text>

    <text data-field="back.batch" data-maxw="300" data-x="70" data-x2="450"
          x="70" y="945" font-family="Arial" font-weight="bold" font-size="18" fill="#111">Lô: 260601</text>
    <text data-field="back.expiry" data-maxw="300" data-x="380" data-x2="760"
          x="380" y="945" font-family="Arial" font-weight="bold" font-size="18" fill="#111">Hạn sử dụng: 06/2031</text>

    <!-- barcode (frozen graphic) + editable number -->
    <g>
      <rect x="800" y="800" width="230" height="70" fill="#fff" stroke="#ccc"/>
      <g fill="#111">
        <rect x="815" y="808" width="4" height="50"/><rect x="822" y="808" width="2" height="50"/><rect x="828" y="808" width="6" height="50"/><rect x="838" y="808" width="2" height="50"/><rect x="844" y="808" width="4" height="50"/><rect x="853" y="808" width="6" height="50"/><rect x="862" y="808" width="2" height="50"/><rect x="868" y="808" width="4" height="50"/><rect x="877" y="808" width="2" height="50"/><rect x="882" y="808" width="6" height="50"/><rect x="892" y="808" width="4" height="50"/><rect x="900" y="808" width="2" height="50"/><rect x="906" y="808" width="6" height="50"/><rect x="916" y="808" width="2" height="50"/><rect x="922" y="808" width="4" height="50"/><rect x="931" y="808" width="2" height="50"/><rect x="936" y="808" width="6" height="50"/><rect x="946" y="808" width="4" height="50"/><rect x="955" y="808" width="2" height="50"/><rect x="961" y="808" width="6" height="50"/><rect x="971" y="808" width="2" height="50"/><rect x="977" y="808" width="4" height="50"/><rect x="986" y="808" width="6" height="50"/><rect x="996" y="808" width="2" height="50"/><rect x="1002" y="808" width="4" height="50"/><rect x="1011" y="808" width="2" height="50"/><rect x="1017" y="808" width="6" height="50"/>
      </g>
      <text data-field="back.barcode" data-maxw="220" data-x="815" data-x2="1025"
            x="915" y="885" text-anchor="middle" font-family="Arial" font-size="16" fill="#111">4 600000 000017</text>
    </g>
  </g>
</svg>
