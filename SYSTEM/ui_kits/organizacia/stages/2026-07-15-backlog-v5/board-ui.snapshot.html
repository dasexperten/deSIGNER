<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dasorg-ui" content="2026-07-15-backlog-v5">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>DASORG — Agent board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* deSIGNER SYSTEM tokens + Brighter skill (paper canvas, rot CTAs, display type) */
:root{
  --brand-schwarz:#282229;--brand-rot:#E5202C;--brand-gold:#FEF004;--brand-schwarz-ink:#1A1519;
  --paper:#FBFAF6;--paper-raised:#FFFFFF;--paper-sunk:#F3F0E8;--bone:#EDE8DD;
  --stone-300:#9C9384;--stone-400:#6E6558;--stone-500:#4A4238;
  --fg-1:var(--brand-schwarz-ink);--fg-2:var(--stone-500);--fg-3:var(--stone-400);--fg-muted:var(--stone-300);
  --border-hairline:rgba(26,21,25,.08);--border-subtle:rgba(26,21,25,.14);--border-strong:rgba(26,21,25,.32);
  --status-success:#2E7D4F;--status-warning:#C77A00;--status-error:var(--brand-rot);
  --radius-sm:4px;--radius-md:6px;--radius-lg:10px;--radius-pill:999px;
  --shadow-card:0 1px 2px rgba(26,21,25,.05),0 0 0 1px var(--border-hairline);
  --shadow-raised:0 4px 16px -6px rgba(26,21,25,.12),0 0 0 1px var(--border-hairline);
  --shadow-float:0 18px 48px -18px rgba(26,21,25,.22),0 2px 6px rgba(26,21,25,.06);
  --font-display:"Archivo",system-ui,sans-serif;
  --font-body:"Archivo",system-ui,sans-serif;
  --font-meta:"Archivo Narrow",system-ui,sans-serif;
  --font-mono:"Manrope",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--fg-1);font:15px/1.5 var(--font-body);min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}

/* tricolor ribbon */
.ribbon{height:4px;background:linear-gradient(90deg,var(--brand-schwarz) 0 33.33%,var(--brand-rot) 33.33% 66.66%,var(--brand-gold) 66.66% 100%)}

/* chrome */
.top{
  background:var(--paper-raised);border-bottom:1px solid var(--border-subtle);
  padding:14px 20px 12px;position:sticky;top:0;z-index:8;
  box-shadow:0 1px 0 var(--border-hairline);
}
.top-inner{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:.04em;line-height:1.1}
.brand .sub{font-family:var(--font-meta);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{
  border:1px solid var(--border-subtle);background:var(--paper-sunk);color:var(--fg-2);
  padding:8px 14px;border-radius:var(--radius-pill);font-weight:700;font-size:13px;
  transition:background var(--ease) 120ms,color var(--ease) 120ms,box-shadow var(--ease) 120ms;
}
.tab:hover{border-color:var(--border-strong)}
.tab.on{background:var(--brand-rot);color:#fff;border-color:var(--brand-rot);box-shadow:var(--shadow-raised)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:0;border-radius:var(--radius-md);padding:9px 14px;font-weight:800;font-size:13px;
  font-family:var(--font-display);box-shadow:var(--shadow-raised);transition:transform 80ms,filter-color 120ms;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand-rot);color:#fff}
.btn-primary:hover{filter:brightness(.94)}
.btn-dark{background:var(--brand-schwarz);color:#fff}
.btn-dark:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--paper-sunk);color:var(--fg-1);border:1px solid var(--border-subtle);box-shadow:none}
.btn-ok{background:var(--status-success);color:#fff}
.btn-warn{background:var(--status-warning);color:#fff}

main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}

/* login */
.login-wrap{min-height:70vh;display:grid;place-items:center;padding:24px}
.login-card{
  width:min(420px,100%);background:var(--paper-raised);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-float);overflow:hidden;border:1px solid var(--border-hairline);
}
.login-card .pad{padding:28px 24px 24px}
.login-card h1{font-family:var(--font-display);font-weight:900;font-size:26px;margin-bottom:6px}
.login-card p{color:var(--fg-2);font-size:14px;margin-bottom:16px;line-height:1.45}
.login-card label{display:block;font-family:var(--font-meta);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);font-weight:700;margin-bottom:6px}
.login-card input{
  width:100%;padding:12px 14px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);
  background:var(--paper);margin-bottom:14px;font-family:var(--font-mono);font-size:14px;font-weight:600;
}
.login-card input:focus{outline:2px solid rgba(229,32,44,.35);border-color:var(--brand-rot)}
.login-err{color:var(--status-error);font-size:13px;font-weight:600;margin:10px 0 0;min-height:1.2em}
.login-hint{margin-top:14px;padding:12px;background:var(--paper-sunk);border-radius:var(--radius-md);font-size:12px;color:var(--fg-2);line-height:1.45}
.login-hint code{font-family:var(--font-mono);font-size:11px;background:var(--paper-raised);padding:1px 5px;border-radius:3px}

/* hero strip */
.hero{
  background:var(--brand-schwarz);color:var(--paper);border-radius:var(--radius-lg);
  padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-raised);
  display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;
}
.hero h2{font-family:var(--font-display);font-weight:900;font-size:22px;margin-bottom:4px}
.hero p{color:rgba(251,250,246,.72);font-size:13px;max-width:520px}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap}
.hero-stat{
  background:rgba(254,240,4,.14);border:1px solid rgba(254,240,4,.28);color:var(--brand-gold);
  border-radius:var(--radius-md);padding:10px 14px;min-width:88px;text-align:center;
}
/* dashboard bars */
.dash-panel{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);padding:14px 16px;margin-bottom:16px;
}
.dash-panel h3{
  font-family:var(--font-meta);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg-3);font-weight:700;margin-bottom:10px;
}
.stack-bar{
  display:flex;height:14px;border-radius:var(--radius-pill);overflow:hidden;
  background:var(--paper-sunk);border:1px solid var(--border-hairline);
}
.stack-bar > i{display:block;height:100%;min-width:0;transition:width .25s var(--ease)}
.stack-bar > i.seg-blocked{background:var(--brand-rot)}
.stack-bar > i.seg-missed{background:#c41e28}
.stack-bar > i.seg-due{background:var(--status-warning)}
.stack-bar > i.seg-prog{background:#0D199E}
.stack-bar > i.seg-done{background:var(--status-success)}
.stack-bar > i.seg-idle{background:var(--bone)}
.stack-bar.lg{height:18px}
.stack-bar.sm{height:8px;border-radius:var(--radius-sm)}
.bar-legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px;font-size:12px;color:var(--fg-2);font-weight:600}
.bar-legend span{display:inline-flex;align-items:center;gap:6px}
.bar-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.meter{margin-top:10px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:12px}
.meter-row .lbl{color:var(--fg-3);font-weight:600}
.meter-row .val{font-family:var(--font-mono);font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg-1)}
.meter-track{
  height:10px;background:var(--paper-sunk);border-radius:var(--radius-pill);overflow:hidden;
  border:1px solid var(--border-hairline);
}
.meter-track > i{
  display:block;height:100%;border-radius:var(--radius-pill);
  background:linear-gradient(90deg,var(--brand-rot),#ff5a62);
  box-shadow:inset 0 0 0 1px rgba(26,21,25,.06);
}
.meter-track > i.ok{background:linear-gradient(90deg,var(--status-success),#4caf70)}
.meter-track > i.warn{background:linear-gradient(90deg,var(--status-warning),#e0a030)}
.meter-track > i.blue{background:linear-gradient(90deg,#0D199E,#3d4fd4)}
.meter-track > i.gold{background:linear-gradient(90deg,#C9A227,#FEF004)}
.meter-track > i.green{background:linear-gradient(90deg,#1B7A3D,#3DDC84)}
/* Stacked segment colors — knowledge */
.seg-gold{background:linear-gradient(90deg,#C9A227,#FEF004)}
.seg-green{background:linear-gradient(90deg,#1B7A3D,#3DDC84)}
.seg-blue{background:linear-gradient(90deg,#0D199E,#3d4fd4)}
/* Stacked segment colors — competitiveness drivers */
.seg-act{background:linear-gradient(90deg,#E67E22,#F5A623)}
.seg-comp{background:linear-gradient(90deg,#0D9488,#2DD4BF)}
.seg-res{background:linear-gradient(90deg,#1B7A3D,#3DDC84)}
.seg-rel{background:linear-gradient(90deg,#6D28D9,#A78BFA)}
.seg-eng{background:linear-gradient(90deg,#BE185D,#F472B6)}
.seg-know{background:linear-gradient(90deg,#C9A227,#FEF004)}
.card-bars{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.card-bars .meter{margin-top:0}
.card-bars .stack-bar{height:9px}
.card-bars .meter-row{font-size:11px;margin-bottom:3px}
.dual-bars{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.dual-bars .stack-bar{height:10px}
.dual-bars .meter-row{font-size:11px;margin-bottom:3px}
.know-level{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:4px;padding-top:6px;border-top:1px dashed var(--border-hairline);
  font-size:11px;font-weight:700;color:var(--fg-2);
}
.know-level b{font-family:var(--font-mono);font-size:14px;color:var(--fg-1);font-variant-numeric:tabular-nums}
.know-legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:8px;font-size:11px;color:var(--fg-3);font-weight:600}
.know-legend span{display:inline-flex;align-items:center;gap:5px}
.know-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.know-legend i.gold,.know-legend i.seg-gold{background:linear-gradient(90deg,#C9A227,#FEF004)}
.know-legend i.green,.know-legend i.seg-green{background:linear-gradient(90deg,#1B7A3D,#3DDC84)}
.know-legend i.blue,.know-legend i.seg-blue{background:linear-gradient(90deg,#0D199E,#3d4fd4)}
.know-legend i.seg-act{background:linear-gradient(90deg,#E67E22,#F5A623)}
.know-legend i.seg-comp{background:linear-gradient(90deg,#0D9488,#2DD4BF)}
.know-legend i.seg-res{background:linear-gradient(90deg,#1B7A3D,#3DDC84)}
.know-legend i.seg-rel{background:linear-gradient(90deg,#6D28D9,#A78BFA)}
.know-legend i.seg-eng{background:linear-gradient(90deg,#BE185D,#F472B6)}
.know-legend i.seg-know{background:linear-gradient(90deg,#C9A227,#FEF004)}
.comp-badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:0;
  padding:5px 10px;border-radius:var(--radius-pill);
  background:rgba(13,25,158,.08);border:1px solid rgba(13,25,158,.2);
  font-size:11px;font-weight:700;color:#0D199E;
}
.comp-badge b{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums}
.comp-badge .sub{font-weight:600;opacity:.75;font-size:10px}
.comp-panel .comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px;font-size:11px;color:var(--fg-2)}
.comp-panel .comp-grid b{font-family:var(--font-mono);color:var(--fg-1)}
.rank-chip{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--font-mono);font-weight:800;font-size:12px;
  color:#0D199E;font-variant-numeric:tabular-nums;
}
/* Small rank bubble on the left of the Compete bar row — number only (2, 3, 11) */
.rank-bubble{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:18px;
  padding:0 6px;
  border-radius:var(--radius-pill);
  font-family:var(--font-mono);
  font-weight:900;
  font-size:11px;
  line-height:1;
  font-variant-numeric:tabular-nums;
  color:#0D199E;
  background:rgba(13,25,158,.12);
  border:1px solid rgba(13,25,158,.28);
  box-shadow:none;
  pointer-events:none;
  white-space:nowrap;
}
.compete-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.compete-row .compete-main{
  flex:1 1 auto;
  min-width:0;
}
.compete-row .compete-main .meter{margin-top:0}
.compete-row .compete-main .stack-bar{margin-top:0}
.kpi-score{
  display:flex;align-items:center;gap:12px;margin-top:10px;padding-right:56px;
}
.kpi-score .pct{
  font-family:var(--font-mono);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;
  color:var(--fg-1);min-width:3.2em;
}
.kpi-score .meter{flex:1;margin-top:0}
.ktile .meter{margin-top:10px}
.ktile .meter-track{height:8px}
.hero-stat b{display:block;font-family:var(--font-mono);font-size:22px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.hero-stat span{font-family:var(--font-meta);font-size:10px;letter-spacing:.12em;text-transform:uppercase}

/* legend — interactive status filters */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.legend .leg-btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-pill);
  background:var(--paper-raised);border:1px solid var(--border-hairline);font-size:12px;color:var(--fg-2);font-weight:600;
  cursor:pointer;font-family:inherit;transition:border-color .12s,box-shadow .12s,background .12s,color .12s;
}
.legend .leg-btn:hover{border-color:var(--border-strong);box-shadow:var(--shadow-card);color:var(--fg-1)}
.legend .leg-btn:focus-visible{outline:2px solid rgba(229,32,44,.4);outline-offset:2px}
.legend .leg-btn.on{border-color:var(--brand-rot);background:rgba(229,32,44,.06);color:var(--fg-1);box-shadow:var(--shadow-raised)}
.bar-legend .leg-btn{
  display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;
  font:inherit;font-size:12px;font-weight:600;color:var(--fg-2);padding:2px 4px;border-radius:var(--radius-sm);
}
.bar-legend .leg-btn:hover{color:var(--fg-1);background:var(--paper-sunk)}
.hero-stat{cursor:pointer;transition:transform .12s,filter .12s}
.hero-stat:hover{transform:translateY(-1px);filter:brightness(1.08)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-red{background:var(--status-error)}.dot-amber{background:var(--status-warning)}
.dot-blue{background:#0D199E}.dot-green{background:var(--status-success)}.dot-ok{background:var(--stone-300)}

/* status process widget */
.sw-backdrop{
  position:fixed;inset:0;background:rgba(26,21,25,.48);z-index:30;display:none;
  align-items:center;justify-content:center;padding:16px;
}
.sw-backdrop.on{display:flex}
.sw{
  width:min(560px,100%);max-height:min(86vh,720px);overflow:auto;
  background:var(--paper-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);
  border:1px solid var(--border-hairline);
}
.sw-head{padding:16px 18px 12px;border-bottom:1px solid var(--border-hairline);position:sticky;top:0;background:var(--paper-raised);z-index:1}
.sw-head h3{font-family:var(--font-display);font-weight:900;font-size:18px;margin-bottom:4px}
.sw-head p{font-size:13px;color:var(--fg-2);line-height:1.4}
.sw-x{
  float:right;width:34px;height:34px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  background:var(--paper-sunk);font-size:18px;line-height:1;display:grid;place-items:center;color:var(--fg-2);cursor:pointer;
}
.sw-process{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;
}
.sw-process button{
  flex:1 1 100px;border:1px solid var(--border-hairline);background:var(--paper-sunk);border-radius:var(--radius-md);
  padding:8px 6px;font-size:11px;font-weight:700;color:var(--fg-2);cursor:pointer;font-family:var(--font-meta);
  letter-spacing:.04em;text-transform:uppercase;
}
.sw-process button.on{background:var(--brand-schwarz);color:var(--paper);border-color:var(--brand-schwarz)}
.sw-process button .n{display:block;font-family:var(--font-mono);font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.sw-body{padding:12px 16px 18px}
.sw-row{
  border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px;margin-bottom:10px;
  background:var(--paper);cursor:pointer;transition:border-color .12s,box-shadow .12s;
}
.sw-row:hover{border-color:var(--border-strong);box-shadow:var(--shadow-card)}
.sw-row .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.sw-row .agent{font-weight:800;font-size:14px}
.sw-row .mail{font-size:12px;color:var(--fg-3);font-weight:600;line-height:1.25} /* role under name */
.sw-row .task{font-size:13px;font-weight:700;color:var(--fg-1);margin-bottom:4px}
.sw-row .brief{font-size:12px;color:var(--fg-2);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sw-row .meta{font-size:11px;color:var(--fg-3);font-weight:600;margin-bottom:6px}
.sw-empty{text-align:center;padding:28px 12px;color:var(--fg-2);font-size:13px}

.sec{
  font-family:var(--font-meta);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--fg-3);font-weight:700;margin:20px 0 10px;
}

/* agent cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;overflow:visible;padding-top:4px}
.card{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);padding:0;overflow:visible;cursor:pointer;position:relative;
  transition:box-shadow var(--ease) 160ms,transform var(--ease) 160ms,border-color var(--ease) 160ms;
}
.card:hover{box-shadow:var(--shadow-raised);transform:translateY(-1px);border-color:var(--border-subtle)}
.card.needs{border-color:rgba(229,32,44,.35);box-shadow:0 0 0 1px rgba(229,32,44,.12),var(--shadow-raised)}
.card-top{height:4px;background:var(--stone-200)}
.card.needs .card-top{background:var(--brand-rot)}
.card-body{padding:34px 14px 16px 14px;padding-right:72px;position:relative;min-height:110px;overflow:visible}
/* Avatar sits top-right; comic Owner-ask bubble anchors on its top-right corner */
.card .avatar-slot{
  position:absolute;top:34px;right:12px;width:48px;height:48px;z-index:4;
  overflow:visible;
}

.card .avatar{
  width:48px;height:48px;border-radius:var(--radius-md);
  object-fit:cover;object-position:center top;background:var(--paper-sunk);
  border:1px solid var(--border-hairline);box-shadow:var(--shadow-card);
  display:block;
}
.card .avatar-fallback{
  width:48px;height:48px;border-radius:var(--radius-md);
  background:var(--brand-schwarz);color:var(--paper);display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.02em;
  border:1px solid var(--border-hairline);
}
/* Comic speech bubble — top-right angle of avatar; 2-word Owner confirm */
.card .comic-say{
  position:absolute;
  /* fully outside avatar: sit above the 48×48 photo */
  left:auto;right:-4px;top:auto;bottom:calc(100% + 8px);
  z-index:6;
  max-width:100px;padding:5px 8px 6px;
  background:#FFFEF2;color:var(--brand-schwarz);
  border:2.5px solid var(--brand-schwarz);border-radius:12px;
  font-family:var(--font-display);font-weight:900;font-size:10px;line-height:1.1;
  letter-spacing:.02em;text-align:center;text-transform:none;
  box-shadow:2px 2px 0 rgba(26,21,25,.16);
  white-space:nowrap;overflow:visible;
  pointer-events:none;animation:comic-pop .35s var(--ease) both;
}

.card .comic-say::after{
  content:"";position:absolute;right:14px;top:100%;bottom:auto;
  width:8px;height:8px;margin-top:-4px;
  background:#FFFEF2;border-right:2.5px solid var(--brand-schwarz);
  border-bottom:2.5px solid var(--brand-schwarz);transform:rotate(45deg);
}

.card.needs .comic-say{border-color:var(--brand-rot);color:var(--brand-rot)}
.card.needs .comic-say::after{border-color:var(--brand-rot)}
@keyframes comic-pop{
  from{opacity:0;transform:scale(.6) translate(4px,-4px)}
  to{opacity:1;transform:scale(1) translate(0,0)}
}
.card .nm{
  font-family:var(--font-display);font-weight:800;font-size:17px;margin-bottom:2px;padding-right:4px;
  line-height:1.15;min-height:calc(1.15em * 2); /* always reserve two name lines */
}
.card .nm .fn,.card .nm .ln{display:block}
/* Second line under name = role only (never email) */
.card .rl{
  color:var(--fg-3);font-size:13px;margin-bottom:10px;padding-right:4px;line-height:1.25;
  font-weight:600;
}
.badges{
  display:flex;flex-wrap:nowrap;align-items:center;gap:3px;
  width:100%;max-width:100%;min-width:0;
}
.b{
  font-family:var(--font-mono);font-size:clamp(8px, 2.1vw, 10px);font-weight:700;
  padding:2px 5px;border-radius:var(--radius-pill);
  background:var(--paper-sunk);color:var(--fg-2);border:1px solid var(--border-hairline);
  flex:1 1 0;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-align:center;line-height:1.2;
  box-sizing:border-box;
}
.b.red{background:rgba(229,32,44,.1);color:var(--brand-rot);border-color:rgba(229,32,44,.25)}
.b.amber{background:rgba(199,122,0,.12);color:var(--status-warning);border-color:rgba(199,122,0,.25)}
.b.blue{background:rgba(13,25,158,.08);color:#0D199E;border-color:rgba(13,25,158,.18)}
.b.green{background:rgba(46,125,79,.1);color:var(--status-success);border-color:rgba(46,125,79,.22)}
.card-foot{
  margin-top:12px;display:flex;align-items:center;justify-content:flex-end;
  gap:8px;min-width:0;
}
.card-foot .status-line{font-size:11px;color:var(--fg-3);font-weight:600;flex:1 1 auto;text-align:left}
.card-foot .status-line em{color:var(--brand-rot);font-style:normal;font-weight:800}
.card-foot{align-items:flex-end}
.card-foot .now-lines{
  flex:1 1 auto;min-width:0;text-align:left;
  font-size:10.5px;font-style:italic;font-weight:500;font-family:var(--font-body);
  color:var(--fg-3);line-height:1.35;
}
.card-foot .now-lines span{
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-foot .now-lines span.muted{opacity:.75}
.card-foot .rank-pill{
  flex-shrink:0;font-family:var(--font-mono);font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:var(--radius-pill);
  background:rgba(13,25,158,.08);color:#0D199E;border:1px solid rgba(13,25,158,.18);
}


/* empty */
.empty{
  text-align:center;padding:40px 20px;background:var(--paper-raised);border-radius:var(--radius-lg);
  border:1px dashed var(--border-subtle);color:var(--fg-2);
}
.empty h3{font-family:var(--font-display);font-weight:800;color:var(--fg-1);margin-bottom:6px}

/* drawer */
.drawer{position:fixed;inset:0;background:rgba(26,21,25,.45);display:none;justify-content:flex-end;z-index:20}
.drawer.on{display:flex}
.panel{
  width:min(540px,100%);background:var(--paper);overflow-y:auto;
  box-shadow:var(--shadow-float);animation:slideIn 200ms var(--ease);
}
@keyframes slideIn{from{transform:translateX(12px);opacity:.6}to{transform:none;opacity:1}}
.panel-head{
  position:sticky;top:0;background:var(--paper-raised);border-bottom:1px solid var(--border-subtle);
  padding:14px 16px;z-index:2;
}
.panel-head .x{
  float:right;width:36px;height:36px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  background:var(--paper-sunk);font-size:18px;line-height:1;display:grid;place-items:center;color:var(--fg-2);
}
.panel-head h2{font-family:var(--font-display);font-weight:900;font-size:20px;padding-right:44px}
.panel-head .rl{color:var(--fg-3);font-size:13px;margin-top:2px}
.panel-body{padding:16px}
.run{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-card);cursor:pointer;
}
.run.hot{border-color:rgba(229,32,44,.4)}
.run .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.run .title{font-weight:800;font-size:14px}
.run .id{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);font-weight:700;margin-right:6px}
.chip{
  font-family:var(--font-meta);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:3px 8px;border-radius:var(--radius-pill);border:1px solid var(--border-hairline);white-space:nowrap;
}
.chip.due{background:rgba(199,122,0,.12);color:var(--status-warning)}
.chip.in_progress{background:rgba(13,25,158,.1);color:#0D199E}
.chip.done{background:rgba(46,125,79,.12);color:var(--status-success)}
.chip.missed,.chip.blocked{background:rgba(229,32,44,.1);color:var(--brand-rot)}
.meta{font-size:12px;color:var(--fg-3);margin-top:4px;font-family:var(--font-mono)}
.bar{height:6px;background:var(--paper-sunk);border-radius:var(--radius-pill);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand-rot);border-radius:var(--radius-pill)}
.det{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-hairline);font-size:13px;color:var(--fg-2);line-height:1.45}
.run.open .det{display:block}
.det b{color:var(--fg-1)}
.det p{margin:0 0 8px}
.brief{
  background:var(--paper-sunk);border:1px solid var(--border-hairline);border-radius:var(--radius-md);
  padding:10px 12px;margin:0 0 10px;font-size:13px;color:var(--fg-1);line-height:1.45;
}
.brief .tag{
  font-family:var(--font-meta);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--brand-rot);font-weight:700;margin-bottom:4px;
}
.brief-why{color:var(--fg-2);font-size:12px;margin-top:6px}
.field{margin:0 0 10px}
.field .lab{
  font-family:var(--font-meta);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--fg-3);font-weight:700;margin-bottom:3px;
}
.field .val{color:var(--fg-1);font-size:13px;line-height:1.4}
.agent-brief{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow-card);font-size:13px;line-height:1.45;color:var(--fg-2);
}
.agent-brief strong{color:var(--fg-1)}
.cad-card{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-md);
  padding:12px;margin-bottom:8px;
}
.cad-card .ct{font-weight:800;font-size:14px;margin-bottom:6px}
.cad-card .cid{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);font-weight:700;margin-right:6px}
.act{display:grid;grid-template-columns:64px 1fr;gap:8px;margin-top:10px}
.act input,.act textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  background:var(--paper);font-size:13px;
}
.act-btns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}

/* KPI */
.kpi-block{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);margin-bottom:14px;overflow:hidden;position:relative;
}
.kpi-block-head{
  position:relative;padding:14px 72px 12px 14px;border-bottom:1px solid var(--border-hairline);
  background:var(--paper-sunk);min-height:64px;
}
.kpi-block-head .avatar{
  position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:var(--radius-md);
  object-fit:cover;object-position:center top;background:var(--paper-raised);
  border:1px solid var(--border-hairline);box-shadow:var(--shadow-card);display:block;
}
.kpi-block-head .avatar-fallback{
  position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:var(--radius-md);
  background:var(--brand-schwarz);color:var(--paper);display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:14px;
  border:1px solid var(--border-hairline);
}
.kpi-block-head .nm{
  font-family:var(--font-display);font-weight:800;font-size:16px;
  line-height:1.15;min-height:calc(1.15em * 2);
}
.kpi-block-head .nm .fn,.kpi-block-head .nm .ln{display:block}
.kpi-block-head .rl{color:var(--fg-3);font-size:12px;margin-top:2px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:12px 14px 14px}
.ktile{
  background:var(--paper);border:1px solid var(--border-hairline);border-radius:var(--radius-md);
  padding:12px;box-shadow:none;
}
.ktile.miss{border-color:rgba(229,32,44,.4)}
.ktile .m{font-size:13px;font-weight:600;color:var(--fg-2);min-height:36px;line-height:1.3}
.ktile .v{font-family:var(--font-mono);font-size:20px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
.ktile .v.missed{color:var(--brand-rot)}
.ktile .tg{font-size:11px;color:var(--fg-3);margin-top:4px}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brand-schwarz);color:#fff;
  padding:10px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;box-shadow:var(--shadow-float);
  z-index:30;display:none;
}
.toast.on{display:block}

@media(max-width:640px){
  .top-inner{align-items:stretch}
  .tabs,.actions{width:100%}
  .tab,.btn{flex:1;text-align:center}
  .hero{padding:16px}
}

/* Agent chat (OpenRouter) */
.chat-wrap{margin-top:8px;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--paper-raised);overflow:hidden}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border-hairline);background:var(--paper-sunk)}
.chat-head h3{font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0}
.chat-head .hint{font-size:11px;color:var(--fg-3);font-weight:600}
.chat-log{max-height:320px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.chat-msg{max-width:92%;padding:9px 11px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.chat-msg.user{align-self:flex-end;background:var(--brand-schwarz);color:#fff;border-bottom-right-radius:4px}
.chat-msg.assistant{align-self:flex-start;background:#FFFEF2;border:1.5px solid var(--border-subtle);color:var(--fg-1);border-bottom-left-radius:4px}
.chat-msg .who{display:block;font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:4px;font-weight:700}
.chat-msg .ch{font-weight:600;opacity:.85;letter-spacing:.06em}
.chat-msg.tg{box-shadow:inset 3px 0 0 #2AABEE}
.chat-msg.err{border-color:var(--brand-rot);color:var(--brand-rot)}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border-hairline);background:var(--paper-raised)}
.chat-form textarea{flex:1;min-height:88px;max-height:280px;resize:vertical;border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 12px;font:14px/1.45 var(--font-body);background:var(--paper)}
.chat-form textarea:focus{outline:2px solid rgba(229,32,44,.25);border-color:var(--brand-rot)}
.chat-form button{align-self:flex-end;white-space:nowrap}
.chat-empty{color:var(--fg-3);font-size:12px;text-align:center;padding:18px 8px}
.chat-head h3{text-transform:none;letter-spacing:0;font-size:15px}
/* Compete drivers accordion — closed by default */
.cidx-acc{margin-top:8px;border-top:1px solid var(--border-hairline);padding-top:8px}
.cidx-acc > summary{
  cursor:pointer;list-style:none;font-size:12px;font-weight:700;color:var(--fg-3);
  font-family:var(--font-meta);letter-spacing:.08em;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;
}
.cidx-acc > summary::-webkit-details-marker{display:none}
.cidx-acc > summary::after{content:"▸";font-size:11px}
.cidx-acc[open] > summary::after{content:"▾"}
.cidx-acc .cidx-row,.cidx-acc .comp-grid span{font-size:13px}
.panel-head .rl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Seminar / Quick Meeting modal */
#sem-modal.on{display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.sem-panel{
  width:min(560px,100%);background:var(--paper);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-float);border:1px solid var(--border-hairline);margin:auto;
}
.sem-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--border-hairline);background:var(--paper-raised);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
}
.sem-head h2{margin:0;font-family:var(--font-display);font-size:18px;font-weight:800}
.sem-body{padding:16px}
.sem-lead{font-size:13px;color:var(--fg-2);line-height:1.45;margin:0 0 14px}
.sem-label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin:10px 0 6px}
.sem-input,.sem-ta{
  width:100%;box-sizing:border-box;border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  padding:8px 10px;font:13px/1.4 var(--font-body);background:var(--paper-raised);color:var(--fg-1);
}
.sem-ta{min-height:120px;resize:vertical}
.sem-select{max-width:160px}
.sem-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sem-active-title{font-family:var(--font-display);font-weight:800;font-size:16px;margin:0 0 8px}
.sem-material{
  white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.45;color:var(--fg-1);
  background:var(--paper-sunk);border-radius:var(--radius-md);padding:12px;margin-bottom:14px;
  border:1px solid var(--border-hairline);max-height:180px;overflow-y:auto;
}
.sem-prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em}
.sem-prog-head b{font-size:16px;color:var(--fg-1);font-family:var(--font-display)}
.sem-prog{height:12px;background:var(--paper-sunk);border-radius:999px;overflow:hidden;border:1px solid var(--border-hairline)}
.sem-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-schwarz),var(--brand-rot));border-radius:999px;transition:width .35s ease}
.sem-prog-meta{font-size:12px;margin:6px 0 14px}
.sem-sec{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin:14px 0 8px}
.sem-q-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.sem-q{border:1px solid var(--border-hairline);border-radius:var(--radius-md);background:var(--paper-raised);overflow:hidden}
.sem-q.open{border-color:rgba(229,32,44,.3)}
.sem-q-btn{
  display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;cursor:pointer;color:inherit;font:inherit;
}
.sem-q-btn.static{cursor:default}
.sem-q-who{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:4px}
.sem-q-text{display:block;font-size:13.5px;line-height:1.4;color:var(--fg-1);font-weight:600}
.sem-q-hint{display:block;font-size:11px;color:var(--brand-rot);margin-top:4px;font-weight:600}
.sem-ans-wrap{padding:0 12px 10px}
.sem-ans{width:100%;box-sizing:border-box;min-height:56px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:8px;font:13px/1.4 var(--font-body)}
.sem-a{padding:0 12px 10px;font-size:13px;line-height:1.45;color:var(--fg-2);font-style:italic}
.sem-ask-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sem-ask-row .sem-input:not(.sem-select){flex:1 1 160px}



/* Agent report to Owner */
.owner-snap{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  padding:14px;margin-bottom:14px;box-shadow:var(--shadow-card);
}
.owner-snap .job{
  font-size:14px;line-height:1.45;color:var(--fg-1);margin:0 0 10px;font-weight:600;
}
.owner-snap .now-work-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.owner-snap .now-work-list li{font-size:13.5px;line-height:1.45;color:var(--fg-1);font-weight:500}
.owner-snap .now-work-list li b{font-weight:800;color:var(--fg-1)}
.owner-snap .now-work-list li .st{
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--fg-3);margin-left:6px;font-style:normal;
}
.owner-snap .now-work-list li .ex{display:block;margin-top:3px;color:var(--fg-2);font-weight:500;font-size:13px}
.owner-snap .now-head{
  font-family:var(--font-meta);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--fg-3);margin:0 0 8px;
}
.owner-snap .briefing{
  font-size:14px;line-height:1.5;color:var(--fg-1);margin:0;
  padding:12px 14px;background:var(--paper-sunk);border-radius:var(--radius-md);
  border-left:3px solid var(--brand-rot);
}
.owner-snap .briefing em{font-style:normal;font-weight:800;color:var(--brand-schwarz)}
.report-card{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow-card);
}
.report-card.hot{border-color:rgba(229,32,44,.45);box-shadow:0 0 0 1px rgba(229,32,44,.1)}
.report-card .rc-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
.report-card .rc-title{font-weight:800;font-size:15px;line-height:1.3;margin:0;color:var(--fg-1)}
.report-card .rc-state{
  flex-shrink:0;font-family:var(--font-meta);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:5px 9px;border-radius:var(--radius-pill);white-space:nowrap;
}
.report-card .rc-state.stuck{background:rgba(229,32,44,.1);color:var(--brand-rot)}
.report-card .rc-state.missed{background:rgba(229,32,44,.08);color:var(--brand-rot)}
.report-card .rc-state.doing{background:rgba(47,100,180,.1);color:#2F64B4}
.report-card .rc-state.done{background:rgba(46,125,79,.1);color:var(--status-success)}
.report-card .rc-say{
  font-size:13px;line-height:1.5;color:var(--fg-2);margin:0 0 10px;
}
.report-card .rc-say strong{color:var(--fg-1);font-weight:700}
.report-card .rc-pct-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.report-card .rc-pct-row .lbl{font-size:11px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-meta)}
.report-card .rc-pct-row .val{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--fg-1)}
.report-card .rc-bar{height:8px;background:var(--paper-sunk);border-radius:999px;overflow:hidden;border:1px solid var(--border-hairline)}
.report-card .rc-bar i{display:block;height:100%;background:linear-gradient(90deg,#2F64B4,var(--brand-rot));border-radius:999px;transition:width .25s var(--ease)}
.report-card .rc-bar i.done{background:var(--status-success)}
.report-card .rc-bar i.hot{background:var(--brand-rot)}
.report-card .rc-next{
  margin-top:10px;padding-top:10px;border-top:1px solid var(--border-hairline);
  font-size:12px;color:var(--fg-3);line-height:1.4;
}
.report-card .rc-next b{color:var(--fg-2)}
.owner-sec{margin:18px 0 10px;font-family:var(--font-meta);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.owner-empty{padding:16px;text-align:center;color:var(--fg-3);font-size:13px;background:var(--paper-sunk);border-radius:var(--radius-lg)}
.acc-not-started{

<body>
<div class="ribbon"></div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $ = q => document.querySelector(q);
const normalizeKey = k => (k||'').trim().replace(/^Bearer\s+/i,'').trim().replace(/^["']|["']$/g,'');
let KEY = normalizeKey(localStorage.getItem('dasorg_key')||'');
let view = 'board'; const chatHist={}; let chatBusy=false, agents = [], cur = null;

const STATUS = {
  due: 'Due now',
  in_progress: 'In progress',
  done: 'Done',
  missed: 'Missed',
  blocked: 'Blocked'
};

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2400);
}

async function api(p, o={}){
  // Open board: no API key required for now
  const headers = {
    'content-type': 'application/json',
    ...(o.headers||{})
  };
  if (KEY) headers['authorization'] = 'Bearer ' + KEY;
  const { signal, ...rest } = o;
  const r = await fetch('/api'+p, { ...rest, headers, signal });
  if (r.status === 401){
    // Only if server re-enables DASORG_REQUIRE_KEY=1
    KEY = '';
    localStorage.removeItem('dasorg_key');
    sessionStorage.setItem('dasorg_err', 'API key required (DASORG_REQUIRE_KEY=1). Paste key from SECRETS/dasorg.md.');
    render();
    throw 0;
  }
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); } catch {
    throw new Error(r.ok ? 'Bad JSON from API' : ('HTTP '+r.status+': '+text.slice(0,120)));
  }
  if (!r.ok && data && data.error) {
    const err = new Error(data.error + (data.detail ? (': '+data.detail) : ''));
    err.data = data;
    throw err;
  }
  return data;
}

function setKey(){
  KEY = normalizeKey(document.getElementById('k').value);
  if (!KEY || KEY.length < 32){
    sessionStorage.setItem('dasorg_err', 'Key is too short. Copy the full Key value from SECRETS/dasorg.md (64 hex characters).');
    render();
    return;
  }
  localStorage.setItem('dasorg_key', KEY);
  sessionStorage.removeItem('dasorg_err');
  render();
}

function logout(){
  KEY = '';
  localStorage.removeItem('dasorg_key');
  sessionStorage.removeItem('dasorg_err');
  render();
}

function go(v){ view = v; render(); }

function render(){
  // Open access: no login screen
  sessionStorage.removeItem('dasorg_err');

  $('#app').innerHTML = `
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <h1>DASORG</h1>
          <div class="sub">Founding Ten · live tasks</div>
        </div>
        <nav class="tabs">
          <button class="tab ${view==='board'?'on':''}" onclick="go('board')">Team board</button>
          <button class="tab ${view==='kpi'?'on':''}" onclick="go('kpi')">KPI wall</button>
        </nav>
        <div class="actions">
          <button class="btn btn-dark" onclick="openSeminar()" title="Hold a conference / quick meeting — paste text or link">Seminar</button>
          <button class="btn btn-dark" onclick="doGen()" title="Create due runs for this period">Refresh schedule</button>
          <button class="btn btn-ghost" onclick="doExport()" title="Write finished runs to MEMORY.md">Export to canon</button>
          ${KEY ? `<button class="btn btn-ghost" onclick="logout()">Log out</button>` : ``}
        </div>
      </div>
    </header>
    <main id="body"><p class="sec">Loading…</p></main>
    <div class="drawer" id="dr" onclick="if(event.target.id==='dr')closeDr()">
      <div class="panel" id="panel"></div>
    </div>
    <div class="sw-backdrop" id="sw" onclick="if(event.target.id==='sw')closeStatusWidget()" role="dialog" aria-modal="true" aria-labelledby="sw-title"></div>
    <div class="sw-backdrop" id="sem-modal" onclick="if(event.target.id==='sem-modal')closeSeminar()" role="dialog" aria-modal="true"></div>`;

  if (view === 'board') loadBoard();
  else loadKpi();
}

/** Status bucket keys for pulse filters / widget */
const STATUS_BUCKETS = {
  blocked_missed: {
    label: 'Blocked / missed',
    short: 'Fix first',
    match: r => r.status === 'blocked' || r.status === 'missed',
    apiStatus: null,
  },
  due: {
    label: 'Due — waiting to start',
    short: 'Due',
    match: r => r.status === 'due',
    apiStatus: 'due',
  },
  in_progress: {
    label: 'In progress',
    short: 'In work',
    match: r => r.status === 'in_progress',
    apiStatus: 'in_progress',
  },
  done7: {
    label: 'Done this week',
    short: 'Done 7d',
    match: r => r.status === 'done',
    apiStatus: 'done',
  },
};

let statusWidgetKey = null;
let runsCache = null;

async function fetchAllRuns(){
  if (runsCache) return runsCache;
  try {
    runsCache = await api('/runs');
    if (!Array.isArray(runsCache)) runsCache = [];
  } catch(e) {
    runsCache = [];
  }
  return runsCache;
}

function invalidateRunsCache(){ runsCache = null; }

function processStripHtml(activeKey, counts){
  const keys = ['blocked_missed','due','in_progress','done7'];
  return `<div class="sw-process">${keys.map(k => {
    const b = STATUS_BUCKETS[k];
    const n = counts[k]||0;
    return `<button type="button" class="${k===activeKey?'on':''}" onclick="event.stopPropagation();openStatusWidget('${k}')">
      ${esc(b.short)}<span class="n">${n}</span>
    </button>`;
  }).join('')}</div>`;
}

function runBrief(r){
  const n = (r.note || '').trim();
  if (n) return n;
  const d = (r.description || '').trim();
  if (d) return d;
  return r.done_criterion ? `Done looks like: ${r.done_criterion}` : 'No brief yet — open agent to work this run.';
}

function agentNameFromSlug(slug){
  const a = (agents||[]).find(x => x.slug === slug);
  return a ? a.name : slug;
}

function agentRoleFromSlug(slug){
  const a = (agents||[]).find(x => x.slug === slug);
  return a ? (a.role || '') : '';
}

/** Concrete Owner ask for comic bubble (specific, no generic OK) (null = no bubble). */
function ownerAskTwoWords(runsForAgent, slug){
  // Bubble: 2–3 words = THIS agent's real work/problem. Prefer blocked/missed. No "due list" jargon.
  const open = (runsForAgent || []).filter(r =>
    r.status === 'blocked' || r.status === 'missed' || r.status === 'due' || r.status === 'in_progress'
  );
  if (!open.length) return null;
  // Prefer PROBLEM tasks for the bubble (what Boss cares about)
  const problems = open.filter(r => r.status === 'blocked' || r.status === 'missed');
  const active = open.filter(r => r.status === 'in_progress');
  const order = { blocked:0, missed:1, in_progress:2, due:3 };
  const pool = problems.length ? problems : (active.length ? active : open);
  pool.sort((a,b) => (order[a.status]??9)-(order[b.status]??9) || String(a.task_id||'').localeCompare(String(b.task_id||'')));
  const top = pool[0];
  // Meta "list of dues" is not a Boss bubble — fall through to real work words
  // Never surface abstract "due list" — only real work / problems
  let pick = top;
  if (normalizeTaskId(top.task_id) === 'A1') {
    pick = open.find(r => normalizeTaskId(r.task_id) !== 'A1') || top;
  }
  return fewWordsForBubble(pick, slug || '');
}

function normalizeTaskId(taskId){
  const u = String(taskId || '').toUpperCase().trim();
  const m = u.match(/^([A-Z]{1,3}\d{1,2}|XA)\b/);
  return m ? m[1] : u.replace(/[^A-Z0-9]/g,'').slice(0, 6);
}

/** 2–3 words (max 4) for this agent + this task only. */
function fewWordsForBubble(r, slug){
  if (!r) return null;
  const id = normalizeTaskId(r.task_id);
  const title = String(r.title || '');
  const defaults = {
    'lena-sergeeva': 'Needs Boss',
    'lauda-briana': 'B2B hunt',
    'alexandra-obnorskaya': 'FBO cover',
    'roberta-di-maria': 'Off-site',
    'marika-nowicka': 'Creative',
    'valentina-korolyeva': 'Contracts',
    'justina-timber': 'Budget J7',
    'mina-rutunya': 'Infra',
    'zina-pevtsova': 'Stock flow',
    'maya-krasochkina': 'Product truth',
  };

  // Unique labels by task id — primary source of truth
  const byId = {
    A1: 'Needs Boss', A2: 'Daily brief', A3: 'Stale work', A4: 'KPI week', A5: 'Priorities', A6: 'Seminar',
    L1: 'B2B leads', L2: 'Follow-ups', L3: 'Pipeline', L4: 'Sales deck', L5: 'Dead leads', L6: 'Sales angle',
    S1: 'FBO cover', S2: 'Reviews', S3: 'Listings', S4: 'Rival scan', S5: 'Unit econ', S6: 'Supply ask',
    R1: 'SEO blog', R2: 'SERP check', R3: 'Calendar', R4: 'Partners', R5: 'Content audit',
    XA: 'Off-site',
    M1: 'Creatives', M2: 'Brand book', M3: 'Motion', M4: 'Asset lib', M5: 'Packaging', M6: 'Brand plain',
    V1: 'Expiry watch', V2: 'Due diligence', V3: 'Regulatory', V4: 'Legal matrix', V5: 'Contract draft',
    J1: 'FX check', J2: 'Margins', J3: 'Invoices', J4: 'Price matrix', J5: 'Acquirers', J6: 'Web metrics', J7: 'Budget J7',
    N1: 'Workers up', N2: 'Token rotate', N3: 'Deploy', N4: 'Snapshot', N5: 'Backups', N6: 'Infra check',
    Z1: 'Stock health', Z2: 'Shipments', Z3: 'Supply SLA', Z4: 'Landed cost', Z5: '3PL score', Z6: 'HS codes',
    K1: 'Intel sweep', K2: 'Formula gate', K3: 'Distill', K4: 'Claims audit', K5: 'R&D pipeline', K6: 'Science note',
    G1: 'Morning report', G2: 'GEO deep-read', G3: 'GEO map', G4: 'AI crawlers', G5: 'Entity pack', G6: 'GEO roll-up',
  };
  if (byId[id]) return clampBubbleWords(byId[id]);

  // Role + top-run only (never other agents' notes)
  const topLow = (title + ' ' + String(r.note||'') + ' ' + id).toLowerCase();
  const roleOnly = {
    'justina-timber': [[/purchase|conversion|ads goal/i,'Ads purchase'],[/budget|j7|feasib|spend/i,'Budget J7'],[/matrix|price/i,'Price matrix']],
    'roberta-di-maria': [[/\bxa\b|external|citation/i,'Off-site'],[/blog|seo/i,'SEO blog'],[/send|emailer/i,'Send copy']],
    'lauda-briana': [[/lead|b2b|hunt|distributor/i,'B2B leads'],[/deck/i,'Buyer deck'],[/send|emailer/i,'Send copy'],[/pipeline/i,'Pipeline']],
    'lena-sergeeva': [[/brief/i,'Daily brief'],[/due/i,'Open problems'],[/seminar/i,'Seminar']],
    'alexandra-obnorskaya': [[/fbo|cover/i,'FBO cover'],[/review/i,'Reviews'],[/listing/i,'Listings']],
    'marika-nowicka': [[/creative|batch/i,'Creatives'],[/pack|photo|shot/i,'Pack shots'],[/brand/i,'Brand work']],
    'valentina-korolyeva': [[/sign|contract/i,'You sign'],[/dd|diligence/i,'Due diligence']],
    'mina-rutunya': [[/token|oauth/i,'Token rotate'],[/deploy/i,'Deploy'],[/health|worker/i,'Workers up']],
    'zina-pevtsova': [[/stock|cover/i,'Stock health'],[/ship/i,'Shipments']],
    'maya-krasochkina': [[/claim/i,'Claims audit'],[/formula/i,'Formula gate'],[/intel|research/i,'Intel sweep']],
    'julian-farah': [[/morning|report|finding|digest/i,'Morning report'],[/telegram|news|uber/i,'GEO research'],[/crawler|bot/i,'AI crawlers'],[/entity|answer/i,'Entity pack']],
  };
  for (const [re, lab] of (roleOnly[slug] || [])) {
    if (re.test(topLow)) return clampBubbleWords(lab);
  }

  // Distill title: max 3 words
  let raw = title.replace(/^[A-Z]{1,3}\d+\s*[—–:-]\s*/,'').replace(/\s+/g,' ').trim();
  if (!raw) raw = defaults[slug] || 'Open work';
  const stop = new Set(['the','a','an','of','to','for','and','or','on','in','at','this','that','every','from','with','one','our','her','his','is','are','be','as','when','before','after','only']);
  let words = raw.split(/\s+/).filter(w => {
    const k = w.toLowerCase().replace(/[^a-z0-9]/g,'');
    return k && !stop.has(k) && !['purchase','goal','goals','only'].includes(k);
  }).slice(0, 3);
  let label = words.map(w => w.replace(/[^a-zA-Z0-9/-]/g,'')).filter(Boolean).join(' ');
  if (!label || /^purchase/i.test(label)) label = defaults[slug] || 'Open work';
  return clampBubbleWords(label);
}

function clampBubbleWords(s){
  let w = String(s||'').trim().split(/\s+/).filter(Boolean);
  if (w.length > 3) w = w.slice(0, 3);
  let out = w.join(' ');
  if (out.length > 22) out = w.slice(0, 2).join(' ');
  // never the collapsed generic
  if (/^purchase\s*goal$/i.test(out)) out = 'Open work';
  return out;
}

/** After all cards computed — force unique bubble text across the board */
function uniquifyOwnerAsks(list){
  const used = new Map(); // lower -> count
  return list.map(a => {
    let ask = a.ownerAsk;
    if (!ask) return a;
    const base = ask;
    let key = ask.toLowerCase();
    let n = used.get(key) || 0;
    if (n > 0) {
      // disambiguate with agent first name — still short
      const fn = (a.name || a.slug || '?').split(/[\s-]/)[0];
      const short = fn.slice(0, 6);
      ask = clampBubbleWords(base.split(/\s+/).slice(0, 2).join(' ') + ' ' + short);
      key = ask.toLowerCase();
      let k = 2;
      while (used.has(key) && k < 5) {
        ask = clampBubbleWords(base.split(/\s+/).slice(0, 1).join(' ') + ' ' + short + k);
        key = ask.toLowerCase();
        k++;
      }
    }
    used.set(key, (used.get(key) || 0) + 1);
    return { ...a, ownerAsk: ask };
  });
}






function comicBubbleHtml(ask, slug){
  if (!ask) return '';
  const s = slug || '';
  // data-* avoids broken onclick quotes; bubble opens chat with this agent
  return `<div class="comic-say comic-say-btn" role="button" tabindex="0"
    data-slug="${esc(s)}" data-ask="${esc(ask)}"
    title="Open chat — ${esc(ask)}"
    onclick="event.stopPropagation();openAgentChat(this.dataset.slug, this.dataset.ask)"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();openAgentChat(this.dataset.slug, this.dataset.ask)}">${esc(ask)}</div>`;
}

function statusRowHtml(r){
  const role = agentRoleFromSlug(r.agent_slug);
  const pct = Math.max(0, Math.min(100, +r.percent || (r.status==='done'?100:0)));
  const st = r.status || '';
  return `<div class="sw-row" onclick="closeStatusWidget();openAgent('${esc(r.agent_slug)}')">
    <div class="top">
      <div>
        <div class="agent">${esc(agentNameFromSlug(r.agent_slug))}</div>
        <div class="mail">${esc(role || '—')}</div>
      </div>
      <span class="b ${st==='blocked'||st==='missed'?'red':st==='due'?'amber':st==='in_progress'?'blue':'green'}">${esc(st)}</span>
    </div>
    <div class="task">${esc(r.title || r.task_id || 'Task')}</div>
    <div class="brief">${esc(runBrief(r))}</div>
    <div class="meta">Run #${r.id} · due ${esc(r.due_date||'—')} · ${esc(r.cadence||'')} · ${pct}%</div>
    ${meterHtml('Completeness', pct, st==='done'||pct>=80?'ok':st==='in_progress'?'blue':pct>0?'warn':'')}
  </div>`;
}

async function openStatusWidget(key){
  const bucket = STATUS_BUCKETS[key];
  if (!bucket) return;
  statusWidgetKey = key;
  const el = document.getElementById('sw');
  if (!el) return;
  el.classList.add('on');
  el.innerHTML = `<div class="sw"><div class="sw-head"><button type="button" class="sw-x" onclick="closeStatusWidget()" aria-label="Close">×</button>
    <h3 id="sw-title">Loading…</h3><p>Fetching runs…</p></div></div>`;

  const all = await fetchAllRuns();
  const counts = { blocked_missed:0, due:0, in_progress:0, done7:0 };
  all.forEach(r => {
    if (r.status==='blocked'||r.status==='missed') counts.blocked_missed++;
    else if (r.status==='due') counts.due++;
    else if (r.status==='in_progress') counts.in_progress++;
    else if (r.status==='done') counts.done7++;
  });
  let rows = all.filter(bucket.match);
  // for done7 prefer recent if we have completed_at
  if (key === 'done7') {
    const weekAgo = Date.now() - 8*24*3600*1000;
    const recent = rows.filter(r => r.completed_at && new Date(r.completed_at).getTime() >= weekAgo);
    if (recent.length) rows = recent;
  }
  // sort: hot first
  const order = { blocked:0, missed:1, due:2, in_progress:3, done:4 };
  rows.sort((a,b) => (order[a.status]??9)-(order[b.status]??9) || String(a.due_date).localeCompare(String(b.due_date)));

  const listHtml = rows.length
    ? rows.slice(0, 40).map(statusRowHtml).join('')
    : `<div class="sw-empty">No runs in this status right now.</div>`;

  el.innerHTML = `<div class="sw" onclick="event.stopPropagation()">
    <div class="sw-head">
      <button type="button" class="sw-x" onclick="closeStatusWidget()" aria-label="Close">×</button>
      <h3 id="sw-title">${esc(bucket.label)}</h3>
      <p>${rows.length} run${rows.length===1?'':'s'} · click a row to open the agent. Process strip switches status.</p>
      ${processStripHtml(key, counts)}
    </div>
    <div class="sw-body">${listHtml}</div>
  </div>`;

  // mark legend buttons
  document.querySelectorAll('.legend .leg-btn').forEach(btn => {
    btn.classList.toggle('on', btn.getAttribute('data-status') === key);
  });
}

function closeStatusWidget(){
  statusWidgetKey = null;
  const el = document.getElementById('sw');
  if (el){ el.classList.remove('on'); el.innerHTML = ''; }
  document.querySelectorAll('.legend .leg-btn').forEach(btn => btn.classList.remove('on'));
}

function sumNeeds(s){
  return (+s.missed||0) + (+s.blocked||0) + (+s.due||0) + (+s.prog||0);
}

/** Org chart order — CoS (Lena) on top, then heads as in ORG.md hierarchy */
const ORG_ORDER = [
  'lena-sergeeva',        // Chief of Staff

function stackBarHtml(s, size){
  const b = +s.blocked||0, m = +s.missed||0, d = +s.due||0, p = +s.prog||0, done = +s.done7||0;
  const t = b+m+d+p+done;
  if (!t) return `<div class="stack-bar ${size||''}"><i class="seg-idle" style="width:100%"></i></div>`;
  const w = n => Math.max(n?2:0, Math.round((n/t)*100));
  let segs = '';
  if (b) segs += `<i class="seg-blocked" style="width:${w(b)}%" title="Blocked ${b}"></i>`;
  if (m) segs += `<i class="seg-missed" style="width:${w(m)}%" title="Missed ${m}"></i>`;
  if (d) segs += `<i class="seg-due" style="width:${w(d)}%" title="Due ${d}"></i>`;
  if (p) segs += `<i class="seg-prog" style="width:${w(p)}%" title="In work ${p}"></i>`;
  if (done) segs += `<i class="seg-done" style="width:${w(done)}%" title="Done 7d ${done}"></i>`;
  return `<div class="stack-bar ${size||''}">${segs}</div>`;
}

function meterHtml(label, pct, tone){
  const p = Math.max(0, Math.min(100, +pct||0));
  const cls = tone === 'ok' ? 'ok' : tone === 'warn' ? 'warn' : tone === 'blue' ? 'blue' : tone === 'gold' ? 'gold' : tone === 'green' ? 'green' : '';
  return `<div class="meter">
    <div class="meter-row"><span class="lbl">${esc(label)}</span><span class="val">${p}</span></div>
    <div class="meter-track"><i class="${cls}" style="width:${p}%"></i></div>
  </div>`;
}

/** Org averages from agent.knowledge — stacked gold|green|blue (conservative fill) */
function knowledgeOrgAvg(list){
  const rows = (list || []).map(a => a.knowledge).filter(Boolean);
  if (!rows.length) return { overall: 0, self_learned: 0, research: 0, level: 0, corporate: 0 };
  const avg = k => Math.round(rows.reduce((s, r) => s + (+r[k] || 0), 0) / rows.length);
  const corporate = avg('corporate');
  const self_learned = avg('self_learned');
  const research = avg('research');
  return {
    corporate,
    self_learned,
    research,
    overall: corporate + self_learned + research,
    level: avg('level')
  };
}

/** Org averages for competitiveness stacked bar */
function competitivenessOrgAvg(list){
  const rows = (list || []).map(a => a.competitiveness).filter(c => c && c.index != null);
  const empty = {
    index: 5,
    pct: 50,
    components: { activity: 5, completion: 5, results: 5, reliability: 5, engagement: 5, knowledge: 5 }
  };
  if (!rows.length) return empty;
  const avg = k => rows.reduce((s, r) => s + (+(r.components && r.components[k]) || 0), 0) / rows.length;
  const components = {
    activity: Math.round(avg('activity') * 10) / 10,
    completion: Math.round(avg('completion') * 10) / 10,
    results: Math.round(avg('results') * 10) / 10,
    reliability: Math.round(avg('reliability') * 10) / 10,
    engagement: Math.round(avg('engagement') * 10) / 10,
    knowledge: Math.round(avg('knowledge') * 10) / 10
  };
  const index = rows.reduce((s, r) => s + (+r.index || 0), 0) / rows.length;
  // Generous relative scale: index 0–10 → fill 0–100% (top can show 80–90%)
  const pct = Math.max(0, Math.min(100, Math.round(index * 10)));
  return { index: Math.round(index * 10) / 10, pct, components };
}

/** One knowledge track: gold | green | blue stacked (widths = segment %, empty = still to learn) */
function knowledgeStackBarHtml(k, size){
  const gold = Math.max(0, +((k && k.corporate) || 0));
  const green = Math.max(0, +((k && k.self_learned) || 0));
  const blue = Math.max(0, +((k && k.research) || 0));
  let segs = '';
  if (gold > 0) segs += `<i class="seg-gold" style="width:${gold}%" title="Corporate ${gold}%"></i>`;
  if (green > 0) segs += `<i class="seg-green" style="width:${green}%" title="Self-learned ${green}%"></i>`;
  if (blue > 0) segs += `<i class="seg-blue" style="width:${blue}%" title="Research ${blue}%"></i>`;
  if (!segs) segs = `<i class="seg-idle" style="width:100%" title="Still to learn"></i>`;
  return `<div class="stack-bar ${size || 'sm'}">${segs}</div>`;
}

/**
 * One competitiveness track: drivers stacked with separate colors.
 * totalPct is generous relative fill (index×10), segments share that fill by weight×score.
 */
function competitivenessStackBarHtml(components, totalPct, size){
  const weights = {
    activity: 0.18,
    completion: 0.22,
    results: 0.2,
    reliability: 0.18,
    engagement: 0.12,
    knowledge: 0.1
  };
  const classes = {
    activity: 'seg-act',
    completion: 'seg-comp',
    results: 'seg-res',
    reliability: 'seg-rel',
    engagement: 'seg-eng',
    knowledge: 'seg-know'
  };
  const labels = {
    activity: 'Activity',
    completion: 'Completion',
    results: 'Results',
    reliability: 'Reliability',
    engagement: 'Engagement',
    knowledge: 'Knowledge'
  };
  const c = components || {};
  const keys = Object.keys(weights);
  const contrib = keys.map(k => Math.max(0, (+c[k] || 0) * weights[k]));
  const sum = contrib.reduce((a, b) => a + b, 0);
  const fill = Math.max(0, Math.min(100, +totalPct || 0));
  if (fill <= 0 || sum <= 0) {
    return `<div class="stack-bar ${size || 'sm'}"><i class="seg-idle" style="width:100%" title="No competitiveness signal"></i></div>`;
  }
  let segs = '';
  keys.forEach((k, i) => {
    const w = Math.max(contrib[i] > 0 ? 1 : 0, Math.round((contrib[i] / sum) * fill));
    if (w > 0) {
      segs += `<i class="${classes[k]}" style="width:${w}%" title="${labels[k]} ${(+c[k] || 0).toFixed(1)}/10"></i>`;
    }
  });
  return `<div class="stack-bar ${size || 'sm'}">${segs}</div>`;
}

/** Card/drawer: single knowledge stacked bar (conservative) */
function knowledgeBarsHtml(k, compact){
  if (!k) {
    return `<div class="card-bars"><div class="meter-row"><span class="lbl">Knowledge</span><span class="val">—</span></div>
      <div class="stack-bar sm"><i class="seg-idle" style="width:100%"></i></div></div>`;
  }
  const gold = +k.corporate || 0;
  const green = +k.self_learned || 0;
  const blue = +k.research || 0;
  const overall = Math.max(0, Math.min(100, +k.overall || (gold + green + blue)));
  const level = Math.max(0, Math.min(10, +k.level || Math.round(overall / 10)));
  return `<div class="card-bars">
    <div class="meter">
      <div class="meter-row">
        <span class="lbl">'Knowledge'</span>
        <span class="val">${overall}%</span>
      </div>
      ${knowledgeStackBarHtml(k, compact ? 'sm' : '')}
    </div>
    ${compact ? '' : `<div class="know-level"><span>Still to learn · level</span><b>${level}/10</b></div>`}
  </div>`;
}

/** Shared: open runs sorted for "what they are doing now". */
function openRunsNow(runs){
  const open = (runs || []).filter(r =>
    r.status === 'due' || r.status === 'in_progress' || r.status === 'blocked' || r.status === 'missed'
  );
  const rank = { blocked: 0, missed: 1, in_progress: 2, due: 3 };
  open.sort((a, b) => (rank[a.status] ?? 9) - (rank[b.status] ?? 9)
    || String(a.task_id || '').localeCompare(String(b.task_id || '')));
  return open;
}

function runNowTitle(r){
  const id = (typeof normalizeTaskId === 'function') ? normalizeTaskId(r.task_id) : String(r.task_id || '');
  const brief = (typeof TASK_BRIEF !== 'undefined') ? (TASK_BRIEF[id] || TASK_BRIEF[r.task_id]) : null;
  let line = brief && brief.what
    ? String(brief.what).replace(/\.$/, '')
    : (typeof plainTitle === 'function' ? plainTitle(r.title, r.task_id) : (r.title || id));
  return String(line).replace(/\s+/g, ' ').trim();
}

function runNowExplain(r){
  const id = (typeof normalizeTaskId === 'function') ? normalizeTaskId(r.task_id) : String(r.task_id || '');
  const brief = (typeof TASK_BRIEF !== 'undefined') ? (TASK_BRIEF[id] || TASK_BRIEF[r.task_id]) : null;
  let explain = (brief && brief.why) || r.description || '';
  explain = String(explain).replace(/\s+/g, ' ').trim();
  if (explain.length > 160) explain = explain.slice(0, 157) + '…';
  return explain;
}

/** Drawer top: list of open tasks with short explain (not static role bio). */
function nowWorkingSummaryHtml(runs, tasks){
  const focus = openRunsNow(runs).slice(0, 5);
  if (!focus.length) {
    return `<p class="now-head">Working on now</p><p class="job" style="margin:0;color:var(--fg-3);font-weight:500">Nothing open on the board right now.</p>`;
  }
  const taskById = {};
  (tasks || []).forEach(t => { taskById[t.id] = t; });
  const items = focus.map(r => {
    const title = runNowTitle(r);
    let explain = runNowExplain(r);
    if (!explain && taskById[r.task_id] && taskById[r.task_id].description) {
      explain = String(taskById[r.task_id].description).replace(/\s+/g, ' ').trim();
      if (explain.length > 160) explain = explain.slice(0, 157) + '…';
    }
    const stLabel = r.status === 'in_progress' ? 'In progress'
      : r.status === 'due' ? 'Due'
      : r.status === 'blocked' ? 'Blocked'
      : r.status === 'missed' ? 'Delayed' : r.status;
    const pct = Math.max(0, Math.min(100, +r.percent || 0));
    const st = pct > 0 && r.status === 'in_progress' ? `${stLabel} · ${pct}%` : stLabel;
    return `<li><b>${esc(title)}</b><span class="st">${esc(st)}</span>${explain ? `<span class="ex">${esc(explain)}</span>` : ''}</li>`;
  }).join('');
  return `<p class="now-head">Working on now</p><ul class="now-work-list">${items}</ul>`;
}

/** Card bottom: 2–3 short italic lines — what they are busy with now (not the bubble ask). */
function cardNowLinesHtml(runs){
  const focus = openRunsNow(runs).slice(0, 3);
  if (!focus.length) {
    return `<div class="now-lines"><span class="muted">Clear — nothing open</span></div>`;
  }
  const lines = focus.map(r => {
    let line = runNowTitle(r);
    if (line.length > 52) line = line.slice(0, 50) + '…';
    const tag = r.status === 'in_progress' ? ' · in work'
      : r.status === 'blocked' ? ' · blocked'
      : r.status === 'missed' ? ' · delayed'
      : '';
    return `<span title="${esc(line)}">${esc(line)}${esc(tag)}</span>`;
  }).join('');
  return `<div class="now-lines">${lines}</div>`;
}

async function loadAgentChatHistory(slug){
  try {
    const res = await api('/agents/'+slug+'/chat/history?limit=100');
    if (res && res.ok && Array.isArray(res.messages) && res.messages.length) {
      chatHist[slug] = res.messages.map(m => ({
        role: m.role,
        content: m.content,
        channel: m.channel || 'board',
        at: m.created_at || null
      }));
      return true;
    }
  } catch (e) { /* offline / empty */ }
  return false;
}

/**
 * Boss-facing note only. Ops dumps / file paths / quota walls → short plain summary or ''.
 * Never show BACKLOGS paths, SSOT, ACCELERATED MODE walls of text to Owner.
 */
function humanizeNote(note){
  if (!note) return '';
  let n = String(note).trim();
  // Hard drop: internal canon dumps
  if (/BACKLOGS\/|ACCELERATED|SSOT:|das-architektura\/|link opps\/day|B2B touches\/day|White-hat only/i.test(n)) {
    if (/ACCELERATED|DA target|link opp/i.test(n)) {
      return 'Growth mode is on: team daily quotas (links, creatives, B2B, ads). White-hat only.';
    }
    return '';
  }
  if (/ADS LEARNING:|Do not execute Ads/i.test(n)) {
    return 'Ads learning note for the intelligence pack — no ads execution here.';
  }
  // kill ticket / API dump language
  n = n.replace(/^GOALS?\s*#?\d*\s*UPDATE:\s*/i, '');
  n = n.replace(/^REASSIGN intent:\s*/i, '');
  n = n.replace(/\bAPI cleared[^.]*\./gi, '');
  n = n.replace(/\bONLY UI left:\s*/gi, 'Your UI step left. ');
  n = n.replace(/\bbegin_checkout\b/gi, '');
  n = n.replace(/\bATC\b/g, '');
  n = n.replace(/\bYT subscriptions?\b/gi, '');
  n = n.replace(/\bCCG soft biddable off\b/gi, '');
  n = n.replace(/\bPACKAGE DELIVERED\.?\s*/gi, '');
  n = n.replace(/\bClaims standby[^.]*\./gi, '');
  n = n.replace(/\s+/g, ' ').replace(/\s*,\s*,/g, ',').trim();
  n = n.replace(/^[\s,;:.-]+|[\s,;:.-]+$/g, '');
  // if still looks like code / path dump, drop
  if (/include\s*=|biddable|mutate|soft goals|\.md\b|\/[A-Z0-9_-]+\/[A-Z0-9_-]+/i.test(n) && n.length > 50) {
    if (/purchase/i.test(n)) return 'Almost purchase-only; one UI step left for you.';
    return '';
  }
  if (n.length > 110) n = n.slice(0, 107) + '…';
  return n;
}

/** Short Boss line for a run card: what + simple status — not ops note wall */
function bossRunSummary(r, doneView){
  const brief = TASK_BRIEF[r.task_id];
  const what = brief && brief.what
    ? brief.what
    : casualWork(r.title, r.task_id);
  const note = humanizeNote(r.note);
  if (doneView || r.status === 'done') {
    return note ? `Done. ${note}` : 'Done.';
  }
  if (r.status === 'blocked') {
    return note ? `Stuck: ${note}` : 'Stuck — needs a clear path.';
  }
  if (r.status === 'missed') {
    return note ? `Late: ${note}` : 'Ran late — catching up.';
  }
  const pct = Math.max(0, Math.min(100, +r.percent || 0));
  // Prefer brief "what" as the human summary
  let s = what;
  if (pct > 0 && isComplexProgress(r, doneView)) s += ` About ${pct}% done.`;
  else if (r.status === 'in_progress') s += ' In progress.';
  else s += ' Not finished yet.';
  if (note && note.length < 80) s += ' ' + note;
  return s;
}

function casualWork(title, taskId){
  const brief = TASK_BRIEF[taskId];
  let raw = (brief && brief.what) ? brief.what : plainTitle(title, taskId);

function reportState(status, doneView){
  if (doneView || status === 'done') return { cls:'done', label:'Done' };
  if (status === 'blocked') return { cls:'stuck', label:'Stuck' };
  if (status === 'missed') return { cls:'missed', label:'Delayed' };
  if (status === 'in_progress') return { cls:'doing', label:'In progress' };
  return { cls:'doing', label: status || '—' };
}
function isComplexProgress(r, doneView){
  // Bar only when partial progress is meaningful (1–99). Binary done/not-done → checkbox.
  if (doneView || r.status === 'done') return false;
  const pct = Math.max(0, Math.min(100, +r.percent || 0));
  if (r.status === 'in_progress' && pct > 0 && pct < 100) return true;
  if (r.status === 'blocked' && pct > 0 && pct < 100) return true;
  if (r.status === 'missed' && pct > 0 && pct < 100) return true;
  return false;
}
function taskCheckHtml(r, doneView){
  if (doneView || r.status === 'done') return '<span class="task-check done" title="Done" aria-label="Done"></span>';
  if (r.status === 'blocked') return '<span class="task-check stuck" title="Stuck" aria-label="Stuck"></span>';
  if (r.status === 'missed') return '<span class="task-check missed" title="Missed" aria-label="Missed"></span>';
  // due / in_progress at 0% — empty square
  return '<span class="task-check wait" title="Not done" aria-label="Not done"></span>';
}
function reportCard(r, she, doneView){
  const st = reportState(r.status, doneView);
  const what = casualWork(r.title, r.task_id);
  const pct = doneView ? 100 : Math.max(0, Math.min(100, +r.percent || 0));
  const complex = isComplexProgress(r, doneView);
  const barCls = doneView || pct>=100 ? 'done' : (r.status==='blocked'||r.status==='missed' ? 'hot' : '');
  const summary = bossRunSummary(r, doneView);
  const say = esc(summary);
  let issue = '';
  if (r.status === 'blocked' && !/Stuck/i.test(summary)) {
    issue = `<div class="rc-issue"><b>Snag:</b> Needs a clear path.</div>`;
  }
  // Short title for card header (bubble-style), full plain summary in body
  const titleShow = String(r.title || what || 'Work').replace(/^[A-Z]{1,3}\d+\s*[—–:-]\s*/, '');
  const progressUi = complex
    ? `<div class="rc-pct-row">
        <span class="lbl">Done level</span>
        <span class="val">${pct}%</span>
      </div>
      <div class="rc-bar"><i class="${barCls}" style="width:${pct}%"></i></div>`
    : `<div class="rc-check-row">
        ${taskCheckHtml(r, doneView)}
        <span class="lab">${doneView || r.status==='done' ? 'Done' : r.status==='blocked' ? 'Stuck' : r.status==='missed' ? 'Missed' : 'Not done'}</span>
      </div>`;
  return `
    <article class="report-card ${st.cls==='stuck'||st.cls==='missed'?'hot':''}">
      <div class="rc-top">
        <h3 class="rc-title">${esc(titleShow)}</h3>
        <span class="rc-state ${st.cls}">${st.label}</span>
      </div>
      <p class="rc-say">${say}</p>
      ${issue}
      ${progressUi}
    </article>`;
}

        <div class="hero-stat"><b>${allMiss}</b><span>Missed</span></div>
        <div class="hero-stat"><b>${allNs}</b><span>Not started</span></div>
        <div class="hero-stat"><b>${allPct}%</b><span>Coverage</span></div>
      </div>
    </section>
    <section class="dash-panel">
      <h3>Org KPI mix this period</h3>
      ${stackBarHtml({ blocked:0, missed:allMiss, due:allNs, prog:0, done7:allOk }, 'lg')}
      <div class="bar-legend">
        <span><i style="background:var(--status-success)"></i> On track ${allOk}</span>
        <span><i style="background:var(--status-warning)"></i> Not started ${allNs}</span>
        <span><i style="background:var(--brand-rot)"></i> Missed ${allMiss}</span>
      </div>
      ${meterHtml('Org coverage (on track / all KPIs)', allPct, allPct>=60?'ok':allPct>=30?'warn':'')}
    </section>
    <div class="legend">
      <span><i class="dot dot-red"></i> MISSED — no completed run in period</span>
      <span><i class="dot dot-ok"></i> — not started yet this period</span>
      <span><i class="dot dot-green"></i> On track — has a real value</span>
    </div>
    <div class="sec">Org chart · CoS first</div>
    ${blocks || '<div class="empty"><h3>No KPI definitions</h3></div>'}`;
}

    const r = await api('/admin/generate',{method:'POST',body:'{}'});
    toast(`Schedule: +${r.created||0} due · ${r.missed||0} missed`);

    if (view==='board') loadBoard();
  } catch(e){ if(e) toast('Generate failed'); }
}
async function doExport(){
  try {
    const r = await api('/admin/export',{method:'POST',body:'{}'});
    toast(`Exported ${r.exported??r.runs??0} runs to MEMORY.md`);
  } catch(e){ if(e) toast('Export failed'); }
