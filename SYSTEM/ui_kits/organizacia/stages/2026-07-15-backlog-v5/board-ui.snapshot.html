/* ========== Seminar / Quick Meeting ========== */
let seminarState = null;
let seminarPollTimer = null;

function closeSeminar(){
  const el = document.getElementById('sem-modal');
  if (el){ el.classList.remove('on'); el.innerHTML = ''; }
  if (seminarPollTimer){ clearInterval(seminarPollTimer); seminarPollTimer = null; }
}

async function openSeminar(){
  const el = document.getElementById('sem-modal');
  if (!el) return;
  el.classList.add('on');
  el.innerHTML = `<div class="sem-panel" onclick="event.stopPropagation()">
    <div class="sem-head">
      <h2>Seminar · Quick meeting</h2>
      <button class="x" onclick="closeSeminar()" aria-label="Close">×</button>
    </div>
    <div class="sem-body" id="sem-body"><p class="muted">Loading…</p></div>
  </div>`;
  await refreshSeminarPanel();
  if (seminarPollTimer) clearInterval(seminarPollTimer);
  seminarPollTimer = setInterval(() => { refreshSeminarPanel(true); }, 8000);
}

async function refreshSeminarPanel(soft){
  const body = document.getElementById('sem-body');
  if (!body) return;
  try {
    seminarState = await api('/seminars/active');
  } catch (e) {
    if (!soft) body.innerHTML = `<p class="muted">Could not load seminar API.</p>`;
    return;
  }
  const s = seminarState && seminarState.active;
  const qs = (seminarState && seminarState.questions) || [];
  const digs = (seminarState && seminarState.digests) || [];
  const roster = (seminarState && seminarState.roster) || 0;
  const pct = s ? Math.max(0, Math.min(100, +s.progress || 0)) : 0;

  if (!s) {
    body.innerHTML = `
      <p class="sem-lead">Paste a link, notes, or any material. Agents digest it; the bar shows how far the room has gone. Questions stay open while the bar moves.</p>
      <label class="sem-label">Title <span class="muted">(optional)</span></label>
      <input id="sem-title" class="sem-input" placeholder="e.g. Token rotation sync" />
      <label class="sem-label">Material</label>
      <textarea id="sem-body-in" class="sem-ta" rows="6" placeholder="Paste text, URL, or briefing…"></textarea>
      <div class="sem-actions">
        <button class="btn btn-dark" onclick="startSeminar()">Start seminar</button>
      </div>`;
    return;
  }

  const qHtml = qs.length
    ? qs.map(q => {
        const open = !(q.answer && String(q.answer).trim());
        const who = esc(q.agent_slug || 'someone');
        if (open) {
          return `<div class="sem-q open" id="semq-${q.id}">
            <button type="button" class="sem-q-btn" onclick="toggleSemAnswer(${q.id})">
              <span class="sem-q-who">${who}</span>
              <span class="sem-q-text">${esc(q.question)}</span>
              <span class="sem-q-hint">tap to answer</span>
            </button>
            <div class="sem-ans-wrap" id="semans-${q.id}" hidden>
              <textarea class="sem-ans" id="semans-in-${q.id}" rows="2" placeholder="Your answer… Enter to send"
                onkeydown="return semAnswerKey(event, '${esc(s.id)}', ${q.id})"></textarea>
            </div>
          </div>`;
        }
        return `<div class="sem-q done">
          <div class="sem-q-btn static">
            <span class="sem-q-who">${who}</span>
            <span class="sem-q-text">${esc(q.question)}</span>
          </div>
          <div class="sem-a">${esc(q.answer)}</div>
        </div>`;
      }).join('')
    : `<p class="muted">No questions yet — agents can ask below while the bar moves.</p>`;

  const digList = digs.length
    ? digs.map(d => esc(d.agent_slug)).join(', ')
    : 'none yet';

  body.innerHTML = `
    <div class="sem-active-title">${esc(s.title || 'Seminar')}</div>
    <div class="sem-material">${esc(s.body)}</div>
    <div class="sem-prog-head">
      <span>Digest progress</span>
      <b>${pct}%</b>
    </div>
    <div class="sem-prog" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
      <i style="width:${pct}%"></i>
    </div>
    <p class="sem-prog-meta muted">Digested: ${digs.length}/${roster || '—'} · ${esc(digList)}</p>

    <div class="sem-sec">Questions</div>
    <div class="sem-q-list">${qHtml}</div>

    <div class="sem-sec">Ask as agent</div>
    <div class="sem-ask-row">
      <select id="sem-ask-slug" class="sem-input sem-select">
        ${(agents || []).map(a => `<option value="${esc(a.slug)}">${esc(a.name)}</option>`).join('') || '<option value="owner">Owner</option>'}
      </select>
      <input id="sem-ask-text" class="sem-input" placeholder="Qualifying question…"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();postSemQuestion()}" />
      <button class="btn btn-dark" onclick="postSemQuestion()">Ask</button>
    </div>
    <div class="sem-actions">
      <button class="btn btn-ghost" onclick="markSemDigest()">Mark me digested (Owner as agent)</button>
      <button class="btn btn-ghost" onclick="closeActiveSeminar()">Close seminar</button>
    </div>`;
}

async function startSeminar(){
  const title = (document.getElementById('sem-title')?.value || '').trim();
  const body = (document.getElementById('sem-body-in')?.value || '').trim();
  if (!body){ toast('Paste material first'); return; }
  try {
    seminarState = await api('/seminars', { method: 'POST', body: JSON.stringify({ title, body }) });
    toast('Seminar started');
    await refreshSeminarPanel();
  } catch (e) { toast('Start failed'); }
}

async function postSemQuestion(){
  const s = seminarState && seminarState.active;
  if (!s) return;
  const slug = document.getElementById('sem-ask-slug')?.value || 'owner';
  const q = (document.getElementById('sem-ask-text')?.value || '').trim();
  if (!q) return;
  try {
    seminarState = await api('/seminars/' + encodeURIComponent(s.id) + '/questions', {
      method: 'POST', body: JSON.stringify({ agent_slug: slug, question: q })
    });
    await refreshSeminarPanel();
  } catch (e) { toast('Ask failed'); }
}

function toggleSemAnswer(qid){
  const wrap = document.getElementById('semans-' + qid);
  if (!wrap) return;
  const show = wrap.hasAttribute('hidden');
  document.querySelectorAll('.sem-ans-wrap').forEach(el => el.setAttribute('hidden', ''));
  if (show) {
    wrap.removeAttribute('hidden');
    const ta = document.getElementById('semans-in-' + qid);
    if (ta) ta.focus();
  }
}

function semAnswerKey(ev, sid, qid){
  if (ev.key === 'Enter' && !ev.shiftKey) {
    ev.preventDefault();
    submitSemAnswer(sid, qid);
    return false;
  }
  return true;
}

async function submitSemAnswer(sid, qid){
  const ta = document.getElementById('semans-in-' + qid);
  const answer = (ta && ta.value || '').trim();
  if (!answer) return;
  try {
    seminarState = await api('/seminars/' + encodeURIComponent(sid) + '/questions/' + qid + '/answer', {
      method: 'POST', body: JSON.stringify({ answer })
    });
    await refreshSeminarPanel();
  } catch (e) { toast('Answer failed'); }
}

async function markSemDigest(){
  const s = seminarState && seminarState.active;
  if (!s) return;
  const slug = document.getElementById('sem-ask-slug')?.value || (agents[0] && agents[0].slug);
  if (!slug) return;
  try {
    seminarState = await api('/seminars/' + encodeURIComponent(s.id) + '/digest', {
      method: 'POST', body: JSON.stringify({ agent_slug: slug })
    });
    toast('Digest noted for ' + slug);
    await refreshSeminarPanel();
  } catch (e) { toast('Digest failed'); }
}

async function closeActiveSeminar(){
  const s = seminarState && seminarState.active;
  if (!s) return;
  try {
    await api('/seminars/' + encodeURIComponent(s.id) + '/close', { method: 'POST', body: '{}' });
    toast('Seminar closed');
    seminarState = { active: null };
    await refreshSeminarPanel();
  } catch (e) { toast('Close failed'); }
}

function esc(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/** Render agent speech: **essence** → <strong>; rest italic via CSS. Labels stay normal weight. */
function formatAgentSpeech(s){
  let t = esc(s);
  // **essence** or __essence__ → bold (only the core idea, not whole paragraph)
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  return t;
}

function renderChatLog(slug, name){
  const hist = chatHist[slug] || [];
  if (!hist.length){
    return `<div class="chat-empty">Board chat + Telegram with this agent — one thread. Learning from both.</div>`;
  }
  const first = (name||'').split(' ')[0] || name || 'Agent';
  return hist.map(m => {
    const isTg = (m.channel || '') === 'telegram' || /^\[Telegram\]/i.test(m.content || '');
    const cls = (m.role === 'user' ? 'user' : (m.role === 'error' ? 'assistant err' : 'assistant')) + (isTg ? ' tg' : '');
    const who = m.role === 'user' ? 'You' : first;
    const ch = isTg ? ' · Telegram' : '';
    let raw = m.content || '';
    if (isTg && m.role === 'user') raw = raw.replace(/^\[Telegram\]\s*/i, '');
    const body = m.role === 'assistant' ? formatAgentSpeech(raw) : esc(raw);
    return `<div class="chat-msg ${cls}"><span class="who">${esc(who)}<span class="ch">${esc(ch)}</span></span>${body}</div>`;
  }).join('');
}
/** Enter = send; Ctrl/Cmd/Shift+Enter = newline */
function chatKeydown(ev, slug, name){
  if (ev.key !== 'Enter') return true;
  if (ev.ctrlKey || ev.metaKey || ev.shiftKey) return true; // allow newline
  ev.preventDefault();
  sendChat(ev, slug, name);
  return false;
}

async function sendChat(ev, slug, name){
  if (ev && ev.preventDefault) ev.preventDefault();
  if (chatBusy) {
    toast('Still working on the last message…');
    return false;
  }
  const ta = document.getElementById('chat-in');
  const text = (ta && ta.value || '').trim();
  if (!text) return false;
  chatHist[slug] = chatHist[slug] || [];
  chatHist[slug].push({ role:'user', content:text, channel:'board' });
  ta.value = '';
  chatBusy = true;
  const setBusyUi = (busy, statusText) => {
    const b = document.getElementById('chat-send');
    if (b) b.disabled = !!busy;
    const logEl = document.getElementById('chat-log');
    if (!logEl) return;
    if (busy) {
      logEl.innerHTML = renderChatLog(slug, name) + `<div class="chat-empty">${esc(statusText || 'Thinking…')}</div>`;
    } else {
      logEl.innerHTML = renderChatLog(slug, name);
    }
    logEl.scrollTop = logEl.scrollHeight;
  };
  const needsReach = /https?:\/\/|telegram|телег|t\.me\/|@\w{4,}|research|найди|источник|прочитай|GEO|очеред/i.test(text);
  setBusyUi(true, needsReach ? 'Looking up sources…' : 'Thinking…');
  const ac = new AbortController();
  const kill = setTimeout(() => ac.abort(), 25000);
  try {
    const msgs = chatHist[slug].filter(m => m.role === 'user' || m.role === 'assistant').slice(-10)
      .map(m => ({ role: m.role, content: m.content }));
    const res = await api('/agents/'+slug+'/chat', {
      method:'POST',
      body: JSON.stringify({ messages: msgs, channel: 'board', use_history: true }),
      signal: ac.signal
    });
    if (res && res.error) throw new Error(res.error + (res.detail ? (': '+res.detail) : ''));
    if (!res || !res.reply) throw new Error('Empty reply from server');
    let reply = res.reply;
    if (res.reach && res.reach.used) {
      const ch = (res.reach.channels || []).join(', ') || 'reach';
      reply += `\n\n· ${res.reach.ok ? '📡 live '+ch : '📡 reach miss'}`;
    }
    chatHist[slug].push({ role:'assistant', content: reply, channel: res.channel || 'board' });
    // Refresh from server so Telegram turns that arrived mid-session appear
    await loadAgentChatHistory(slug);
  } catch (e) {
    const msg = (e && e.name === 'AbortError')
      ? 'Timed out (25s). Close the drawer, hard-refresh, try again.'
      : ('Chat failed: ' + (e.message || e));
    chatHist[slug].push({ role:'error', content: msg });
  } finally {
    clearTimeout(kill);
    chatBusy = false;
    setBusyUi(false);
  }
  return false;
}

render();
