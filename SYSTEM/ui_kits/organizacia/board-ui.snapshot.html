async function buildDigestSlides(){
  // Company GM1 first (API), then agents with real open board tasks.
  let list = Array.isArray(agents) && agents.length ? [...agents] : [];
  if (!list.length) {
    try { list = await api('/agents'); agents = list; } catch (_) { list = []; }
  }
  const bySlug = Object.fromEntries(list.map(a => [a.slug, a]));

  let asks = [];
  try {
    const pack = await api('/digest/asks?locale=' + encodeURIComponent(LOCALE === 'ru' ? 'ru' : 'en'));
    asks = pack.asks || [];
  } catch (e) {
    throw new Error('Could not load Digest asks: ' + (e.message || e));
  }

  // Preserve API order; keep seat if it has report/opinion substance (not only board Q)
  // name + role from roster/API SSOT — never translated (except company GM1 labels)
  return asks
    .filter(ask => {
      if (!ask || !ask.slug) return false;
      const hasQ = String(ask.question || '').trim().length > 8;
      const hasOp = String(ask.opinion || '').trim().length > 24;
      const hasR = Array.isArray(ask.brief) && ask.brief.some(b => String(b || '').trim().length > 40);
      return hasR || hasOp || hasQ;
    })
    .map(ask => {
      const isGm1 = ask.kind === 'gm1_company' || ask.slug === 'gm1-company';
      const a = bySlug[ask.slug] || { slug: ask.slug, name: ask.slug, role: '' };
      return {
        kind: isGm1 ? 'gm1_company' : (ask.kind || 'agent'),
        slug: ask.slug,
        name: isGm1 ? (ask.name || a.name) : (a.name || ask.name || ask.slug),
        role: isGm1 ? (ask.role || '') : (ask.role || digestShortRole(ask.slug, a.role)),
        question: ask.question,
        brief: ask.brief || [],
        opinion: ask.opinion || '',
        options: ask.options || [],
        task_id: ask.task_id || null,
        run_id: ask.run_id || null,
        status: ask.status || null,
        due_date: ask.due_date || null,
        task_detail: ask.task_detail || null,
        gm1: ask.gm1 || null
      };
    });
}

function closeDigestDeck(){
  // Call lives only while agent is on Digest — close deck = hang up now
  try { hangupDigestCallNow(true); } catch (_) { /* */ }
  const el = document.getElementById('digest-modal');
  if (el) {
    el.classList.remove('on');
    el.innerHTML = '';
  }
  document.body.classList.remove('dg-open');
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  document.body.style.top = '';
  if (window.__dgScrollY != null) {
    const y = window.__dgScrollY;
    window.__dgScrollY = null;
    try { window.scrollTo(0, y); } catch (_) { /* */ }
  }
  if (digestKeyHandler) {
    document.removeEventListener('keydown', digestKeyHandler, true);
    digestKeyHandler = null;
  }
  digestDeck = null;
}

function digestToast(msg){
  const el = document.getElementById('digest-modal');
  if (!el) return;
  const t = document.createElement('div');
  t.className = 'dg-toast';
  t.textContent = msg;
  el.querySelector('.dg-stage')?.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function digestBusy(on){
  if (!digestDeck) return;
  digestDeck.busy = !!on;
  const send = document.getElementById('dg-send');
  if (send) send.disabled = !!on;
  document.querySelectorAll('.dg-opt').forEach(b => { b.disabled = !!on; });
  document.querySelectorAll('.dg-mood').forEach(b => { b.disabled = !!on; });
}

/**
 * Mobile mood: Positive / Negative = answer + next agent.
 * Skip = leave this agent without answer, next task.
 */
async function digestMood(kind){
  if (!digestDeck || digestDeck.busy) return;
  const k = String(kind || '').toLowerCase();
  if (k === 'skip') {
    await digestSkipSlide();
    return;
  }
  const ru = LOCALE === 'ru';
  const map = {
    positive: { option: 'POS', text: ru ? 'Позитивный' : 'Positive' },
    negative: { option: 'NEG', text: ru ? 'Негативный' : 'Negative' }
  };
  const hit = map[k];
  if (!hit) return;
  digestDeck.selectedKey = hit.option;
  await digestSendAndDismiss({ option: hit.option, text: hit.text });
}

/** Skip current Digest agent — no answer body required; advance queue. */
async function digestSkipSlide(){
  if (!digestDeck || digestDeck.busy) return;
  const s = digestDeck.slides[digestDeck.index];
  if (!s) return;
  // Leaving this agent → kill Call immediately
  try { await hangupDigestCallNow(true); } catch (_) { /* */ }
  digestBusy(true);
  const name = s.name || s.slug;
  const goneSlug = s.slug;
  try {
    // Soft log so store knows Boss skipped (optional; never block advance)
    try {
      await api('/digest/answer', {
        method: 'POST',
        body: JSON.stringify({
          agent_slug: s.slug,
          question: s.question,
          answer_text: LOCALE === 'ru' ? 'Skip' : 'Skip',
          option_key: 'SKIP',
          task_id: s.task_id || undefined,
          run_id: s.run_id || undefined,
          locale: LOCALE === 'ru' ? 'ru' : 'en'
        })
      });
    } catch (_) { /* advance even if log fails */ }
    digestDeck.slides = digestDeck.slides.filter(x => x.slug !== goneSlug);
    delete digestDeck.drafts[goneSlug];
    digestDeck.selectedKey = null;
    digestDeck.totalDone = (digestDeck.totalDone || 0) + 1;
    if (!digestDeck.slides.length) {
      digestToast(t('digest.done_all', { name }));
      closeDigestDeck();
    } else {
      if (digestDeck.index >= digestDeck.slides.length) {
        digestDeck.index = digestDeck.slides.length - 1;
      }
      digestToast(t('digest.skip_left', { name, n: digestDeck.slides.length }));
      renderDigestSlide();
    }
  } finally {
    digestBusy(false);
  }
}

/**
 * Click A/B/C = final send. Agent receives decision and is removed from the deck forever (this session).
 */
async function digestSelectOpt(key){
  if (!digestDeck || digestDeck.busy) return;
  const k = String(key || '').toUpperCase();
  const s = digestDeck.slides[digestDeck.index];
  if (!s) return;
  const opt = (s.options || []).find(o => String(o.key).toUpperCase() === k);
  const tag = opt && opt.tag === 'my_choice' ? ' (' + t('digest.tag.my') + ')' : opt && opt.tag === 'recommended' ? ' (' + t('digest.tag.rec') + ')' : '';
  const text = opt ? (k + ': ' + opt.label + tag) : k;
  digestDeck.selectedKey = k;
  document.querySelectorAll('.dg-opt').forEach(btn => {
    btn.classList.toggle('on', String(btn.dataset.key || '').toUpperCase() === k);
  });
  const ta = document.getElementById('dg-ta');
  if (ta) ta.value = text;
  await digestSendAndDismiss({ option: k, text });
}

/**
 * Send current answer to agent store, drop agent from queue, show next remaining.
 * Click option / Enter / Send button all go here.
 */
async function digestSendAndDismiss(payload){
  if (!digestDeck || digestDeck.busy) return;
  const s = digestDeck.slides[digestDeck.index];
  if (!s) return;

  let text = payload && payload.text != null
    ? String(payload.text).trim()
    : ((document.getElementById('dg-ta') && document.getElementById('dg-ta').value) || '').trim();
  let option = payload && payload.option
    ? String(payload.option).toUpperCase()
    : (digestDeck.selectedKey || null);
  if (!option && text) {
    const m = text.match(/^\s*([A-Ca-c])\b/) || text.match(/\b([A-Ca-c])\s*[:.]/);
    if (m) option = m[1].toUpperCase();
  }
  if (!text && !option) {
    digestToast(t('digest.pick_or_write'));
    return;
  }
  if (!text && option) {
    const opt = (s.options || []).find(o => String(o.key).toUpperCase() === option);
    if (opt) {
      const tag = opt.tag === 'my_choice' ? ' (' + t('digest.tag.my') + ')' : opt.tag === 'recommended' ? ' (' + t('digest.tag.rec') + ')' : '';
      text = option + ': ' + opt.label + tag;
    } else text = option;
  }

  // Live Call: commit out loud in THIS agent's own style, then hang up
  try {
    if (typeof agentCallConvai !== 'undefined' && agentCallConvai && agentCallConvai.active) {
      const same = !agentCallConvai.slug || agentCallConvai.slug === s.slug;
      if (same) {
        const ru = LOCALE === 'ru';
        let optLabel = '';
        if (option) {
          const opt = (s.options || []).find(o => String(o.key).toUpperCase() === option);
          if (opt) optLabel = String(opt.label || '').replace(/\s+/g, ' ').trim().slice(0, 120);
        }
        const prompt = ru
          ? (option
            ? `Owner выбрал вариант ${option}${optLabel ? ' — ' + optLabel : ''}. Прими и подтверди вслух, что берёшь в работу.`
            : `Owner ответил: «${String(text).replace(/\s+/g, ' ').trim().slice(0, 160)}». Прими и подтверди вслух, что берёшь в работу.`)
          : (option
            ? `Owner chose option ${option}${optLabel ? ' — ' + optLabel : ''}. Accept and confirm out loud that you will execute.`
            : `Owner answered: "${String(text).replace(/\s+/g, ' ').trim().slice(0, 160)}". Accept and confirm out loud that you will execute.`);
        await digestCallConfirmAndHangup(prompt, 2600);
      } else {
        await hangupDigestCallNow(true);
      }
    }
  } catch (_) {
    try { await hangupDigestCallNow(true); } catch (__) { /* */ }
  }

  digestBusy(true);
  let ok = false;
  let toastMsg = '';
  let doneAll = false;
  try {
    // Server: D1 org_digest_answers + chat (channel=digest) + task run status + LLM act
    const res = await api('/digest/answer', {
      method: 'POST',
      body: JSON.stringify({
        agent_slug: s.slug,
        question: s.question,
        answer_text: text,
        option_key: option || undefined,
        task_id: s.task_id || undefined,
        run_id: s.run_id || undefined,
        locale: LOCALE === 'ru' ? 'ru' : 'en'
      })
    });

    const name = s.name || s.slug;
    // Remove this agent from deck — never show again this session
    const goneSlug = s.slug;
    digestDeck.slides = digestDeck.slides.filter(x => x.slug !== goneSlug);
    delete digestDeck.drafts[goneSlug];
    digestDeck.selectedKey = null;
    digestDeck.totalDone = (digestDeck.totalDone || 0) + 1;
    ok = true;

    const st = res && res.run_action && res.run_action.status
      ? String(res.run_action.status)
      : '';
    const deliveredBit = st
      ? (LOCALE === 'ru'
        ? ` · задача → ${st === 'blocked' ? 'блок' : 'в работе'}`
        : ` · task → ${st}`)
      : (res && res.chat_message_id
        ? (LOCALE === 'ru' ? ' · в чат агента' : ' · to agent chat')
        : '');

    if (!digestDeck.slides.length) {
      doneAll = true;
      toastMsg = t('digest.done_all', { name }) + deliveredBit;
    } else {
      if (digestDeck.index >= digestDeck.slides.length) {
        digestDeck.index = digestDeck.slides.length - 1;
      }
      toastMsg = t('digest.sent_left', { name, n: digestDeck.slides.length }) + deliveredBit;
    }
  } catch (e) {
    toastMsg = t('digest.send_fail', { msg: e.message || e });
  } finally {
    // Always clear busy — otherwise 2nd+ agent A/B/C are dead
    if (digestDeck) digestDeck.busy = false;
  }
  if (toastMsg) digestToast(toastMsg);
  if (ok && doneAll) {
    setTimeout(() => closeDigestDeck(), 700);
    return;
  }
  if (ok) renderDigestSlide();
  else digestBusy(false);
}

function digestOptionTagHtml(tag){
  if (tag === 'my_choice') return `<span class="tag tag-my">${esc(t('digest.tag.my'))}</span>`;
  if (tag === 'recommended') return `<span class="tag tag-rec">${esc(t('digest.tag.rec'))}</span>`;
  return '';
}

/** Plain text + **essence** → bold (personizer for Boss). Escapes first, then bold. */
function digestRich(s){ return DUI.digestRich(s); }

/** Square accordion on option row — expands task detail; does NOT send a vote. */
function digestToggleDetail(key, ev){
  if (ev) {
    ev.preventDefault();
    ev.stopPropagation();
  }
  const k = String(key || '').toUpperCase();
  const block = document.getElementById('dg-block-' + k);
  const btn = document.getElementById('dg-acc-' + k);
  const panel = block && block.querySelector('.dg-opt-detail');
  if (!block || !btn || !panel) return;
  const open = !block.classList.contains('open');
  // Close other option accordions on this slide
  document.querySelectorAll('.dg-opt-block.open').forEach(b => {
    if (b !== block) {
      b.classList.remove('open');
      const d = b.querySelector('.dg-opt-detail');
      const a = b.querySelector('.dg-acc');
      if (d) d.hidden = true;
      if (a) { a.setAttribute('aria-expanded', 'false'); a.textContent = '▾'; }
    }
  });
  block.classList.toggle('open', open);
  panel.hidden = !open;
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.textContent = open ? '▴' : '▾';
  btn.title = open ? 'Hide task detail' : 'Show task detail';
}

function renderDigestSlide(){
  const el = document.getElementById('digest-modal');
  if (!el || !digestDeck) return;
  if (!digestDeck.slides.length) {
    closeDigestDeck();
    return;
  }
  if (digestDeck.index >= digestDeck.slides.length) digestDeck.index = 0;
  const s = digestDeck.slides[digestDeck.index];
  if (!s) return;
  // Safety: Call must match agent currently on Digest stage
  try {
    if (typeof agentCallConvai !== 'undefined' && agentCallConvai && agentCallConvai.active
        && agentCallConvai.slug && s.slug && agentCallConvai.slug !== s.slug) {
      hangupDigestCallNow(true);
    }
  } catch (_) { /* */ }
  digestDeck.selectedKey = null;
  const left = digestDeck.slides.length;
  const done = digestDeck.totalDone || 0;
  const avatars = digestAvatarCandidates(s.slug);
  const ini = initials(s.name);
  // Drop leading agent first name — face + name already identify them
  const firstName = String(s.name || '').split(/\s+/)[0] || '';
  // Text pipeline → DUI (ui-logic.js): Owner laws (idea-per-line, name strip,
  // sentence case) live there under tests — was duplicated inline twice.
  const stripAgentLead = (text) => DUI.stripAgentLead(text, firstName);
  const sentenceCase = (text) => DUI.sentenceCase(text, LOCALE);
  const cleanPara = (text) => DUI.cleanPara(text, firstName, LOCALE);
  const digestIdeaLines = DUI.digestIdeaLines;
  const digestIdeaHtml = DUI.digestIdeaHtml;
  // Report: facts (brief lines kept separate when API already split)
  const briefParts = (s.brief && s.brief.length)
    ? s.brief.map(cleanPara).filter(Boolean)
    : [];
  const reportPara = briefParts.length
    ? briefParts.join('\n').replace(/[ \t]+/g, ' ').trim()
    : (LOCALE === 'ru'
      ? 'Краткий репорт по этой работе ещё не подгрузился.'
      : 'No brief loaded for this agent yet.');
  // My view — drop "My view:" prefix; never A/B/C theater fallback
  const stripViewLead = (text) => {
    let x = String(text || '').trim();
    x = x.replace(/^(my\s+view|мой\s+взгляд|моё\s+мнение|мое\s+мнение)\s*[:—–\-]\s*/i, '').trim();
    return cleanPara(x);
  };
  let viewPara = s.opinion ? stripViewLead(s.opinion) : '';
  if (!viewPara && briefParts.length > 1) {
    viewPara = briefParts[briefParts.length - 1];
  }
  if (!viewPara) {
    viewPara = LOCALE === 'ru'
      ? 'Пока без отдельного мнения по фактам выше.'
      : 'No separate take yet on the facts above.';
  }
  let reportShow = reportPara;
  if (briefParts.length > 1 && viewPara === briefParts[briefParts.length - 1] && !s.opinion) {
    reportShow = briefParts.slice(0, -1).join('\n').replace(/[ \t]+/g, ' ').trim();
  }
  const reportHtml = digestIdeaHtml(reportShow, 'dg-report-text')
    || `<p class="dg-report-text">${digestRich(reportShow)}</p>`;
  const viewHtml = digestIdeaHtml(viewPara, 'dg-cap-text')
    || `<p class="dg-cap-text">${digestRich(viewPara)}</p>`;

  const photoUrl = avatars[0] || '';
  const callAria = 'Call ' + (s.name || s.slug);
  const phoneSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>`;
  const idBlock = `<div class="dg-id">
          <h2 class="dg-name">${esc(s.name)}</h2>
          <p class="dg-role">${esc(s.role)}</p>
        </div>`;
  const callBtn = `<button type="button" class="dg-call-btn" id="dg-call-btn"
          title="${esc(callAria)}" aria-label="${esc(callAria)}"
          onclick="digestOpenCall()">${phoneSvg}</button>`;
  // Photo / mobile bottom: ONLY agent take — italic Manrope. Report left / mobile top of sheet.
  const viewOnPhoto = `<div class="dg-cap-block dg-cap-view">${viewHtml}</div>`;
  // CSS url() — do not HTML-escape &/? in the style attribute value path
  const bgCss = photoUrl ? String(photoUrl).replace(/\\/g, '/').replace(/"/g, '%22').replace(/'/g, '%27') : '';
  // Per-agent face anchor (upper 40% face band). y = background/object vertical focus.
  const faceY = (typeof digestFaceY === 'function' ? digestFaceY(s.slug) : null) || '35%';
  const faceScale = (typeof digestFaceScale === 'function' ? digestFaceScale(s.slug) : 1) || 1;
  const faceShift = (typeof digestFaceShiftY === 'function' ? digestFaceShiftY(s.slug) : '0%') || '0%';
  const facePos = 'center ' + faceY;
  // scale + translateY: negative shift lifts face into UPPER HALF (Mina env portraits)
  const faceTf = `transform:scale(${faceScale}) translateY(${faceShift});transform-origin:center center;`;
  const wrapFaceBg = bgCss
    ? ` style="background-image:url(&quot;${bgCss}&quot;);background-position:${facePos};background-size:cover"`
    : '';
  el.innerHTML = `<div class="dg-stage">
    <div class="dg-right">
      <div class="dg-photo-wrap" id="dg-photo-wrap"${wrapFaceBg}>
        <div class="dg-photo-fallback" id="dg-fallback">${esc(ini)}</div>
        <img class="dg-photo" id="dg-photo" src="${esc(photoUrl)}" alt="${esc(s.name)}"
          decoding="async" fetchpriority="high" data-face-y="${esc(faceY)}"
          style="object-position:${facePos};${faceTf}" />
        <div class="dg-photo-fade" aria-hidden="true"></div>
        <div class="dg-photo-head">
          ${idBlock}
        </div>
        <div class="dg-photo-caption dg-cap-desk" id="dg-photo-caption">
          ${viewOnPhoto}
        </div>
      </div>
    </div>
    <div class="dg-left">
      <div class="dg-top">
        ${idBlock}
      </div>
      <div class="dg-report-main" id="dg-report-main">
        ${reportHtml}
      </div>
      <div class="dg-scroll" id="dg-scroll">
        <div class="dg-scroll-pad" aria-hidden="true"></div>
        <div class="dg-sheet">
          <div class="dg-report-main dg-report-mob">
            ${reportHtml}
          </div>
          <div class="dg-photo-caption dg-cap-mob">
            ${viewOnPhoto}
          </div>
          <div class="dg-body">
            <div class="dg-below-q">
              <textarea class="dg-ta" id="dg-ta" placeholder="${esc(t('digest.free_ph', { name: s.name.split(' ')[0] || s.name }))}"
                rows="3"></textarea>
              <div class="dg-foot">
                <div class="dg-meta">${esc(t('digest.left', { left, done }))}</div>
                <button type="button" class="dg-send" id="dg-send" onclick="digestFootSend()">${esc(t('digest.send'))}</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    ${callBtn}
    <button type="button" class="dg-x" onclick="closeDigestDeck()" aria-label="${esc(t('btn.close'))}">×</button>
  </div>`;

  const wrap = document.getElementById('dg-photo-wrap');
  const img = document.getElementById('dg-photo');
  const fbEl = document.getElementById('dg-fallback');
  let ai = 0;
  const paint = (url) => {
    if (!url) return;
    const safe = String(url).replace(/\\/g, '/').replace(/"/g, '%22');
    // Keep last good background until a new one paints — never flash empty
    // Face band: top 40% (background-position + cover)
    if (wrap) {
      wrap.style.backgroundImage = 'url("' + safe + '")';
      wrap.style.backgroundPosition = facePos;
      wrap.style.backgroundSize = 'cover';
    }
    if (img) {
      img.hidden = false;
      img.style.opacity = '1';
      img.style.visibility = 'visible';
      img.style.objectPosition = facePos;
      img.style.transform = 'scale(' + faceScale + ') translateY(' + faceShift + ')';
      img.style.transformOrigin = 'center center';
      img.src = url;
    }
  };
  if (img) {
    img.decoding = 'async';
    img.loading = 'eager';
    try { img.fetchPriority = 'high'; } catch (_) {}
    img.onload = () => {
      img.hidden = false;
      img.style.opacity = '1';
      if (fbEl) fbEl.style.opacity = '0';
      if (wrap && img.currentSrc) {
        wrap.style.backgroundImage = 'url("' + String(img.currentSrc).replace(/"/g, '%22') + '")';
      }
    };
    img.onerror = () => {
      ai++;
      if (ai < avatars.length) {
        paint(avatars[ai]);
      } else {
        // Only then show initials — do not wipe if wrap still has a bg
        img.hidden = true;
        if (fbEl) fbEl.style.opacity = '1';
      }
    };
    // Kick first paint explicitly (some WebViews skip initial bg-only)
    paint(photoUrl || avatars[0]);
  }
  // Enter in free text → open chat with agent (seed message if any).
  // Shift+Enter = newline. A/B/C still answer Digest without chat.
  const ta = document.getElementById('dg-ta');
  if (ta && digestDeck.drafts[s.slug]) ta.value = digestDeck.drafts[s.slug];
  if (ta) {
    ta.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && !ev.shiftKey && !ev.ctrlKey && !ev.metaKey) {
        ev.preventDefault();
        ev.stopPropagation();
        const text = (ta.value || '').trim();
        if (!text) {
          digestToast(t('digest.pick'));
          return;
        }
        digestOpenChat(text);
      }
    });
  }
  el.classList.add('on');
}

/**
 * Foot Send: free text → open chat; if A/B/C already chosen in field → Digest answer.
 */
function digestFootSend(){
  if (!digestDeck || digestDeck.busy) return;
  const ta = document.getElementById('dg-ta');
  const text = ((ta && ta.value) || '').trim();
  const option = digestDeck.selectedKey
    || (text.match(/^\s*([A-Ca-c])\s*[:.]/) || [])[1];
  // Pure free text (no A/B/C) → conversation window
  if (text && !option && !digestDeck.selectedKey) {
    digestOpenChat(text);
    return;
  }
  // Option path or empty with selection
  digestSendAndDismiss();
}

function bindDigestKeys(){
  if (digestKeyHandler) document.removeEventListener('keydown', digestKeyHandler, true);
  digestKeyHandler = (ev) => {
    const el = document.getElementById('digest-modal');
    if (!el || !el.classList.contains('on') || !digestDeck) return;
    if (digestDeck.busy) return;
    const tag = (ev.target && ev.target.tagName || '').toLowerCase();
    const typing = tag === 'textarea' || tag === 'input';
    if (ev.key === 'Escape') {
      ev.preventDefault();
      closeDigestDeck();
      return;
    }
    // Space / arrows outside textarea = pure slide navigation (Owner 2026-07-17):
    // no answer, no button activation — just flip to the next / previous agent.
    if (!typing && (ev.key === ' ' || ev.key === 'Spacebar' || ev.key === 'ArrowRight')) {
      ev.preventDefault();
      ev.stopPropagation();
      digestFlip(1);
      return;
    }
    if (!typing && ev.key === 'ArrowLeft') {
      ev.preventDefault();
      ev.stopPropagation();
      digestFlip(-1);
      return;
    }
    // A / B / C outside textarea = immediate send + dismiss
    if (!typing && /^[abcABC]$/.test(ev.key)) {
      ev.preventDefault();
      digestSelectOpt(ev.key.toUpperCase());
      return;
    }
    // Enter outside textarea = Digest send only if option already chosen
    if (ev.key === 'Enter' && !typing && !ev.shiftKey) {
      ev.preventDefault();
      if (digestDeck.selectedKey) digestSendAndDismiss();
      else digestToast(t('digest.pick_or_chat'));
    }
  };
  document.addEventListener('keydown', digestKeyHandler, true);
}

/** Flip the deck without answering — draft text survives per agent. */
function digestFlip(dir){
  if (!digestDeck || digestDeck.busy) return;
  const len = digestDeck.slides.length;
  if (len < 2) return;
  const cur = digestDeck.slides[digestDeck.index];
  const ta = document.getElementById('dg-ta');
  if (cur && ta) digestDeck.drafts[cur.slug] = ta.value || '';
  // Switch agent → hang up Call for previous (Call only while THIS agent is on stage)
  try { hangupDigestCallNow(true); } catch (_) { /* */ }
  digestDeck.index = (digestDeck.index + (dir < 0 ? -1 : 1) + len) % len;
  renderDigestSlide();
}

/** Mobile: horizontal swipe on the deck = same pure navigation as Space. */
function bindDigestSwipe(el){
  let x0 = null, y0 = null;
  el.ontouchstart = (ev) => {
    const t0 = ev.touches && ev.touches[0];
    const tag = (ev.target && ev.target.tagName || '').toLowerCase();
    if (!t0 || tag === 'textarea' || tag === 'input') { x0 = null; return; }
    x0 = t0.clientX; y0 = t0.clientY;
  };
  el.ontouchend = (ev) => {
    if (x0 == null || !digestDeck) return;
    const t1 = ev.changedTouches && ev.changedTouches[0];
    if (!t1) { x0 = null; return; }
    const dx = t1.clientX - x0, dy = t1.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) digestFlip(dx < 0 ? 1 : -1);
  };
}

async function openDigestDeck(){
  let el = document.getElementById('digest-modal');
  if (!el) {
    el = document.createElement('div');
    el.id = 'digest-modal';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-label', 'Digest');
    document.body.appendChild(el);
  }
  el.classList.add('on');
  // Lock page under modal — fixes first-open "need pinch zoom" on phones
  window.__dgScrollY = window.scrollY || window.pageYOffset || 0;
  document.body.classList.add('dg-open');
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
  document.body.style.top = '-' + window.__dgScrollY + 'px';
  const loading = t('digest.loading');
  el.innerHTML = `<div class="dg-stage"><p class="dg-q" style="position:absolute;bottom:36%;left:8%;right:8%;z-index:5">${esc(loading)}</p>
    <button type="button" class="dg-x" onclick="closeDigestDeck()" aria-label="${esc(t('aria.close'))}">×</button></div>`;
  try {
    const slides = await buildDigestSlides();
    if (!slides.length) {
      const empty = (t('digest.empty') === 'digest.empty')
        ? (LOCALE === 'ru' ? 'Нет открытых задач для дайджеста.' : 'No open-task Digest slides.')
        : t('digest.empty');
      const hint = (t('digest.empty.hint') === 'digest.empty.hint')
        ? (LOCALE === 'ru' ? 'На доске должны быть due / in progress / blocked / missed runs.' : 'Board needs due / in progress / blocked / missed runs.')
        : t('digest.empty.hint');
      el.innerHTML = `<div class="dg-stage" style="display:flex;align-items:center;justify-content:center;padding:40px">
        <div style="max-width:28rem;z-index:5">
          <p class="dg-q" style="position:static">${esc(empty)}</p>
          <p style="color:rgba(255,255,255,.75);font-size:14px;line-height:1.45">${esc(hint)}</p>
          <button type="button" class="dg-send" style="margin-top:20px;max-width:220px" onclick="closeDigestDeck()">${esc(LOCALE==='ru'?'Закрыть':'Close')}</button>
        </div>
        <button type="button" class="dg-x" onclick="closeDigestDeck()" aria-label="${esc(t('aria.close'))}">×</button>
      </div>`;
      return;
    }
    digestDeck = { slides, index: 0, selectedKey: null, drafts: {}, totalDone: 0, busy: false };
    bindDigestKeys();
    bindDigestSwipe(el);
    renderDigestSlide();
  } catch (e) {
    console.error('openDigestDeck', e);
    const msg = e && e.message ? e.message : String(e || 'error');
    el.innerHTML = `<div class="dg-stage" style="display:flex;align-items:center;justify-content:center;padding:40px">
      <div style="max-width:28rem;z-index:5">
        <p class="dg-q" style="position:static">${esc(LOCALE==='ru'?'Дайджест не загрузился':'Digest failed to load')}</p>
        <p style="color:#f88;font-size:14px;line-height:1.45">${esc(msg)}</p>
        <button type="button" class="dg-send" style="margin-top:20px;max-width:220px" onclick="closeDigestDeck()">${esc(LOCALE==='ru'?'Закрыть':'Close')}</button>
      </div>
      <button type="button" class="dg-x" onclick="closeDigestDeck()" aria-label="${esc(t('aria.close'))}">×</button>
    </div>`;
  }
}

render();

/* ---------- OpenAI Realtime FULL Call (Owner 2026-07-17) — gpt-realtime-2.1 WebRTC ---------- */
const agentCallConvai = {
  active: false,
  slug: null,
  name: null,
  pc: null,
  dc: null,
  micStream: null,
  audioEl: null,
  fromDigest: false,
  brief: null
};

function setAgentCallStatus(msg){
  const el = document.getElementById('chat-call-status');
  if (!el) return;
  if (!agentCallConvai.active) {
    el.classList.remove('on');
    el.innerHTML = '';
    return;
  }
  el.classList.add('on');
  const first = (agentCallConvai.name || 'Agent').split(/\s+/)[0];
  el.innerHTML = msg
    ? `<span class="dot">●</span> ${esc(msg)}`
    : `<span class="dot">●</span> Live call with ${esc(first)} · OpenAI Realtime · mic open`;
}

function syncAgentCallButtons(){
  for (const id of ['chat-call','float-chat-call']) {
    const b = document.getElementById(id);
    if (!b) continue;
    b.classList.toggle('on', !!agentCallConvai.active);
    b.textContent = agentCallConvai.active ? '⏹ End call' : '📞 Call';
  }
}

function pushVoiceChatLine(agentSlug, agentName, role, text){
  try {
    if (!text || !agentSlug) return;
    const content = String(text).trim();
    if (!content) return;
    // De-dupe rapid double events
    chatHist[agentSlug] = chatHist[agentSlug] || [];
    const last = chatHist[agentSlug][chatHist[agentSlug].length - 1];
    if (last && last.role === role && last.content === content && last.channel === 'voice-call') return;
    chatHist[agentSlug].push({ role, content, channel: 'voice-call' });
    const log = document.getElementById('chat-log') || document.getElementById('float-chat-log');
    if (log && typeof renderChatLog === 'function') {
      log.innerHTML = renderChatLog(agentSlug, agentName);
      if (typeof scrollChatToLatest === 'function') scrollChatToLatest(log);
    }
    // Persist to D1 so history survives refresh
    api('/agents/' + encodeURIComponent(agentSlug) + '/chat/log', {
      method: 'POST',
      body: JSON.stringify({ role, content, channel: 'voice-call' })
    }).catch(() => {});
  } catch (_) { /* non-fatal */ }
}

function handleRealtimeServerEvent(event, agentSlug, agentName, first){
  if (!event || !event.type) return;
  const t = event.type;
  // User speech STT (requires session.audio.input.transcription)
  if (t === 'conversation.item.input_audio_transcription.completed' ||
      t === 'conversation.item.input_audio_transcription.done') {
    const text = event.transcript || event.item?.content?.[0]?.transcript || '';
    if (text) {
      pushVoiceChatLine(agentSlug, agentName, 'user', text);
      setAgentCallStatus('Listening… talk to ' + first);
    }
    return;
  }
  // Agent speech transcript (Realtime 2.x event names)
  if (t === 'response.output_audio_transcript.done' ||
      t === 'response.audio_transcript.done') {
    const text = event.transcript || '';
    if (text) {
      pushVoiceChatLine(agentSlug, agentName, 'assistant', text);
      setAgentCallStatus(first + ' is speaking…');
    }
    return;
  }
  // Fallback: full response.done may carry text/transcript parts
  if (t === 'response.done' && event.response) {
    try {
      const out = event.response.output || [];
      for (const item of out) {
        const parts = item.content || [];
        for (const p of parts) {
          const text = p.transcript || p.text || '';
          if (text && (p.type === 'output_audio' || p.type === 'audio' || p.type === 'output_text' || p.type === 'text')) {
            pushVoiceChatLine(agentSlug, agentName, 'assistant', text);
          }
        }
      }
    } catch (_) {}
    return;
  }
  if (t === 'input_audio_buffer.speech_started') {
    setAgentCallStatus('Listening… talk to ' + first);
  } else if (t === 'response.created' || t === 'response.output_audio.delta' || t === 'response.output_audio_transcript.delta') {
    setAgentCallStatus(first + ' is speaking…');
  } else if (t === 'error') {
    const msg = (event.error && (event.error.message || event.error.code)) || 'realtime error';
    toast('Call error: ' + msg);
    setAgentCallStatus('Error: ' + msg);
  }
}

/**
 * Owner 2026-07-19: Digest Call lives only while THIS agent is on stage.
 * Close Digest / flip / skip / answer → hang up immediately.
 */
function hangupDigestCallNow(silent){
  try {
    if (typeof agentCallConvai !== 'undefined' && agentCallConvai && agentCallConvai.active) {
      return endAgentCallConvai(!!silent);
    }
  } catch (_) { /* */ }
  return Promise.resolve();
}

/**
 * While Call is open: cancel current speech, commit in THIS agent's own style, then hang up.
 * No fixed catchphrase — Palych ≠ Lauda ≠ Julian. No-op (except hangup) if DC closed.
 */
async function digestCallConfirmAndHangup(confirmUserText, speakMs){
  if (!agentCallConvai || !agentCallConvai.active) return;
  const dc = agentCallConvai.dc;
  const wait = Math.max(1200, Math.min(4500, speakMs || 2400));
  if (dc && dc.readyState === 'open') {
    try {
      try { dc.send(JSON.stringify({ type: 'response.cancel' })); } catch (_) {}
      const ru = (typeof LOCALE !== 'undefined' && LOCALE === 'ru');
      dc.send(JSON.stringify({
        type: 'conversation.item.create',
        item: {
          type: 'message',
          role: 'user',
          content: [{ type: 'input_text', text: String(confirmUserText || '').slice(0, 500) }]
        }
      }));
      dc.send(JSON.stringify({
        type: 'response.create',
        response: {
          // Intent only — wording/register/address must stay THIS persona (session instructions)
          instructions: ru
            ? 'Owner утвердил решение. Скажи ОДНУ короткую фразу вслух: ясно, что берёшь это в работу / идёшь выполнять выбранное. ТОЛЬКО в своём стиле, манере и обращении (как в system instructions этой сессии). Не копируй чужие шаблоны и не произноси дословно «иду выполнять», если это не твой голос. Без приветствия, без повторного «на связи», без вопросов. Только своё подтверждение — и всё.'
            : 'Owner approved. Say ONE short line out loud: you accept and will execute the chosen option. ONLY in your own style, manner, and address form (per this session). Do not use a shared catchphrase. No greeting, no re-intro, no questions. Your own commit only.'
        }
      }));
      const first = (agentCallConvai.name || 'Agent').split(/\s+/)[0];
      setAgentCallStatus(first + (ru ? ' — принимает…' : ' — accepting…'));
      await new Promise(r => setTimeout(r, wait));
    } catch (_) { /* still hang up */ }
  }
  await endAgentCallConvai(true);
}

async function endAgentCallConvai(silent){
  try {
    if (agentCallConvai.dc) {
      try { agentCallConvai.dc.close(); } catch (_) {}
    }
    if (agentCallConvai.pc) {
      try { agentCallConvai.pc.close(); } catch (_) {}
    }
    if (agentCallConvai.micStream) {
      agentCallConvai.micStream.getTracks().forEach(t => { try { t.stop(); } catch (_) {} });
    }
    if (agentCallConvai.audioEl) {
      try {
        agentCallConvai.audioEl.srcObject = null;
        agentCallConvai.audioEl.remove();
      } catch (_) {}
    }
  } catch (_) { /* */ }
  agentCallConvai.pc = null;
  agentCallConvai.dc = null;
  agentCallConvai.micStream = null;
  agentCallConvai.audioEl = null;
  agentCallConvai.active = false;
  agentCallConvai.slug = null;
  agentCallConvai.name = null;
  agentCallConvai.fromDigest = false;
  agentCallConvai.brief = null;
  try {
    const b = document.getElementById('dg-call-btn');
    if (b) b.classList.remove('on');
  } catch (_) {}
  setAgentCallStatus(null);
  syncAgentCallButtons();
  if (!silent && typeof toast === 'function') toast('Call ended');
}

function resolveAgentCallSlugName(){
  let agentSlug = (typeof floatChat !== 'undefined' && floatChat && floatChat.slug) ? floatChat.slug : null;
  let agentName = (typeof floatChat !== 'undefined' && floatChat && floatChat.name) ? floatChat.name : '';
  if (!agentSlug && window.__dasorgChatSlug) agentSlug = window.__dasorgChatSlug;
  if (!agentName && window.__dasorgChatName) agentName = window.__dasorgChatName;
  if (!agentSlug && typeof selectedSlug === 'function') agentSlug = selectedSlug();
  if (!agentSlug) agentSlug = window.currentAgentSlug || null;
  try {
    if (typeof chatSlug !== 'undefined' && chatSlug) agentSlug = chatSlug;
  } catch (_) {}
  if (typeof currentSlug === 'string' && currentSlug) agentSlug = currentSlug;
  if (typeof openSlug === 'string' && openSlug) agentSlug = openSlug;
  const panel = document.querySelector('.panel-agent, #agent-panel, .drawer-agent');
  if (!agentSlug && panel && panel.dataset && panel.dataset.slug) agentSlug = panel.dataset.slug;
  if (!agentSlug && typeof activeChatSlug === 'string') agentSlug = activeChatSlug;
  if (window.__dasorgChatSlug) agentSlug = window.__dasorgChatSlug;
  if (window.__dasorgChatName) agentName = window.__dasorgChatName;
  try {
    if (!agentName && typeof AGENTS !== 'undefined') {
      const a = (AGENTS || []).find(x => x.slug === agentSlug);
      if (a) agentName = a.name || agentSlug;
    }
  } catch (_) { agentName = agentName || agentSlug; }
  return { agentSlug, agentName: agentName || agentSlug || '' };
}

async function toggleAgentCallConvai(){
  const resolved = resolveAgentCallSlugName();
  let agentSlug = resolved.agentSlug;
  let agentName = resolved.agentName;

  if (agentCallConvai.active) {
    await endAgentCallConvai(false);
    return false;
  }

  if (!agentSlug) {
    toast('Open an agent drawer first');
    return false;
  }

  setAgentCallStatus('Connecting…');
  agentCallConvai.active = true;
  agentCallConvai.slug = agentSlug;
  agentCallConvai.name = agentName || agentSlug;
  agentCallConvai.fromDigest = !!window.__dasorgCallFromDigest;
  agentCallConvai.brief = window.__dasorgCallBrief || null;
  syncAgentCallButtons();

  const first = (agentName || agentSlug).split(/\s+/)[0];
  // Capture digest brief for this call, then clear globals so next call is clean
  const callBrief = agentCallConvai.brief;
  const callFromDigest = agentCallConvai.fromDigest;
  window.__dasorgCallBrief = null;
  window.__dasorgCallFromDigest = false;

  try {
    // 1) Status — OPENAI_API_KEY on Worker?
    let status;
    try {
      status = await api('/agents/' + agentSlug + '/realtime/status');
    } catch (e) {
      await endAgentCallConvai(true);
      toast('Voice status failed: ' + ((e && e.message) || e));
      return false;
    }
    if (!status || status.configured === false) {
      await endAgentCallConvai(true);
      toast((status && status.detail) || 'OpenAI Realtime not configured (set OPENAI_API_KEY)');
      return false;
    }

    // 2) Mic + peer connection
    const ms = await navigator.mediaDevices.getUserMedia({ audio: true });
    agentCallConvai.micStream = ms;

    const pc = new RTCPeerConnection();
    agentCallConvai.pc = pc;

    const audioEl = document.createElement('audio');
    audioEl.autoplay = true;
    audioEl.setAttribute('playsinline', 'true');
    audioEl.style.display = 'none';
    document.body.appendChild(audioEl);
    agentCallConvai.audioEl = audioEl;
    pc.ontrack = (e) => {
      audioEl.srcObject = e.streams[0];
      audioEl.play().catch(() => {});
    };
    pc.onconnectionstatechange = () => {
      const st = pc.connectionState;
      if (st === 'connected') setAgentCallStatus(first + ' connected — speak freely (Realtime)');
      else if (st === 'failed' || st === 'disconnected' || st === 'closed') {
        if (agentCallConvai.active) endAgentCallConvai(true);
      } else if (st) setAgentCallStatus('Status: ' + st);
    };

    ms.getTracks().forEach(t => pc.addTrack(t, ms));

    // Data channel: transcripts + lifecycle → board chat
    const wireDc = (dc) => {
      agentCallConvai.dc = dc;
      dc.addEventListener('message', (ev) => {
        try {
          const event = JSON.parse(ev.data);
          handleRealtimeServerEvent(event, agentSlug, agentName, first);
        } catch (_) { /* non-fatal */ }
      });
      dc.addEventListener('open', () => {
        try {
          dc.send(JSON.stringify({
            type: 'session.update',
            session: {
              type: 'realtime',
              audio: {
                input: {
                  transcription: { model: 'gpt-4o-mini-transcribe' },
                  turn_detection: { type: 'semantic_vad' }
                }
              }
            }
          }));
        } catch (_) {}
        // Digest Call: agent speaks first (greet + brief), do not wait for Boss
        if (callFromDigest || callBrief) {
          try {
            setTimeout(() => {
              try {
                dc.send(JSON.stringify({ type: 'response.create' }));
              } catch (_) {}
            }, 350);
          } catch (_) {}
        }
      });
    };
    const dc = pc.createDataChannel('oai-events');
    wireDc(dc);
    // Some stacks open a server-created channel instead
    pc.ondatachannel = (e) => {
      if (e.channel) wireDc(e.channel);
    };

    // 3) Ephemeral token from Worker (API key stays server-side)
    // Digest Call POST brief so instructions include opening monologue
    setAgentCallStatus('Getting Realtime token…');
    let tok;
    try {
      const tokenBody = (callFromDigest || callBrief)
        ? { from_digest: true, brief: callBrief || null }
        : {};
      tok = await api('/agents/' + agentSlug + '/realtime/token', {
        method: 'POST',
        body: JSON.stringify(tokenBody)
      });
    } catch (e) {
      throw new Error((e && e.message) || 'realtime token failed');
    }
    const ephemeral = tok && (tok.value || tok.client_secret);
    if (!ephemeral) throw new Error('No ephemeral Realtime token from server');

    // 4) SDP offer → wait ICE → POST directly to OpenAI (avoids Worker SDP/FormData EOF)
    const offer = await pc.createOffer({ offerToReceiveAudio: true });
    await pc.setLocalDescription(offer);
    await new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const done = () => {
        if (pc.iceGatheringState === 'complete') {
          pc.removeEventListener('icegatheringstatechange', done);
          clearTimeout(timer);
          resolve();
        }
      };
      const timer = setTimeout(() => {
        pc.removeEventListener('icegatheringstatechange', done);
        resolve();
      }, 2500);
      pc.addEventListener('icegatheringstatechange', done);
    });

    const localSdp = (pc.localDescription && pc.localDescription.sdp) || offer.sdp || '';
    if (!localSdp || localSdp.length < 40 || localSdp.indexOf('v=0') !== 0) {
      throw new Error('Bad local SDP offer (empty)');
    }

    setAgentCallStatus('Connecting to OpenAI…');
    const callsUrl = (tok.calls_url) || 'https://api.openai.com/v1/realtime/calls';
    const sdpRes = await fetch(callsUrl, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + ephemeral,
        'Content-Type': 'application/sdp'
      },
      body: localSdp
    });
    const sdpText = await sdpRes.text();
    if (!sdpRes.ok) {
      let detail = sdpText.slice(0, 220);
      try {
        const j = JSON.parse(sdpText);
        detail = (j.error && j.error.message) || j.detail || j.error || detail;
      } catch (_) {}
      if (/unmarshal SDP|parse offer/i.test(String(detail))) {
        throw new Error('SDP rejected by OpenAI (offer_len=' + localSdp.length + '). Refresh and retry.');
      }
      if (/incorrect api key|invalid_api_key/i.test(String(detail))) {
        throw new Error('OpenAI key/token invalid. Update OPENAI_API_KEY on Worker.');
      }
      throw new Error('Realtime: ' + String(detail).slice(0, 180));
    }
    if (!sdpText || sdpText.indexOf('v=0') !== 0) {
      throw new Error('OpenAI returned non-SDP answer');
    }
    await pc.setRemoteDescription({ type: 'answer', sdp: sdpText });

    setAgentCallStatus(first + ' on the line — OpenAI Realtime full');
    toast('Live call with ' + first + ' (Realtime full)');
  } catch (e) {
    await endAgentCallConvai(true);
    toast('Could not start call: ' + ((e && e.message) || e));
  }
  return false;
}

const _openChatOrig = typeof openAgentChat === 'function' ? openAgentChat : null;
// Patch common open paths: when focusChat / open drawer runs, set globals
(function patchChatSlugTracker(){
  const wrap = (name) => {
    const orig = window[name];
    if (typeof orig !== 'function') return;
    window[name] = function(slug, name) {
      if (slug) {
        window.__dasorgChatSlug = slug;
        window.__dasorgChatName = name || slug;
      }
      return orig.apply(this, arguments);
    };
  };
  ['openAgent','openAgentPanel','selectAgent','focusAgent','showAgent'].forEach(wrap);
})();
