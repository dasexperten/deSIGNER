<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="dasorg-ui" content="ru-learn-report-2026-07-19">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>DASORG — Доска агентов</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/app-icon-192.png">
<link rel="apple-touch-icon" href="/assets/brand/apple-icon-180.png">
<meta name="theme-color" content="#282229">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=Manrope:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,600..900&display=swap" rel="stylesheet">
<style>
/* deSIGNER SYSTEM tokens + Brighter skill (paper canvas, rot CTAs, display type) */
:root{
  --brand-schwarz:#282229;--brand-rot:#E5202C;--brand-schwarz-ink:#1A1519;
  /* ONE gold (Owner verdict 2026-07-21): #C9A227 is THE gold — text-safe.
     #FEF004 is the YELLOW accent: gradients/marks/washes ONLY — NEVER text. */
  --brand-gold:#C9A227;--brand-yellow:#FEF004;
  /* Functional status hue (Owner verdict 2026-07-21): in-progress blue.
     NOT the brand triad (Schwarz/Rot/Gold stays sacred) — semantics token,
     same class as --status-success. */
  --status-progress:#0D199E;--status-progress-hi:#3d4fd4;
  --paper:#FBFAF6;--paper-raised:#FFFFFF;--paper-sunk:#F3F0E8;--bone:#EDE8DD;
  --stone-300:#9C9384;--stone-400:#6E6558;--stone-500:#4A4238;
  --fg-1:var(--brand-schwarz-ink);--fg-2:var(--stone-500);--fg-3:var(--stone-400);--fg-muted:var(--stone-300);
  --border-hairline:rgba(26,21,25,.08);--border-subtle:rgba(26,21,25,.14);--border-strong:rgba(26,21,25,.32);
  --status-success:#2E7D4F;--status-warning:#C77A00;--status-error:var(--brand-rot);
  /* A11y inks (Owner pass 2026-07-21, computed): brand rot/warning stay for
     SURFACES; small TEXT uses these darkened inks — ≥4.5 even on tinted washes.
     Focus ring: schwarz — 16.9:1, neutral, visible on every canvas. */
  --status-error-ink:#C91C26;--status-warning-ink:#955B00;
  --focus-ring:var(--brand-schwarz);
  --radius-sm:4px;--radius-md:6px;--radius-lg:10px;--radius-pill:999px;
  --shadow-card:0 1px 2px rgba(26,21,25,.05),0 0 0 1px var(--border-hairline);
  --shadow-raised:0 4px 16px -6px rgba(26,21,25,.12),0 0 0 1px var(--border-hairline);
  --shadow-float:0 18px 48px -18px rgba(26,21,25,.22),0 2px 6px rgba(26,21,25,.06);
  --font-display:"Archivo",system-ui,sans-serif;
  --font-body:"Archivo",system-ui,sans-serif;
  --font-meta:"Archivo Narrow",system-ui,sans-serif;
  /* Honest mono (Owner 2026-07-21): Manrope is not a monospace. Manrope
     itself stays for the My-view italic (Owner law) — just not as mono. */
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --font-serif:"Fraunces",Georgia,serif; /* book: Archivo + Fraunces (display) */
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--fg-1);font:15px/1.5 var(--font-body);min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}

/* tricolor ribbon */
.ribbon{height:4px;background:linear-gradient(90deg,var(--brand-schwarz) 0 33.33%,var(--brand-rot) 33.33% 66.66%,var(--brand-gold) 66.66% 100%)}

/* chrome */
.top{
  background:var(--paper-raised);border-bottom:1px solid var(--border-subtle);
  padding:14px 20px 12px;position:sticky;top:0;z-index:8;
  box-shadow:0 1px 0 var(--border-hairline);
}
.top-inner{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--font-serif);font-optical-sizing:auto;font-weight:900;font-size:20px;letter-spacing:.04em;line-height:1.1}
.brand .sub{font-family:var(--font-meta);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{
  border:1px solid var(--border-subtle);background:var(--paper-sunk);color:var(--fg-2);
  padding:8px 14px;border-radius:var(--radius-pill);font-weight:700;font-size:13px;
  transition:background var(--ease) 120ms,color var(--ease) 120ms,box-shadow var(--ease) 120ms;
}
.tab:hover{border-color:var(--border-strong)}
.tab.on{background:var(--brand-rot);color:#fff;border-color:var(--brand-rot);box-shadow:var(--shadow-raised)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Company GM1 daily pulse — board top (GitHub SSOT) */
.gm1-banner{
  margin:0 0 18px;padding:14px 16px;border-radius:14px;
  background:linear-gradient(135deg,rgba(20,24,36,.96),rgba(32,28,18,.94));
  border:1px solid rgba(212,175,55,.35);color:#f4efe4;
  box-shadow:0 8px 28px rgba(0,0,0,.18);
}
.gm1-banner h2{margin:0 0 6px;font-size:15px;font-weight:800;letter-spacing:.02em;color:#f0d78c}
.gm1-banner .gm1-hl{font-size:13px;line-height:1.45;opacity:.95;margin:0 0 10px}
.gm1-banner ul{margin:0;padding:0 0 0 1.1em;font-size:12.5px;line-height:1.45}
.gm1-banner li{margin:0 0 4px}
.gm1-banner .gm1-meta{margin-top:10px;font-size:11px;opacity:.65;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gm1-banner .gm1-open{cursor:pointer;border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px;
  background:#d4af37;color:#1a1408}
.gm1-banner .gm1-open:hover{filter:brightness(1.06)}
.gm1-banner.gm1-miss{border-color:rgba(255,255,255,.12);background:rgba(20,24,36,.7)}
.gm1-banner.gm1-miss h2{color:rgba(255,255,255,.75)}

/* Digest header CTA — always visible, never rely on i18n key alone */
.btn-digest{
  border:0;border-radius:var(--radius-md);padding:10px 16px;font-weight:900;font-size:14px;
  font-family:var(--font-display);box-shadow:var(--shadow-raised);
  background:var(--brand-rot);color:#fff;letter-spacing:.02em;
  min-width:7.5rem;
}
.btn-digest:hover{filter:brightness(.94)}
.btn-digest .btn-digest-ru{opacity:.9;font-weight:700;font-size:12px;margin-left:6px}
.btn{
  border:0;border-radius:var(--radius-md);padding:9px 14px;font-weight:800;font-size:13px;
  font-family:var(--font-display);box-shadow:var(--shadow-raised);transition:transform 80ms,filter-color 120ms;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand-rot);color:#fff}
.btn-primary:hover{filter:brightness(.94)}
.btn-dark{background:var(--brand-schwarz);color:#fff}
.btn-dark:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--paper-sunk);color:var(--fg-1);border:1px solid var(--border-subtle);box-shadow:none}
.btn-ok{background:var(--status-success);color:#fff}
.btn-warn{background:var(--status-warning);color:var(--brand-schwarz-ink)} /* a11y: white 3.38 → ink 4.9 */

main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}

/* login */
.login-wrap{min-height:70vh;display:grid;place-items:center;padding:24px}
.login-card{
  width:min(420px,100%);background:var(--paper-raised);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-float);overflow:hidden;border:1px solid var(--border-hairline);
}
.login-card .pad{padding:28px 24px 24px}
.login-card h1{font-family:var(--font-serif);font-optical-sizing:auto;font-weight:900;font-size:26px;margin-bottom:6px}
.login-card p{color:var(--fg-2);font-size:14px;margin-bottom:16px;line-height:1.45}
.login-card label{display:block;font-family:var(--font-meta);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);font-weight:700;margin-bottom:6px}
.login-card input{
  width:100%;padding:12px 14px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);
  background:var(--paper);margin-bottom:14px;font-family:var(--font-mono);font-size:14px;font-weight:600;
}
.login-card input:focus{outline:2px solid rgba(229,32,44,.35);border-color:var(--brand-rot)}
.login-err{color:var(--status-error-ink);font-size:13px;font-weight:600;margin:10px 0 0;min-height:1.2em}
.login-hint{margin-top:14px;padding:12px;background:var(--paper-sunk);border-radius:var(--radius-md);font-size:12px;color:var(--fg-2);line-height:1.45}
.login-hint code{font-family:var(--font-mono);font-size:11px;background:var(--paper-raised);padding:1px 5px;border-radius:3px}

/* hero strip */
.hero{
  background:var(--brand-schwarz);color:var(--paper);border-radius:var(--radius-lg);
  padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-raised);
  display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;
}
.hero h2{font-family:var(--font-display);font-weight:900;font-size:22px;margin-bottom:4px}
.hero p{color:rgba(251,250,246,.72);font-size:13px;max-width:520px}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap}
.hero-stat{
  background:rgba(254,240,4,.14);border:1px solid rgba(254,240,4,.28);color:var(--brand-schwarz-ink); /* a11y: gold 2.32 on paper — text in ink, gold keeps the wash+border */
  border-radius:var(--radius-md);padding:10px 14px;min-width:88px;text-align:center;
}
/* dashboard bars */
.dash-panel{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);padding:14px 16px;margin-bottom:16px;
}
.dash-panel h3{
  font-family:var(--font-meta);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg-3);font-weight:700;margin-bottom:10px;
}
.stack-bar{
  display:flex;width:100%;max-width:100%;box-sizing:border-box;
  height:14px;border-radius:var(--radius-pill);overflow:hidden;
  /* Empty track must be obvious full-width (not same as card paper — otherwise bar looks “cut off”) */
  background:#E8E4DC;border:1px solid rgba(26,21,25,.18);
}
.stack-bar > i{display:block;height:100%;min-width:0;flex:0 0 auto;transition:width .25s var(--ease)}
/* Remainder of track (still-to-learn / room-to-grow) — same as track so full rail is visible */
.stack-bar > i.seg-rest{flex:1 1 auto;width:auto;min-width:0;background:#E8E4DC}
.stack-bar > i.seg-blocked{background:var(--brand-rot)}
.stack-bar > i.seg-missed{background:#c41e28}
.stack-bar > i.seg-due{background:var(--status-warning)}
.stack-bar > i.seg-prog{background:var(--status-progress)}
.stack-bar > i.seg-done{background:var(--status-success)}
.stack-bar > i.seg-idle{background:var(--bone)}
.stack-bar.lg{height:18px}
.stack-bar.sm{height:8px;border-radius:var(--radius-sm)}
.bar-legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px;font-size:12px;color:var(--fg-2);font-weight:600}
.bar-legend span{display:inline-flex;align-items:center;gap:6px}
.bar-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.meter{margin-top:10px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:12px}
.meter-row .lbl{color:var(--fg-3);font-weight:600}
.meter-row .val{font-family:var(--font-mono);font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg-1)}
.meter-track{
  width:100%;max-width:100%;box-sizing:border-box;
  height:10px;background:#E8E4DC;border-radius:var(--radius-pill);overflow:hidden;
  border:1px solid rgba(26,21,25,.18);
}
.meter-track > i{
  display:block;height:100%;border-radius:var(--radius-pill);
  background:linear-gradient(90deg,var(--brand-rot),#ff5a62);
  box-shadow:inset 0 0 0 1px rgba(26,21,25,.06);
}
.meter-track > i.ok{background:linear-gradient(90deg,var(--status-success),#4caf70)}
.meter-track > i.warn{background:linear-gradient(90deg,var(--status-warning),#e0a030)}
.meter-track > i.blue{background:linear-gradient(90deg,var(--status-progress),var(--status-progress-hi))}
.meter-track > i.gold{background:linear-gradient(90deg,var(--brand-gold),var(--brand-yellow))}
.meter-track > i.green{background:linear-gradient(90deg,#1B7A3D,#3DDC84)}
/* Stacked segment colors — knowledge */
.seg-gold{background:linear-gradient(90deg,var(--brand-gold),var(--brand-yellow))}
.seg-green{background:linear-gradient(90deg,#1B7A3D,#3DDC84)}
.seg-blue{background:linear-gradient(90deg,var(--status-progress),var(--status-progress-hi))}
/* Stacked segment colors — competitiveness drivers */
.seg-act{background:linear-gradient(90deg,#E67E22,#F5A623)}
.seg-comp{background:linear-gradient(90deg,#0D9488,#2DD4BF)}
.seg-res{background:linear-gradient(90deg,#1B7A3D,#3DDC84)}
.seg-rel{background:linear-gradient(90deg,#6D28D9,#A78BFA)}
.seg-eng{background:linear-gradient(90deg,#BE185D,#F472B6)}
.seg-know{background:linear-gradient(90deg,var(--brand-gold),var(--brand-yellow))}
.card-bars{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.card-bars .meter{margin-top:0}
.card-bars .stack-bar{height:9px}
.card-bars .meter-row{font-size:11px;margin-bottom:3px}
.dual-bars{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.dual-bars .stack-bar{height:10px}
.dual-bars .meter-row{font-size:11px;margin-bottom:3px}
.know-level{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:4px;padding-top:6px;border-top:1px dashed var(--border-hairline);
  font-size:11px;font-weight:700;color:var(--fg-2);
}
.know-level b{font-family:var(--font-mono);font-size:14px;color:var(--fg-1);font-variant-numeric:tabular-nums}
.know-legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:8px;font-size:11px;color:var(--fg-3);font-weight:600}
.know-legend span{display:inline-flex;align-items:center;gap:5px}
.know-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.know-legend i.gold,.know-legend i.seg-gold{background:linear-gradient(90deg,var(--brand-gold),var(--brand-yellow))}
.know-legend i.green,.know-legend i.seg-green{background:linear-gradient(90deg,#1B7A3D,#3DDC84)}
.know-legend i.blue,.know-legend i.seg-blue{background:linear-gradient(90deg,var(--status-progress),var(--status-progress-hi))}
.know-legend i.seg-act{background:linear-gradient(90deg,#E67E22,#F5A623)}
.know-legend i.seg-comp{background:linear-gradient(90deg,#0D9488,#2DD4BF)}
.know-legend i.seg-res{background:linear-gradient(90deg,#1B7A3D,#3DDC84)}
.know-legend i.seg-rel{background:linear-gradient(90deg,#6D28D9,#A78BFA)}
.know-legend i.seg-eng{background:linear-gradient(90deg,#BE185D,#F472B6)}
.know-legend i.seg-know{background:linear-gradient(90deg,var(--brand-gold),var(--brand-yellow))}
.comp-badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:0;
  padding:5px 10px;border-radius:var(--radius-pill);
  background:rgba(13,25,158,.08);border:1px solid rgba(13,25,158,.2);
  font-size:11px;font-weight:700;color:var(--status-progress);
}
.comp-badge b{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums}
.comp-badge .sub{font-weight:600;opacity:.75;font-size:10px}
.comp-panel .comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px;font-size:11px;color:var(--fg-2)}
.comp-panel .comp-grid b{font-family:var(--font-mono);color:var(--fg-1)}
.rank-chip{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--font-mono);font-weight:800;font-size:12px;
  color:var(--status-progress);font-variant-numeric:tabular-nums;
}
/* Small rank bubble on the left of the Compete bar row — number only (2, 3, 11) */
.rank-bubble{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:18px;
  padding:0 6px;
  border-radius:var(--radius-pill);
  font-family:var(--font-mono);
  font-weight:900;
  font-size:11px;
  line-height:1;
  font-variant-numeric:tabular-nums;
  color:var(--status-progress);
  background:rgba(13,25,158,.12);
  border:1px solid rgba(13,25,158,.28);
  box-shadow:none;
  pointer-events:none;
  white-space:nowrap;
}
.compete-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.compete-row .compete-main{
  flex:1 1 auto;
  min-width:0;
}
.compete-row .compete-main .meter{margin-top:0}
.compete-row .compete-main .stack-bar{margin-top:0}
.kpi-score{
  display:flex;align-items:center;gap:12px;margin-top:10px;padding-right:56px;
}
.kpi-score .pct{
  font-family:var(--font-mono);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;
  color:var(--fg-1);min-width:3.2em;
}
.kpi-score .meter{flex:1;margin-top:0}
.ktile .meter{margin-top:10px}
.ktile .meter-track{height:8px}
.hero-stat b{display:block;font-family:var(--font-mono);font-size:22px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.hero-stat span{font-family:var(--font-meta);font-size:10px;letter-spacing:.12em;text-transform:uppercase}

/* legend — interactive status filters */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.legend .leg-btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-pill);
  background:var(--paper-raised);border:1px solid var(--border-hairline);font-size:12px;color:var(--fg-2);font-weight:600;
  cursor:pointer;font-family:inherit;transition:border-color .12s,box-shadow .12s,background .12s,color .12s;
}
.legend .leg-btn:hover{border-color:var(--border-strong);box-shadow:var(--shadow-card);color:var(--fg-1)}
.legend .leg-btn:focus-visible{outline:2px solid rgba(229,32,44,.4);outline-offset:2px}
.legend .leg-btn.on{border-color:var(--brand-rot);background:rgba(229,32,44,.06);color:var(--fg-1);box-shadow:var(--shadow-raised)}
.bar-legend .leg-btn{
  display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;
  font:inherit;font-size:12px;font-weight:600;color:var(--fg-2);padding:2px 4px;border-radius:var(--radius-sm);
}
.bar-legend .leg-btn:hover{color:var(--fg-1);background:var(--paper-sunk)}
.hero-stat{cursor:pointer;transition:transform .12s,filter .12s}
.hero-stat:hover{transform:translateY(-1px);filter:brightness(1.08)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-red{background:var(--status-error)}.dot-amber{background:var(--status-warning)}
.dot-blue{background:var(--status-progress)}.dot-green{background:var(--status-success)}.dot-ok{background:var(--stone-300)}

/* status process widget */
.sw-backdrop{
  position:fixed;inset:0;background:rgba(26,21,25,.48);z-index:30;display:none;
  align-items:center;justify-content:center;padding:16px;
}
.sw-backdrop.on{display:flex}
.sw{
  width:min(560px,100%);max-height:min(86vh,720px);overflow:auto;
  background:var(--paper-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);
  border:1px solid var(--border-hairline);
}
.sw-head{padding:16px 18px 12px;border-bottom:1px solid var(--border-hairline);position:sticky;top:0;background:var(--paper-raised);z-index:1}
.sw-head h3{font-family:var(--font-display);font-weight:900;font-size:18px;margin-bottom:4px}
.sw-head p{font-size:13px;color:var(--fg-2);line-height:1.4}
.sw-x{
  float:right;width:34px;height:34px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  background:var(--paper-sunk);font-size:18px;line-height:1;display:grid;place-items:center;color:var(--fg-2);cursor:pointer;
}
.sw-process{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;
}
.sw-process button{
  flex:1 1 100px;border:1px solid var(--border-hairline);background:var(--paper-sunk);border-radius:var(--radius-md);
  padding:8px 6px;font-size:11px;font-weight:700;color:var(--fg-2);cursor:pointer;font-family:var(--font-meta);
  letter-spacing:.04em;text-transform:uppercase;
}
.sw-process button.on{background:var(--brand-schwarz);color:var(--paper);border-color:var(--brand-schwarz)}
.sw-process button .n{display:block;font-family:var(--font-mono);font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.sw-body{padding:12px 16px 18px}
.sw-row{
  border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px;margin-bottom:10px;
  background:var(--paper);cursor:pointer;transition:border-color .12s,box-shadow .12s;
}
.sw-row:hover{border-color:var(--border-strong);box-shadow:var(--shadow-card)}
.sw-row .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.sw-row .agent{font-weight:800;font-size:14px}
.sw-row .mail{font-size:12px;color:var(--fg-3);font-weight:600;line-height:1.25} /* role under name */
.sw-row .task{font-size:13px;font-weight:700;color:var(--fg-1);margin-bottom:4px}
.sw-row .brief{font-size:12px;color:var(--fg-2);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sw-row .meta{font-size:11px;color:var(--fg-3);font-weight:600;margin-bottom:6px}
.sw-empty{text-align:center;padding:28px 12px;color:var(--fg-2);font-size:13px}

.sec{
  font-family:var(--font-meta);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--fg-3);font-weight:700;margin:20px 0 10px;
}

/* agent cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;overflow:visible;padding-top:4px;align-items:stretch}
/* Card = flex column so the red chat bar can pin to the bottom of equal-height rows */
.card{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);padding:0;overflow:visible;cursor:pointer;position:relative;
  display:flex;flex-direction:column;
  transition:box-shadow var(--ease) 160ms,transform var(--ease) 160ms,border-color var(--ease) 160ms;
}
.card:hover{box-shadow:var(--shadow-raised);transform:translateY(-1px);border-color:var(--border-subtle)}
.card.needs{border-color:rgba(229,32,44,.35);box-shadow:0 0 0 1px rgba(229,32,44,.12),var(--shadow-raised)}
.card-top{height:4px;background:var(--stone-200)}
.card.needs .card-top{background:var(--brand-rot)}
/* Equal side padding. Full-width: knowledge/compete bars + footer process lines.
   Name / role reserve space for larger top-right avatar (62px = 48×1.3). No status badges. */
.card-body{padding:34px 14px 16px 14px;position:relative;min-height:110px;overflow:visible;display:flex;flex-direction:column;flex:1}
.card-body > .nm,
.card-body > .rl{padding-right:74px;box-sizing:border-box}
/* Bars edge-to-edge of card body (same width as footer text). Avatar only eats name/role. */
.card .dual-bars{
  width:100% !important;max-width:100% !important;
  padding-right:0 !important;margin-right:0 !important;margin-left:0 !important;
  box-sizing:border-box;align-self:stretch;
}
.card .dual-bars .card-bars,
.card .dual-bars .meter{
  width:100% !important;max-width:100% !important;box-sizing:border-box;
  padding-right:0 !important;margin-right:0 !important;
}
.card .dual-bars .stack-bar,
.card .dual-bars .meter-track{
  width:100% !important;max-width:100% !important;display:flex;box-sizing:border-box;
}
.card .dual-bars .compete-row{
  width:100% !important;max-width:100% !important;display:flex;align-items:center;gap:8px;
  box-sizing:border-box;padding-right:0 !important;
}
.card .dual-bars .compete-main{
  flex:1 1 auto;min-width:0;width:auto;max-width:none;box-sizing:border-box;
}
.card .dual-bars .compete-main .stack-bar{width:100% !important}
/* Avatar sits top-right — 30% larger than 48px → 62px.
   Optional result-ready ! sits LEFT of avatar (same size). */
.card .avatar-slot{
  position:absolute;top:30px;right:12px;z-index:4;
  display:flex;flex-direction:row;align-items:center;gap:8px;
  width:auto;height:62px;overflow:visible;
}
.card.has-result .nm,
.card.has-result .rl{padding-right:150px}

.card .avatar{
  width:62px;height:62px;border-radius:var(--radius-md);flex:0 0 62px;
  object-fit:cover;object-position:center top;background:var(--paper-sunk);
  border:1px solid var(--border-hairline);box-shadow:var(--shadow-card);
  display:block;
}
/* Green blinking “result ready” — left of avatar, same size (Owner) */
.card .card-result-ready{
  width:62px;height:62px;flex:0 0 62px;padding:0;margin:0;
  border:0;border-radius:var(--radius-md);cursor:pointer;
  background:#1a9f4a;color:#fff;
  font-family:var(--font-display);font-weight:900;font-size:34px;line-height:1;
  display:grid;place-items:center;
  box-shadow:0 0 0 2px rgba(26,159,74,.4), var(--shadow-card);
  animation:result-blink 1.05s ease-in-out infinite;
  z-index:5;
}
.card .card-result-ready:hover{filter:brightness(1.08)}
.card .card-result-ready:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
@keyframes result-blink{
  0%,100%{opacity:1;filter:brightness(1);box-shadow:0 0 0 2px rgba(26,159,74,.4),var(--shadow-card)}
  50%{opacity:.62;filter:brightness(1.2);box-shadow:0 0 12px 2px rgba(26,159,74,.55),var(--shadow-card)}
}
/* Result popup from card ! */
.result-pop{
  display:none;position:fixed;inset:0;z-index:1400;
  background:rgba(26,21,25,.55);align-items:center;justify-content:center;
  padding:20px;box-sizing:border-box;
}
.result-pop.on{display:flex}
.result-pop-panel{
  width:min(520px,100%);max-height:min(80vh,640px);overflow:auto;
  background:var(--paper);color:var(--fg-1);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-float);padding:18px 18px 16px;box-sizing:border-box;
}
.result-pop-panel h3{margin:0 0 6px;font-family:var(--font-display);font-size:18px}
.result-pop-panel .rp-meta{font-size:12px;color:var(--fg-3);margin:0 0 12px}
.result-pop-panel .rp-body{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.result-pop-panel .rp-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.card .avatar-fallback{
  width:62px;height:62px;border-radius:var(--radius-md);flex:0 0 62px;
  background:var(--brand-schwarz);color:var(--paper);display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:.02em;
  border:1px solid var(--border-hairline);
}
/* Comic speech bubble — top-right angle of avatar; 2-word Owner confirm */
.card .comic-say{
  position:absolute;
  /* fully outside avatar: sit above the 62×62 photo */
  left:auto;right:-4px;top:auto;bottom:calc(100% + 8px);
  z-index:6;
  max-width:100px;padding:5px 8px 6px;
  background:#FFFEF2;color:var(--brand-schwarz);
  border:2.5px solid var(--brand-schwarz);border-radius:12px;
  font-family:var(--font-display);font-weight:900;font-size:10px;line-height:1.1;
  letter-spacing:.02em;text-align:center;text-transform:none;
  box-shadow:2px 2px 0 rgba(26,21,25,.16);
  white-space:nowrap;overflow:visible;
  pointer-events:none;animation:comic-pop .35s var(--ease) both;
}

.card .comic-say::after{
  content:"";position:absolute;right:14px;top:100%;bottom:auto;
  width:8px;height:8px;margin-top:-4px;
  background:#FFFEF2;border-right:2.5px solid var(--brand-schwarz);
  border-bottom:2.5px solid var(--brand-schwarz);transform:rotate(45deg);
}

.card.needs .comic-say{border-color:var(--brand-rot);color:var(--status-error-ink)}
.card.needs .comic-say::after{border-color:var(--brand-rot)}
/* Chat on card — full-width red bar, hard to miss; opens floating chat */
.card-chat-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-top:auto;min-height:44px;padding:10px 14px;
  border:0;border-radius:var(--radius-md);cursor:pointer;
  background:var(--brand-rot);color:#fff;
  font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.02em;
  box-shadow:var(--shadow-raised);
  transition:filter .12s,transform .12s;
  position:relative;z-index:6;
}
.card-chat-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.card-chat-btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.card-chat-btn svg{width:18px;height:18px;display:block;flex:0 0 auto}
.card-chat-btn .card-chat-lbl{line-height:1}
/* Learn on card — gold twin beside Chat: Boss source drop (t.me / YouTube / site) */
.card-btn-row{display:flex;gap:8px;margin-top:auto;position:relative;z-index:6}
.card-btn-row .card-chat-btn{flex:1 1 auto;width:auto;margin-top:0}
.card-learn-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  flex:0 0 auto;min-height:44px;padding:10px 16px;
  border:0;border-radius:var(--radius-md);cursor:pointer;
  background:var(--brand-gold);color:var(--brand-schwarz-ink);
  font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.02em;
  box-shadow:var(--shadow-raised);transition:filter .12s,transform .12s;
}
.card-learn-btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.card-learn-btn:focus-visible{outline:2px solid var(--brand-rot);outline-offset:2px}
.card-learn-btn[disabled]{opacity:.6;cursor:wait;transform:none}
.card-learn-btn svg{width:17px;height:17px;display:block;flex:0 0 auto}
.learn-veil{position:fixed;inset:0;background:rgba(26,21,25,.55);z-index:220;display:flex;align-items:center;justify-content:center;padding:16px}
.learn-box{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-raised);width:min(460px,100%);padding:18px}
.learn-box h3{margin:0 0 8px;font-family:var(--font-display);font-size:16px}
.learn-box input{width:100%;box-sizing:border-box;margin:0 0 10px;padding:10px 12px;border:1.5px solid var(--brand-schwarz);border-radius:8px;font-size:14px}
.learn-box .learn-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.learn-box ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.45;max-height:38vh;overflow:auto}
.learn-note{font-size:12.5px;color:#6b6470;margin:0 0 10px}
.card-follow-btn{
  display:flex;align-items:center;justify-content:center;
  min-height:44px;padding:10px 16px;border-radius:var(--radius-md);cursor:pointer;
  border:0;background:var(--status-success);color:#fff;
  font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.02em;
  transition:filter .12s,transform .12s,background .12s;
}
.card-follow-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.card-follow-btn:focus-visible{outline:2px solid var(--brand-rot);outline-offset:2px}
.card-follow-btn[disabled]{opacity:.6;cursor:wait;transform:none;filter:none}
/* Learn / Follow live progress while request runs */
.learn-progress{
  display:none;margin:12px 0 0;padding:12px 12px 10px;border-radius:10px;
  background:#f6f4f1;border:1px solid rgba(40,34,41,.1);
}
.learn-progress.on{display:block}
.learn-progress.done{background:rgba(46,125,79,.08);border-color:rgba(46,125,79,.28)}
.learn-progress.fail{background:rgba(229,32,44,.06);border-color:rgba(229,32,44,.28)}
.learn-progress-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 0 8px;font-size:13px;font-weight:700;color:var(--fg-1);
}
.learn-progress-pct{
  font-family:var(--font-mono);font-size:13px;font-weight:800;
  color:var(--brand-schwarz);min-width:3.2em;text-align:right;
}
.learn-progress.done .learn-progress-pct{color:var(--status-success)}
.learn-progress.fail .learn-progress-pct{color:var(--status-error-ink)}
.learn-progress-track{
  height:10px;border-radius:999px;background:rgba(40,34,41,.1);overflow:hidden;
}
.learn-progress-bar{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--brand-gold),#f5c518 55%,var(--status-success));
  transition:width .35s ease;
}
.learn-progress.follow-mode .learn-progress-bar{
  background:linear-gradient(90deg,#1f7a4a,var(--status-success),#4caf70);
}
.learn-progress.fail .learn-progress-bar{
  background:var(--brand-rot);
}
.learn-progress-stage{
  margin:8px 0 0;font-size:12.5px;color:#5c5560;line-height:1.35;min-height:1.35em;
}
.learn-progress-stage b{color:var(--fg-1);font-weight:700}
.learn-inputs-locked input{opacity:.65;pointer-events:none}
.learn-report{
  margin:12px 0 0;padding:12px 14px;border-radius:10px;
  background:#faf8f5;border:1.5px solid rgba(40,34,41,.12);
}
.learn-report h4{
  margin:0 0 8px;font-family:var(--font-display);font-size:14px;font-weight:800;
  color:var(--brand-schwarz-ink);letter-spacing:.01em;
}
.learn-report .learn-report-sum{
  margin:0 0 10px;font-size:13.5px;line-height:1.45;color:var(--fg-1);
}
.learn-report ol{
  margin:0;padding-left:1.25em;font-size:13.5px;line-height:1.5;color:var(--fg-1);
  max-height:42vh;overflow:auto;
}
.learn-report ol li{margin:0 0 6px}
.learn-report .learn-playbook{
  margin:12px 0 0;padding-top:10px;border-top:1px solid rgba(40,34,41,.1);
}
.learn-report .learn-playbook b{font-size:12.5px;color:#5c5560}
.learn-report .learn-playbook ul{margin:6px 0 0;padding-left:1.2em;font-size:13px;line-height:1.4}
@keyframes comic-pop{
  from{opacity:0;transform:scale(.6) translate(4px,-4px)}
  to{opacity:1;transform:scale(1) translate(0,0)}
}
.card .nm{
  font-family:var(--font-display);font-weight:800;font-size:17px;margin-bottom:2px;padding-right:4px;
  line-height:1.15;min-height:calc(1.15em * 2); /* always reserve two name lines */
}
.card .nm .fn,.card .nm .ln{display:block}
/* Second line under name = role only (never email) */
.card .rl{
  color:var(--fg-3);font-size:13px;margin-bottom:12px;padding-right:4px;line-height:1.25;
  font-weight:600;
}
.badges{
  display:flex;flex-wrap:nowrap;align-items:center;gap:3px;
  width:100%;max-width:100%;min-width:0;
}
.b{
  font-family:var(--font-mono);font-size:clamp(8px, 2.1vw, 10px);font-weight:700;
  padding:2px 5px;border-radius:var(--radius-pill);
  background:var(--paper-sunk);color:var(--fg-2);border:1px solid var(--border-hairline);
  flex:1 1 0;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-align:center;line-height:1.2;
  box-sizing:border-box;
}
.b.red{background:rgba(229,32,44,.1);color:var(--status-error-ink);border-color:rgba(229,32,44,.25)}
.b.amber{background:rgba(199,122,0,.12);color:var(--status-warning-ink);border-color:rgba(199,122,0,.25)}
.b.blue{background:rgba(13,25,158,.08);color:var(--status-progress);border-color:rgba(13,25,158,.18)}
.b.green{background:rgba(46,125,79,.1);color:var(--status-success);border-color:rgba(46,125,79,.22)}
.card-foot{
  margin-top:12px;margin-bottom:12px;display:block;width:100%;max-width:100%;
  min-width:0;box-sizing:border-box;
  /* Full width edge-to-edge inside card padding — no right empty reserve */
  padding-right:0;margin-right:0;
}
.card-foot .status-line{font-size:11px;color:var(--fg-3);font-weight:600;text-align:left;display:block;width:100%}
.card-foot .status-line em{color:var(--status-error-ink);font-style:normal;font-weight:800}
.card-foot .now-lines{
  display:block;width:100%;max-width:100%;min-width:0;text-align:left;
  font-size:10.5px;font-style:italic;font-weight:500;font-family:var(--font-body);
  color:var(--fg-3);line-height:1.4;
  box-sizing:border-box;
}
/* Human doing-line; may wrap on card */
.card-foot .now-lines span{
  display:-webkit-box;width:100%;max-width:100%;
  white-space:normal;overflow:hidden;
  -webkit-line-clamp:3;-webkit-box-orient:vertical;
}
.card-foot .now-lines span.muted{opacity:.75}

/* empty */
.empty{
  text-align:center;padding:40px 20px;background:var(--paper-raised);border-radius:var(--radius-lg);
  border:1px dashed var(--border-subtle);color:var(--fg-2);
}
.empty h3{font-family:var(--font-display);font-weight:800;color:var(--fg-1);margin-bottom:6px}

/* drawer */
.drawer{position:fixed;inset:0;background:rgba(26,21,25,.45);display:none;justify-content:flex-end;z-index:20}
.drawer.on{display:flex}
.panel{
  width:min(540px,100%);background:var(--paper);overflow-y:auto;
  box-shadow:var(--shadow-float);animation:slideIn 200ms var(--ease);
}
@keyframes slideIn{from{transform:translateX(12px);opacity:.6}to{transform:none;opacity:1}}
.panel-head{
  position:sticky;top:0;background:var(--paper-raised);border-bottom:1px solid var(--border-subtle);
  padding:14px 16px;z-index:2;
}
.panel-head .x{
  float:right;width:36px;height:36px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  background:var(--paper-sunk);font-size:18px;line-height:1;display:grid;place-items:center;color:var(--fg-2);
}
.panel-head h2{font-family:var(--font-display);font-weight:900;font-size:20px;padding-right:44px}
.panel-head .rl{color:var(--fg-3);font-size:13px;margin-top:2px}
.panel-body{padding:16px}
.run{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-card);cursor:pointer;
}
.run.hot{border-color:rgba(229,32,44,.4)}
.run .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.run .title{font-weight:800;font-size:14px}
.run .id{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);font-weight:700;margin-right:6px}
.chip{
  font-family:var(--font-meta);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:3px 8px;border-radius:var(--radius-pill);border:1px solid var(--border-hairline);white-space:nowrap;
}
.chip.due{background:rgba(199,122,0,.12);color:var(--status-warning-ink)}
.chip.in_progress{background:rgba(13,25,158,.1);color:var(--status-progress)}
.chip.done{background:rgba(46,125,79,.12);color:var(--status-success)}
.chip.missed,.chip.blocked{background:rgba(229,32,44,.1);color:var(--status-error-ink)}
.meta{font-size:12px;color:var(--fg-3);margin-top:4px;font-family:var(--font-mono)}
.bar{height:6px;background:var(--paper-sunk);border-radius:var(--radius-pill);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand-rot);border-radius:var(--radius-pill)}
.det{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-hairline);font-size:13px;color:var(--fg-2);line-height:1.45}
.run.open .det{display:block}
.det b{color:var(--fg-1)}
.det p{margin:0 0 8px}
.brief{
  background:var(--paper-sunk);border:1px solid var(--border-hairline);border-radius:var(--radius-md);
  padding:10px 12px;margin:0 0 10px;font-size:13px;color:var(--fg-1);line-height:1.45;
}
.brief .tag{
  font-family:var(--font-meta);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--status-error-ink);font-weight:700;margin-bottom:4px;
}
.brief-why{color:var(--fg-2);font-size:12px;margin-top:6px}
.field{margin:0 0 10px}
.field .lab{
  font-family:var(--font-meta);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--fg-3);font-weight:700;margin-bottom:3px;
}
.field .val{color:var(--fg-1);font-size:13px;line-height:1.4}
.agent-brief{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow-card);font-size:13px;line-height:1.45;color:var(--fg-2);
}
.agent-brief strong{color:var(--fg-1)}
.cad-card{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-md);
  padding:12px;margin-bottom:8px;
}
.cad-card .ct{font-weight:800;font-size:14px;margin-bottom:6px}
.cad-card .cid{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);font-weight:700;margin-right:6px}
.act{display:grid;grid-template-columns:64px 1fr;gap:8px;margin-top:10px}
.act input,.act textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  background:var(--paper);font-size:13px;
}
.act-btns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}

/* Live work table (ex-KPI wall) — real board runs, Lena view */
.live-head{
  margin:0 0 14px;padding:0 0 12px;border-bottom:1px solid var(--border-hairline);
}
.live-head h2{
  font-family:var(--font-display);font-weight:900;font-size:22px;margin:0 0 6px;line-height:1.15;
}
.live-head p{margin:0;color:var(--fg-2);font-size:14px;line-height:1.45;max-width:48rem}
.live-meta{
  margin-top:8px;font-family:var(--font-meta);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--fg-3);font-weight:700;
}
.live-wrap{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);overflow:auto;
}
.live-table{
  width:100%;border-collapse:collapse;min-width:420px;font-size:13px;
}
.live-table thead th{
  text-align:left;padding:10px 12px;font-family:var(--font-meta);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);font-weight:700;
  background:var(--paper-sunk);border-bottom:1px solid var(--border-hairline);white-space:nowrap;
}
.live-table tbody td{
  padding:12px 12px;border-bottom:1px solid var(--border-hairline);vertical-align:top;
  color:var(--fg-1);
}
.live-table tbody tr{cursor:pointer;transition:background 120ms}
.live-table tbody tr:hover{background:rgba(229,32,44,.04)}
.live-table tbody tr:last-child td{border-bottom:0}
/* Task cell = multi-line description (title + 2–3 body lines); was status/% zone */
.live-table .col-task{
  min-width:16rem;max-width:42rem;width:auto;
  font-family:var(--font-body);font-weight:500;font-size:12.5px;line-height:1.45;
}
.live-table .col-task .task-title{
  display:block;font-family:var(--font-display);font-weight:800;font-size:13.5px;
  line-height:1.3;margin:0 0 6px;color:var(--fg-1);
}
.live-table .col-task .task-line{
  display:block;margin:0 0 3px;color:var(--fg-2);font-weight:500;
}
.live-table .col-task .task-line:last-child{margin-bottom:0}
.live-table .col-agent{
  font-weight:700;width:22%;font-size:13px;vertical-align:top;min-width:11rem;
}
.live-table .col-agent .agent-cell{
  display:flex;align-items:flex-start;gap:10px;
}
/* Square avatar — not circle (Owner) */
.live-table .col-agent .live-av{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--radius-md);
  object-fit:cover;object-position:center top;background:var(--paper-sunk);
  border:1px solid var(--border-hairline);box-shadow:var(--shadow-card);display:block;
}
.live-table .col-agent .live-av-fb{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--radius-md);
  background:var(--brand-schwarz);color:var(--paper);display:none;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:13px;
  border:1px solid var(--border-hairline);
}
.live-table .col-agent .agent-meta{min-width:0;padding-top:1px}
.live-table .col-agent .agent-meta .nm{font-weight:800;line-height:1.25}
.live-table .col-agent .role{
  display:block;font-weight:600;font-size:10.5px;color:var(--fg-3);margin-top:3px;
  font-family:var(--font-meta);letter-spacing:.04em;text-transform:none;white-space:normal;
  max-width:10rem;line-height:1.3;
}
/* Progress + title under avatar — desktop hidden; mobile shown under % */
.live-table .col-agent .live-pct{
  display:none;
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:800;
  font-size:14px;margin-top:6px;line-height:1.2;
}
.live-table .col-agent .live-pct.done{color:var(--status-success)}
.live-table .col-agent .live-pct.partial{color:var(--status-progress)}
.live-table .col-agent .live-pct.empty{color:var(--fg-3);font-weight:600}
.live-table .col-agent .live-title{
  display:none;
  font-family:var(--font-display);font-weight:800;font-size:13px;
  line-height:1.3;margin-top:8px;color:var(--fg-1);word-break:break-word;
}
.live-table .col-progress{
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:800;
  font-size:14px;white-space:nowrap;text-align:right;width:4.5rem;vertical-align:middle;
  color:var(--fg-1);
}
.live-table .col-progress.done{color:var(--status-success)}
.live-table .col-progress.partial{color:var(--status-progress)}
.live-table .col-progress.empty{color:var(--fg-3);font-weight:600}
.live-empty{padding:28px 16px;text-align:center;color:var(--fg-2);font-weight:600}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brand-schwarz);color:#fff;
  padding:10px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;box-shadow:var(--shadow-float);
  z-index:30;display:none;
}
.toast.on{display:block}

@media(max-width:640px){
  .top-inner{align-items:stretch}
  .tabs,.actions{width:100%}
  .tab,.btn{flex:1;text-align:center}
  .hero{padding:16px}
}

/* Live work narrow screens: force 40% / 60% (Owner — was looking 50/50 due to cache / 640px gap) */
@media(max-width:900px){
  .live-wrap{overflow:hidden;width:100%}
  .live-table{
    min-width:0 !important;width:100% !important;table-layout:fixed !important;font-size:12px;
  }
  .live-table col.live-col-agent{width:40%}
  .live-table col.live-col-task{width:60%}
  .live-table col.live-col-pct{width:0}
  .live-table thead th.col-progress,
  .live-table tbody td.col-progress,
  .live-table thead th:nth-child(3){
    display:none !important;width:0 !important;padding:0 !important;border:0 !important;
  }
  .live-table .col-agent{
    width:40% !important;min-width:0 !important;max-width:40% !important;
    padding:10px 8px;box-sizing:border-box;vertical-align:top;
  }
  .live-table .col-task{
    width:60% !important;min-width:0 !important;max-width:60% !important;
    padding:10px 8px;box-sizing:border-box;font-size:12px;
  }
  .live-table .col-task .task-title{display:none !important}
  .live-table .col-task .task-line{font-size:11.5px}
  .live-table .col-agent .agent-cell{
    flex-direction:column;align-items:flex-start;gap:6px;
  }
  .live-table .col-agent .live-av,
  .live-table .col-agent .live-av-fb{
    width:56px;height:56px;font-size:15px;
  }
  .live-table .col-agent .agent-meta{width:100%;padding-top:0}
  .live-table .col-agent .agent-meta .nm{font-size:14px;line-height:1.25}
  .live-table .col-agent .role{
    font-size:11.5px;max-width:none;margin-top:2px;
  }
  .live-table .col-agent .live-pct{
    display:block !important;font-size:15px;margin-top:8px;
  }
  .live-table .col-agent .live-title{
    display:block !important;font-size:13px;margin-top:8px;
  }
}

/* Agent chat (OpenRouter) */
.chat-wrap{margin-top:8px;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--paper-raised);overflow:hidden}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border-hairline);background:var(--paper-sunk)}
.chat-head h3{font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0}
.chat-head .hint{font-size:11px;color:var(--fg-3);font-weight:600}
.chat-log{max-height:320px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.chat-msg{max-width:92%;padding:10px 13px;border-radius:12px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.chat-msg.user{align-self:flex-end;background:var(--brand-schwarz);color:#fff;font-weight:500;-webkit-font-smoothing:antialiased;border-bottom-right-radius:4px}
.chat-msg.assistant{align-self:flex-start;background:#FFFEF2;border:1.5px solid var(--border-subtle);color:var(--fg-1);border-bottom-left-radius:4px}
.chat-msg .who{display:block;font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-bottom:4px;font-weight:700}
.chat-msg .ch{font-weight:600;opacity:.85;letter-spacing:.06em}
.chat-msg.tg{box-shadow:inset 3px 0 0 #2AABEE}
.chat-msg.err{border-color:var(--brand-rot);color:var(--status-error-ink)}
/* Reply row: Call + Send only (mic removed Owner 2026-07-19) — textarea gets the free width */
.chat-form{
  display:flex;align-items:flex-end;gap:8px;
  padding:10px;border-top:1px solid var(--border-hairline);background:var(--paper-raised);
  flex:0 0 auto;
}
.chat-form textarea{
  flex:1 1 auto;min-width:0;width:auto;
  min-height:48px;max-height:140px;height:auto;
  resize:vertical;overflow-y:auto;
  border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  padding:10px 12px;font:15px/1.45 var(--font-body);
  background:var(--paper);box-sizing:border-box;
}
.chat-form textarea:focus{outline:2px solid rgba(229,32,44,.25);border-color:var(--brand-rot)}
.chat-form .btn,
.chat-form button{
  flex:0 0 auto;align-self:flex-end;white-space:nowrap;
  height:48px;min-height:48px;padding:0 16px;line-height:48px;box-sizing:border-box;
}
.chat-form .chat-call-btn{
  height:48px;min-height:48px;padding:0 12px;line-height:48px;
}
.chat-empty{color:var(--fg-3);font-size:13px;text-align:center;padding:18px 8px}
/* Speak-reply button — agent's ElevenLabs voice; sits in the message label row */
.chat-say{
  float:right;width:22px;height:22px;padding:2px;margin:-2px 0 0 8px;box-sizing:border-box;
  display:inline-grid;place-items:center;cursor:pointer;
  border:1px solid var(--border-subtle);border-radius:6px;
  background:transparent;color:var(--fg-3);
}
.chat-say:hover{border-color:var(--brand-rot);color:var(--brand-rot)}
.chat-say svg{width:14px;height:14px;display:block}
.chat-say.loading{animation:say-blink 1s ease-in-out infinite;pointer-events:auto}
.chat-say.playing{background:var(--brand-rot);border-color:var(--brand-rot);color:#fff}
@keyframes say-blink{0%,100%{opacity:1}50%{opacity:.35}}
/* Mic button — voice input (ElevenLabs STT); sits left of Send */
.chat-mic{
  flex:0 0 auto;width:40px;height:40px;min-height:40px;padding:0;box-sizing:border-box;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  background:var(--paper-sunk);color:var(--fg-2);
}
.chat-mic:hover{border-color:var(--brand-rot);color:var(--brand-rot)}
.chat-mic svg{width:18px;height:18px;display:block}
.chat-mic.rec{
  background:var(--brand-rot);border-color:var(--brand-rot);color:#fff;
  animation:mic-pulse 1.2s ease-in-out infinite;
}
.chat-mic.busy{opacity:.55;pointer-events:none;animation:none}
.chat-call-btn{
  border:1px solid var(--border-hairline);background:var(--paper);color:var(--fg-1);
  border-radius:var(--radius-md);padding:8px 10px;font-weight:700;font-size:12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.chat-call-btn:hover{border-color:var(--brand-rot);color:var(--brand-rot)}
.chat-call-btn.on{
  background:rgba(229,32,44,.1);border-color:var(--brand-rot);color:var(--status-error-ink);
  box-shadow:0 0 0 1px rgba(229,32,44,.2);
}
.chat-call-status{
  display:none;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--fg-2);
  padding:6px 10px;margin:0 0 8px;border-radius:var(--radius-md);
  background:linear-gradient(135deg,rgba(229,32,44,.08),rgba(197,165,114,.12));
  border:1px solid rgba(229,32,44,.22);
}
.chat-call-status.on{display:flex}
.chat-call-status .dot{color:var(--brand-rot);font-weight:900}
@keyframes mic-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(229,32,44,.45)}
  50%{box-shadow:0 0 0 6px rgba(229,32,44,0)}
}
.chat-head h3{text-transform:none;letter-spacing:0;font-size:15px}
/* Compete drivers accordion — closed by default */
.cidx-acc{margin-top:8px;border-top:1px solid var(--border-hairline);padding-top:8px}
.cidx-acc > summary{
  cursor:pointer;list-style:none;font-size:12px;font-weight:700;color:var(--fg-3);
  font-family:var(--font-meta);letter-spacing:.08em;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;
}
.cidx-acc > summary::-webkit-details-marker{display:none}
.cidx-acc > summary::after{content:"▸";font-size:11px}
.cidx-acc[open] > summary::after{content:"▾"}
.cidx-acc .cidx-row,.cidx-acc .comp-grid span{font-size:13px}
.panel-head .rl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Seminar / Quick Meeting modal */

.sem-panel{

.sem-preview .sp-kind{

.sem-preview .sp-title{font-size:14px;font-weight:800;color:var(--fg-1);line-height:1.3;margin:0 0 4px}

.sem-material{

.sem-prog-head b{font-size:16px;color:var(--fg-1);font-family:var(--font-display)}
.sem-prog{height:12px;background:var(--paper-sunk);border-radius:999px;overflow:hidden;border:1px solid var(--border-hairline)}

.sem-sec{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin:14px 0 8px}
.sem-q-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.sem-q{border:1px solid var(--border-hairline);border-radius:var(--radius-md);background:var(--paper-raised);overflow:hidden}

.sem-q-btn{

.sem-q-who{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:4px}
.sem-q-text{display:block;font-size:13.5px;line-height:1.4;color:var(--fg-1);font-weight:600}
.sem-q-hint{display:block;font-size:11px;color:var(--status-error-ink);margin-top:4px;font-weight:600}
.sem-ans-wrap{padding:0 12px 10px}
.sem-ans{width:100%;box-sizing:border-box;min-height:56px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:8px;font:13px/1.4 var(--font-body)}
.sem-a{padding:0 12px 10px;font-size:13px;line-height:1.45;color:var(--fg-2);font-style:italic}
.sem-ask-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sem-ask-row .sem-input:not(.sem-select){flex:1 1 160px}

/* ========== Digest — 50/50 left report · right photo (Owner 2026-07-21 · Marika/Andrea) ========== */
#digest-modal{
  display:none;position:fixed;inset:0;z-index:1200;
  width:100%;max-width:100vw;height:100%;min-height:100vh;min-height:100dvh;
  background:#141015;overflow:hidden;
  touch-action:manipulation;
}
#digest-modal.on{display:block}
body.dg-open{overflow:hidden;position:fixed;width:100%;max-width:100vw}
.dg-stage{
  position:absolute;inset:0;width:100%;max-width:100vw;height:100%;
  overflow:hidden;background:#141015;color:#fff;
}
/* Mobile scroll shell (desktop: transparent pass-through) */
.dg-scroll{display:contents}
.dg-scroll-pad{display:none}
.dg-sheet{display:contents}
.dg-cap-mob{display:none}
/* RIGHT photo — half width (50/50 with left) */
.dg-right{
  position:absolute;top:0;right:0;bottom:0;
  width:50%;min-width:0;max-width:50%;
  z-index:1;pointer-events:none;
  background:#1a1519;
}
.dg-photo-wrap{
  position:absolute;inset:0;overflow:hidden;
  background-color:#1a1519;
  /*
   * Full-bleed portrait (Owner 2026-07-21): NOT zoom-out, NOT tight face-crop.
   * Cover whole panel like before — bust + mid-torso visible.
   * Face sits in the UPPER ~40%; below that = body, not the face.
   */
  background-position:center top;
  background-size:cover;
  background-repeat:no-repeat;
  min-height:100%;
}
/* Soft edges — light on face band (upper 40%); lift only lower body for caption */
.dg-photo-fade{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(to right,
      rgba(20,16,21,.48) 0%,
      rgba(20,16,21,.16) 10%,
      transparent 26%),
    linear-gradient(to bottom,
      rgba(20,16,21,.18) 0%,
      transparent 10%,
      transparent 42%,
      rgba(20,16,21,.12) 58%,
      rgba(20,16,21,.42) 80%,
      rgba(14,11,15,.7) 100%);
}
/*
 * Face in UPPER HALF (Owner hard).
 * Default object-position Y ~35–82% depending on source crop (see digestFaceY).
 * High % for env shots (Mina) crops ceiling and lifts the face.
 */
.dg-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  max-height:none;
  object-fit:cover;
  object-position:center 35%;
  display:block;z-index:1;
  opacity:1;visibility:visible;
  transform-origin:center center;
  transform:none;
}
.dg-photo[data-face-y]{
  object-position:center var(--dg-face-y, 35%);
}
.dg-photo-fallback{
  position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:clamp(64px,12vw,140px);font-weight:900;
  color:rgba(255,255,255,.18);background:linear-gradient(160deg,#282229,#1a1519 50%,#3a2f38);
}
/* Over photo: ONLY agent take (My view) — Manrope italic, soft lift (Owner 2026-07-21) */
.dg-photo-caption{
  position:absolute;left:0;right:0;bottom:clamp(18px, 3.5vh, 40px);z-index:4;
  max-height:min(42vh, 360px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:32px clamp(20px, 3vw, 36px) 16px;
  pointer-events:auto;
  background:linear-gradient(to top,
    rgba(14,11,15,.9) 0%,
    rgba(14,11,15,.58) 50%,
    rgba(14,11,15,.12) 84%,
    transparent 100%);
  border:0;box-shadow:none;
}
.dg-photo-caption .dg-cap-block{margin:0}
.dg-photo-caption .dg-cap-lab{display:none} /* no «Отчёт» / labels on photo */
.dg-photo-caption .dg-cap-text,
.dg-photo-caption .dg-cap-block.dg-cap-view .dg-cap-text{
  margin:0 0 0.55em;
  font-family:"Manrope",var(--font-body),system-ui,sans-serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(15px, 1.35vw, 19px);
  line-height:1.55;
  letter-spacing:.01em;
  color:rgba(255,255,255,.94);
  text-shadow:0 1px 12px rgba(0,0,0,.7), 0 0 1px rgba(0,0,0,.85);
}
.dg-photo-caption .dg-cap-text:last-child{margin-bottom:0}
.dg-photo-caption .dg-cap-text strong{
  font-style:normal;font-weight:700;color:#fff;
}
/* Report lives on LEFT only — hide report block on photo */
.dg-photo-caption .dg-cap-report{display:none!important}
/* LEFT — 50%: name · report (main) · free text · send. No question / no A/B/C */
.dg-left{
  position:absolute;top:0;left:0;bottom:0;z-index:3;
  width:50%;min-width:0;max-width:50%;
  display:flex;flex-direction:column;gap:0;
  padding:clamp(22px,3.2vw,40px) clamp(22px,3vw,40px) clamp(18px,2.5vw,28px);
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:linear-gradient(to right,
    #141015 0%,
    #141015 72%,
    rgba(20,16,21,.92) 88%,
    rgba(20,16,21,.45) 96%,
    transparent 100%);
  box-sizing:border-box;
}
/* Main report on left (Owner: larger, clean) */
.dg-report-main{
  flex:1 1 auto;
  min-height:0;
  margin:clamp(16px, 2.5vh, 28px) 0 clamp(18px, 2.5vh, 28px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.dg-report-main .dg-report-text{
  margin:0 0 0.7em;
  font-family:var(--font-display);
  font-weight:500;
  font-size:clamp(17px, 1.55vw, 22px);
  line-height:1.52;
  letter-spacing:-.01em;
  color:rgba(255,255,255,.96);
  max-width:38rem;
}
.dg-report-main .dg-report-text:last-child{margin-bottom:0}
.dg-report-main .dg-report-text strong{font-weight:800;color:#fff}
.dg-report-mob{display:none} /* desktop: report only in left column */
/* Hide question + A/B/C + mood (Owner 2026-07-21) */
.dg-body .dg-q,
.dg-body .dg-mood-row,
.dg-body .dg-opts{display:none!important}
.dg-body{flex:0 0 auto;margin-top:auto}
.dg-below-q{display:flex;flex-direction:column;gap:10px;max-width:36rem}
/* Free text under report on desktop */
.dg-left > .dg-scroll{
  flex:0 0 auto;
  display:block;
  margin-top:auto;
}
.dg-left > .dg-scroll .dg-scroll-pad{display:none}
.dg-left > .dg-scroll .dg-sheet{
  display:block;
  background:transparent;
  padding:0;
  min-height:0;
}
.dg-left > .dg-scroll .dg-cap-mob,
.dg-left > .dg-scroll .dg-report-mob{display:none}
.dg-top{
  flex:0 0 auto;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
}
/* Name/role on photo (mobile); hidden on desktop — .dg-top used instead */
.dg-photo-head{display:none}
.dg-id{min-width:0;flex:1}
.dg-name{
  margin:0;font-family:var(--font-display);font-weight:900;
  font-size:clamp(24px,3.6vw,40px);line-height:1.12;letter-spacing:-.02em;color:#fff;
  word-break:break-word;overflow-wrap:anywhere;
}
.dg-role{
  margin:8px 0 0;font-size:clamp(11px,1.2vw,13px);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.72);
}
.dg-x{
  position:fixed;top:clamp(16px,3vw,28px);right:clamp(16px,3vw,28px);z-index:6;
  flex:0 0 auto;width:44px;height:44px;border:0;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;font-size:28px;line-height:1;
  pointer-events:auto;
}
.dg-x:hover{background:rgba(229,32,44,.9)}
/* Call (phone) — top-right, left of Close × (Owner 2026-07-18) */
.dg-call-btn{
  position:fixed;top:clamp(16px,3vw,28px);z-index:6;
  /* 44px × + 10px gap */
  right:calc(clamp(16px,3vw,28px) + 44px + 10px);
  flex:0 0 auto;width:44px;height:44px;border:0;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;
  box-shadow:0 4px 16px rgba(0,0,0,.25);transition:background .15s,transform .12s;
  pointer-events:auto;
}
.dg-call-btn:hover{background:rgba(229,32,44,.92);transform:scale(1.04)}
.dg-call-btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.dg-call-btn svg{width:22px;height:22px;display:block}
.dg-call-btn.on{background:var(--brand-rot);color:#fff}
/* legacy class kept for any residual refs */
.dg-chat-btn{display:none!important}
/* Floating agent chat window (above Digest) */
#agent-chat-float{
  display:none;position:fixed;inset:0;z-index:1300;
  background:rgba(20,16,21,.55);align-items:center;justify-content:center;
  padding:clamp(12px,3vw,28px);box-sizing:border-box;
}
#agent-chat-float.on{display:flex}
.acf-panel{
  width:min(440px,100%);height:min(86vh,720px);max-height:min(86vh,720px);
  display:flex;flex-direction:column;
  background:var(--paper);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-float);overflow:hidden;
  border:1px solid var(--border-subtle);
}
.acf-head{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:12px 14px;background:var(--paper-raised);
  border-bottom:1px solid var(--border-hairline);
}
.acf-av{
  width:44px;height:44px;border-radius:999px;object-fit:cover;object-position:center top;
  background:var(--paper-sunk);flex:0 0 auto;
}
.acf-av-fb{
  width:44px;height:44px;border-radius:999px;flex:0 0 auto;
  display:grid;place-items:center;font-weight:900;font-size:14px;
  background:var(--brand-schwarz);color:#fff;
}
.acf-meta{min-width:0;flex:1}
.acf-meta h3{
  margin:0;font-family:var(--font-display);font-weight:900;font-size:17px;
  color:var(--fg-1);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.acf-meta p{
  margin:3px 0 0;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--fg-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.acf-x{
  flex:0 0 auto;width:36px;height:36px;border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);background:var(--paper-sunk);color:var(--fg-2);
  font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;
}
.acf-x:hover{background:var(--brand-rot);color:#fff;border-color:var(--brand-rot)}
.acf-ctx{
  flex:0 0 auto;padding:8px 14px;font-size:12px;line-height:1.4;color:var(--fg-2);
  background:rgba(229,32,44,.06);border-bottom:1px solid var(--border-hairline);
}
.acf-ctx b{color:var(--fg-1)}
.acf-panel .chat-wrap{
  flex:1 1 auto;min-height:0;margin:0;border:0;border-radius:0;
  display:flex;flex-direction:column;overflow:hidden;
  /* Neutralize drawer .chat-wrap rules (sticky + 400px cap) so the
     reply row sits flush at the bottom of the float panel */
  position:static;max-height:none;box-shadow:none;
}
/* Log scrolls; open always lands on last message (not top/first) */
.acf-panel .chat-log{
  flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.acf-panel .chat-form{flex:0 0 auto}
.dg-body{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;padding-right:2px}
/* Large question — full line wrap, not clipped */
.dg-q{
  margin:0 0 12px;font-family:var(--font-display);font-weight:900;
  font-size:clamp(20px,2.8vw,30px);line-height:1.2;letter-spacing:-.02em;color:#fff;max-width:36rem;
  word-break:break-word;overflow-wrap:anywhere;
}
.dg-brief{margin:0 0 10px;max-width:36rem}
.dg-brief p{
  margin:0 0 10px;font-size:13.5px;line-height:1.5;font-weight:500;color:rgba(255,255,255,.88);
}
.dg-brief p:last-child{margin-bottom:0}
.dg-brief strong,.dg-q strong,.dg-opinion strong,.dg-opt-detail strong{
  font-weight:800;color:#fff;font-style:normal;
}
.dg-opinion{
  margin:0 0 12px;max-width:36rem;padding:10px 12px;border-left:3px solid var(--brand-gold);
  font-size:13.5px;line-height:1.45;font-weight:500;font-style:normal;color:rgba(255,255,255,.9);
  background:rgba(254,240,4,.06);
}
.dg-opinion > b:first-child{font-style:normal;font-weight:800;color:var(--brand-schwarz-ink);letter-spacing:.04em;text-transform:uppercase; /* a11y: gold text 2.32 → ink; gold stays on the left bar */font-size:11px;display:block;margin-bottom:4px}
/* A/B/C rows: main click = choose/send; square ▾ = accordion task detail (not a choice) */
.dg-opts{display:flex;flex-direction:column;gap:8px;margin:0 0 12px;max-width:36rem;list-style:none;padding:0}
/* Mobile mood row — hidden on desktop (Owner: Pos / Neg / Skip + free text) */
.dg-mood-row{display:none}
.dg-opt-block{display:flex;flex-direction:column;gap:0;border:1px solid rgba(255,255,255,.22);border-radius:var(--radius-md);overflow:hidden;background:rgba(255,255,255,.06)}
.dg-opt-block.open{border-color:rgba(255,255,255,.35)}
.dg-opt-row{display:flex;align-items:stretch;gap:0;min-height:48px}
.dg-opt{
  display:flex;align-items:flex-start;gap:10px;flex:1 1 auto;min-width:0;text-align:left;
  border:0;border-radius:0;background:transparent;color:#fff;padding:11px 12px;cursor:pointer;
  font:inherit;transition:background .15s var(--ease);pointer-events:auto;
}
.dg-opt:hover{background:rgba(255,255,255,.08)}
.dg-opt.on{background:rgba(229,32,44,.28)}
.dg-opt:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-2px}
.dg-opt-k{
  flex:0 0 auto;min-width:26px;font-family:var(--font-display);font-weight:900;
  font-size:18px;color:var(--brand-gold);line-height:1.2; /* a11y: dark deck — gold on scrim 6.5:1, legal */
}
.dg-opt-main{flex:1;min-width:0}
.dg-opt-l{display:block;font-size:14px;line-height:1.35;font-weight:600}
.dg-opt .tag{
  display:inline-block;margin-top:5px;margin-right:6px;padding:2px 8px;border-radius:999px;
  font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
}
.dg-opt .tag-my{background:rgba(255,255,255,.14);color:#fff}
.dg-opt .tag-rec{background:rgba(229,32,44,.45);color:#fff}
/* Square accordion toggle — far right, not a vote */
.dg-acc{
  flex:0 0 44px;width:44px;min-width:44px;border:0;border-left:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.25);color:rgba(255,255,255,.85);cursor:pointer;
  font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
  pointer-events:auto;transition:background .15s var(--ease),color .15s;
}
.dg-acc:hover{background:rgba(255,255,255,.12);color:#fff}
.dg-acc[aria-expanded="true"]{background:rgba(254,240,4,.15);color:var(--brand-gold)}
.dg-acc:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-2px}
.dg-opt-detail{
  display:none;padding:14px 14px 16px;border-top:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.28);font-size:15.5px;line-height:1.55;font-weight:500;
  color:rgba(255,255,255,.9);white-space:pre-wrap;word-break:break-word;
}
.dg-opt-block.open .dg-opt-detail{display:block}
.dg-opt-detail b{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:8px}
.dg-opt-detail strong{font-size:inherit;color:#fff}
.dg-ta{
  width:100%;max-width:36rem;box-sizing:border-box;min-height:64px;resize:vertical;
  border:1px solid rgba(255,255,255,.22);border-radius:var(--radius-md);
  padding:12px 14px;font:14px/1.4 var(--font-body);color:#fff;
  background:rgba(0,0,0,.35);margin-bottom:10px;pointer-events:auto;
}
.dg-ta::placeholder{color:rgba(255,255,255,.45)}
.dg-ta:focus{outline:2px solid rgba(229,32,44,.55);outline-offset:1px}
.dg-foot{
  display:flex;flex-direction:column;align-items:stretch;gap:10px;
  max-width:36rem;margin-top:8px;flex:0 0 auto;
}
.dg-meta{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.dg-actions{display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto;width:100%}
.dg-actions .btn{min-height:48px;flex:1 1 auto}
.dg-send{
  width:100%;min-height:52px !important;font-weight:800;font-size:15px;letter-spacing:.04em;
  text-transform:uppercase;border:0;border-radius:var(--radius-md);cursor:pointer;
  background:var(--brand-rot);color:#fff;pointer-events:auto;
}
.dg-send:hover{filter:brightness(1.06)}
.dg-send:disabled{opacity:.45;cursor:not-allowed;filter:none}
.dg-toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:7;
  padding:10px 14px;border-radius:var(--radius-md);
  background:var(--paper);color:var(--fg-1);font-size:13px;font-weight:700;
  box-shadow:var(--shadow-float);animation:slideIn 200ms var(--ease);
}
@media (max-width:820px){
  /*
   * Mobile (Owner 2026-07-21):
   *  - photo + name FIXED full-screen (soft name on photo)
   *  - scroll ONLY the text sheet (starts at lower ~40% of photo)
   *  - sheet order: Отчёт (facts) → Мой взгляд (opinion, italic, bottom) → free text
   *  - same opinion law as desktop right-bottom; no Q / A/B/C parade
   */
  #digest-modal,#digest-modal.on{
    width:100%;max-width:100vw;
    height:100%;height:100dvh;
    overflow:hidden;
  }
  .dg-stage{
    position:absolute;inset:0;
    width:100%;max-width:100vw;
    height:100%;height:100dvh;
    overflow:hidden;
  }
  /* fixed full-bleed portrait — face still upper 40% */
  .dg-right{
    position:absolute;inset:0;
    width:100%;height:100%;max-width:100%;
    z-index:1;pointer-events:none;
    background:#1a1519;
  }
  .dg-photo-wrap{
    position:absolute;inset:0;
    min-height:0;height:100%;
    pointer-events:none;
  }
  /* full-bleed cover on mobile — same faceY map via inline style */
  .dg-photo{
    inset:0;width:100%;height:100%;
    object-fit:cover;
    pointer-events:none;
  }
  .dg-photo-fade{pointer-events:none}
  .dg-top{display:none}
  .dg-left > .dg-report-main{display:none} /* report inside sheet on mobile */
  .dg-cap-desk{display:none!important}
  .dg-cap-mob{display:block}
  .dg-report-mob{
    display:block;
    margin:0 0 16px;
    order:1;
  }
  .dg-report-mob .dg-report-text{
    font-size:clamp(16px, 4.2vw, 19px);
    line-height:1.5;
    margin:0 0 0.65em;
  }
  .dg-report-mob .dg-report-text:last-child{margin-bottom:0}
  .dg-cap-mob{
    order:2;
  }
  .dg-cap-mob .dg-cap-text{
    font-family:"Manrope",var(--font-body),system-ui,sans-serif;
    font-style:italic;
    font-weight:500;
    display:block;
    margin:0 0 0.55em;
  }
  .dg-cap-mob .dg-cap-text:last-child{margin-bottom:0}
  .dg-sheet .dg-body{order:3}
  /* soft name fixed on photo */
  .dg-photo-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    position:absolute;left:0;right:0;top:0;z-index:6;
    padding:max(12px, env(safe-area-inset-top)) 52px 40px 14px;
    pointer-events:auto;
    background:linear-gradient(to bottom,
      rgba(14,11,15,.72) 0%,
      rgba(14,11,15,.38) 42%,
      rgba(14,11,15,.08) 72%,
      transparent 100%);
  }
  .dg-photo-head .dg-name{
    font-size:clamp(20px,5.8vw,28px);
    text-shadow:0 1px 12px rgba(0,0,0,.75), 0 0 1px rgba(0,0,0,.9);
  }
  .dg-photo-head .dg-role{
    margin-top:4px;font-size:10.5px;
    color:rgba(255,255,255,.82);
    text-shadow:0 1px 8px rgba(0,0,0,.7);
  }
  .dg-call-btn{
    top:max(10px, env(safe-area-inset-top));
    right:calc(10px + 44px + 8px);
    width:42px;height:42px;
    background:rgba(255,255,255,.18);
    z-index:8;
  }
  /* text scrolls over fixed photo; pad = upper 60% empty */
  .dg-left{
    position:absolute;inset:0;z-index:4;
    width:100%;max-width:100vw;
    height:100%;
    background:transparent;
    overflow:hidden;
    padding:0;
    top:0;left:0;right:0;bottom:0;
  }
  .dg-scroll{
    display:block;
    position:absolute;inset:0;
    overflow-x:hidden;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    touch-action:pan-y;
  }
  .dg-scroll-pad{
    display:block;
    height:60vh;height:60dvh;
    flex-shrink:0;
    pointer-events:none;
  }
  .dg-sheet{
    display:flex;flex-direction:column;
    position:relative;
    min-height:40vh;min-height:40dvh;
    padding:14px 16px max(28px, env(safe-area-inset-bottom));
    box-sizing:border-box;
    /* soft lift on lower 40% of portrait — not a solid black bar */
    background:linear-gradient(to bottom,
      transparent 0%,
      rgba(14,11,15,.55) 8%,
      rgba(14,11,15,.88) 22%,
      #141015 42%,
      #141015 100%);
  }
  .dg-cap-mob{
    position:relative;left:auto;right:auto;bottom:auto;
    max-height:none;overflow:visible;
    padding:12px 0 16px;margin:0 0 8px;
    background:transparent;border:0;box-shadow:none;
    pointer-events:auto;
    border-top:1px solid rgba(254,240,4,.22);
  }
  .dg-cap-mob .dg-cap-lab{display:none}
  .dg-cap-mob .dg-cap-text{
    font-size:16.5px;line-height:1.5;
    color:rgba(255,255,255,.96);
    text-shadow:0 1px 8px rgba(0,0,0,.55);
  }
  .dg-cap-mob .dg-cap-block.dg-cap-view .dg-cap-text{
    font-size:16px;line-height:1.52;
  }
  .dg-cap-mob .dg-cap-block{margin:0}
  .dg-body{
    position:relative;
    padding:4px 0 0;
    background:transparent;
  }
  .dg-q{
    font-size:clamp(17px,5.2vw,24px);
    margin:10px 0 12px;
    padding-top:4px;
  }
  .dg-below-q{
    padding:0 0 8px;
  }
  /* After question: three buttons one line + free text as 4th path */
  .dg-opts{display:none !important}
  .dg-mood-row{
    display:flex;flex-direction:row;align-items:stretch;gap:8px;
    margin:0 0 12px;width:100%;max-width:100%;
  }
  .dg-mood{
    flex:1 1 0;min-width:0;min-height:48px;
    border:1px solid rgba(255,255,255,.28);border-radius:12px;
    background:rgba(255,255,255,.1);color:#fff;
    font-family:var(--font-body);font-size:13px;font-weight:700;line-height:1.2;
    padding:10px 6px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .dg-mood:active{transform:scale(.98)}
  .dg-mood-pos{background:rgba(46,160,67,.28);border-color:rgba(80,200,100,.45)}
  .dg-mood-neg{background:rgba(229,32,44,.28);border-color:rgba(255,100,100,.4)}
  .dg-mood-skip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);font-weight:600;opacity:.92}
  .dg-ta{min-height:72px;font-size:16px} /* 16px avoids iOS zoom */
  .dg-photo-fade{
    /* mobile: keep portrait readable under fixed name/sheet */
    background:
      linear-gradient(to bottom,
        rgba(20,16,21,.18) 0%,
        transparent 14%,
        transparent 58%,
        rgba(20,16,21,.12) 100%);
  }
  .dg-x{
    top:max(10px, env(safe-area-inset-top));
    right:10px;
    background:rgba(255,255,255,.18);
    z-index:8;
  }
}

/* Agent report to Owner */
.owner-snap{
  background:var(--paper-raised);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);
  padding:14px;margin-bottom:14px;box-shadow:var(--shadow-card);
}
.owner-snap .job{
  font-size:14px;line-height:1.45;color:var(--fg-1);margin:0 0 10px;font-weight:600;
