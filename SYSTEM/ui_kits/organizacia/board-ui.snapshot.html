<script>
const $ = q => document.querySelector(q);

/* ========== i18n (RU primary at /; EN at /en; /ru legacy alias; names & roles never translated) ========== */
function detectLocale(){
  if (window.DASORG_LOCALE === 'ru' || window.DASORG_LOCALE === 'en') return window.DASORG_LOCALE;
  const p = location.pathname || '/';
  if (p === '/en' || p.startsWith('/en/') || p.startsWith('/en?')) return 'en';
  return 'ru';
}
let LOCALE = detectLocale();
function t(key, vars){
  const pack = (window.DASORG_I18N && window.DASORG_I18N.catalog) || {};
  const loc = LOCALE === 'ru' ? 'ru' : 'en';
  let s = (pack[loc] && pack[loc][key]) || (pack.en && pack.en[key]) || key;
  if (vars && typeof vars === 'object') {
    for (const [k, v] of Object.entries(vars)) s = s.split('{' + k + '}').join(String(v));
  }
  return s;
}
function localePath(path){
  // Bare path without /en or /ru prefix
  let bare = path || '/';
  if (bare === '/en' || bare === '/ru' || bare === '/en/' || bare === '/ru/') bare = '/';
  else if (bare.startsWith('/en/')) bare = bare.slice(3) || '/';
  else if (bare.startsWith('/ru/')) bare = bare.slice(3) || '/';
  if (LOCALE === 'en') {
    if (!bare || bare === '/') return '/en';
    return '/en' + (bare.startsWith('/') ? bare : '/' + bare);
  }
  // RU primary shell is root /
  return bare.startsWith('/') ? bare : '/' + bare;
}
function switchLocale(to){
  const dest = to === 'en' ? '/en' : '/';
  location.href = dest + (location.search || '') + (location.hash || '');
}
const normalizeKey = k => (k||'').trim().replace(/^Bearer\s+/i,'').trim().replace(/^["']|["']$/g,'');
let KEY = normalizeKey(localStorage.getItem('dasorg_key')||'');
let view = 'board'; const chatHist={}; let chatBusy=false, agents = [], cur = null;

function statusLabel(st){
  const m = {
    due: 'status.due',
    in_progress: 'status.in_progress',
    done: 'status.done',
    missed: 'status.missed',
    blocked: 'status.blocked'
  };
  return t(m[st] || 'status.not_done');
}
const STATUS = new Proxy({}, {
  get(_t, prop){
    if (prop === 'due' || prop === 'in_progress' || prop === 'done' || prop === 'missed' || prop === 'blocked') {
      return statusLabel(prop);
    }
    return undefined;
  }
});

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2400);
}

async function api(p, o={}){
  // Open board: no API key required for now
  const headers = {
    'content-type': 'application/json',
    ...(o.headers||{})
  };
  if (KEY) headers['authorization'] = 'Bearer ' + KEY;
  const { signal, ...rest } = o;
  const r = await fetch('/api'+p, { ...rest, headers, signal });
  if (r.status === 401){
    // Only if server re-enables DASORG_REQUIRE_KEY=1
    KEY = '';
    localStorage.removeItem('dasorg_key');
    sessionStorage.setItem('dasorg_err', 'API key required (DASORG_REQUIRE_KEY=1). Paste key from SECRETS/dasorg.md.');
    render();
    throw new Error('unauthorized'); // non-Error throw broke e.message consumers
  }
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); } catch {
    throw new Error(r.ok ? 'Bad JSON from API' : ('HTTP '+r.status+': '+text.slice(0,120)));
  }
  if (!r.ok && data && data.error) {
    const err = new Error(data.error + (data.detail ? (': '+data.detail) : ''));
    err.data = data;
    throw err;
  }
  return data;
}

function setKey(){
  KEY = normalizeKey(document.getElementById('k').value);
  if (!KEY || KEY.length < 32){
    sessionStorage.setItem('dasorg_err', 'Key is too short. Copy the full Key value from SECRETS/dasorg.md (64 hex characters).');
    render();
    return;
  }
  localStorage.setItem('dasorg_key', KEY);
  sessionStorage.removeItem('dasorg_err');
  render();
}

function logout(){
  KEY = '';
  localStorage.removeItem('dasorg_key');
  sessionStorage.removeItem('dasorg_err');
  render();
}

function go(v){ view = v; render(); }

function render(){
  // Open access: no login screen
  sessionStorage.removeItem('dasorg_err');
  LOCALE = detectLocale();
  document.documentElement.lang = LOCALE === 'ru' ? 'ru' : 'en';

  const langBtn = LOCALE === 'ru'
    ? `<button class="btn btn-ghost" type="button" onclick="switchLocale('en')" title="${esc(t('btn.lang.en.title'))}">${esc(t('btn.lang'))}</button>`
    : `<button class="btn btn-ghost" type="button" onclick="switchLocale('ru')" title="${esc(t('btn.lang.title'))}">${esc(t('btn.lang'))}</button>`;

  $('#app').innerHTML = `
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <h1>DASORG</h1>
          <div class="sub">${esc(t('brand.sub'))}</div>
        </div>
        <nav class="tabs">
          <button class="tab ${view==='board'?'on':''}" onclick="go('board')">${esc(t('nav.board'))}</button>
          <button class="tab ${view==='kpi'?'on':''}" onclick="go('kpi')">${esc(t('nav.kpi'))}</button>
        </nav>
        <div class="actions">
          <button type="button" class="btn-digest" id="btn-open-digest" onclick="openDigestDeck()"
            title="${esc(t('btn.digest.title') === 'btn.digest.title' ? 'Quick interview — one agent per slide' : t('btn.digest.title'))}">
            Digest<span class="btn-digest-ru">· Дайджест</span>
          </button>
          <button class="btn btn-dark" onclick="openSeminar()" title="${esc(t('btn.seminar.title'))}">${esc(t('btn.seminar'))}</button>
          ${langBtn}
          ${KEY ? `<button class="btn btn-ghost" onclick="logout()">${esc(t('btn.logout'))}</button>` : ``}
        </div>
      </div>
    </header>
    <main id="body"><p class="sec">${esc(t('status.loading'))}</p></main>
    <div class="drawer" id="dr" onclick="if(event.target.id==='dr')closeDr()">
      <div class="panel" id="panel"></div>
    </div>
    <div class="sw-backdrop" id="sw" onclick="if(event.target.id==='sw')closeStatusWidget()" role="dialog" aria-modal="true" aria-labelledby="sw-title"></div>
    <div class="sw-backdrop" id="sem-modal" role="dialog" aria-modal="true"></div>
    <div id="digest-modal" role="dialog" aria-modal="true" aria-label="${esc(t('btn.digest'))}"></div>
    <div id="agent-chat-float" role="dialog" aria-modal="true" aria-label="${esc(t('chat.aria'))}"
      onclick="if(event.target.id==='agent-chat-float')closeAgentChatWindow()"></div>`;

  if (view === 'board') loadBoard().catch(e => showLoadError(e));
  else loadKpi().catch(e => showLoadError(e));
}

/** API/network failure must not leave the board on an eternal "Loading…" */
function showLoadError(e){
  const app = document.getElementById('app');
  if (!app) return;
  const ru = LOCALE === 'ru';
  const msg = ru ? 'Не удалось загрузить данные борда.' : 'Could not load board data.';

  app.innerHTML = `
    <div style="max-width:420px;margin:60px auto;text-align:center">
      <div style="font-weight:700;margin-bottom:6px">${msg}</div>

}

/** Status bucket keys for pulse filters / widget — labels via t() at use sites */
const STATUS_BUCKETS = {

  const a = (agents||[]).find(x => x.slug === slug);

/** Concrete Owner ask for comic bubble (specific, no generic OK) (null = no bubble). */
function ownerAskTwoWords(runsForAgent, slug){
  // Bubble: 2–3 words = THIS agent's real work/problem. Prefer blocked/missed. No "due list" jargon.
  const open = (runsForAgent || []).filter(r =>
    r.status === 'blocked' || r.status === 'missed' || r.status === 'due' || r.status === 'in_progress'
  );
  if (!open.length) return null;
  // Prefer PROBLEM tasks for the bubble (what Boss cares about)
  const problems = open.filter(r => r.status === 'blocked' || r.status === 'missed');
  const active = open.filter(r => r.status === 'in_progress');
  const order = { blocked:0, missed:1, in_progress:2, due:3 };
  const pool = problems.length ? problems : (active.length ? active : open);
  pool.sort((a,b) => (order[a.status]??9)-(order[b.status]??9) || String(a.task_id||'').localeCompare(String(b.task_id||'')));
  const top = pool[0];
  // Report slots are not work for the Boss bubble — Digest *is* the brief.
  let pick = top;
  if (isReportOnlyTaskClient(top)) {
    pick = open.find(r => !isReportOnlyTaskClient(r)) || null;
  }
  if (!pick) return null;
  return fewWordsForBubble(pick, slug || '');
}

function normalizeTaskId(taskId){
  const u = String(taskId || '').toUpperCase().trim();

}

    Z1: 'Stock health', Z2: 'Shipments', Z3: 'Supply SLA', Z4: 'Landed cost', Z5: '3PL score', Z6: 'HS codes',

    G1: 'Morning report', G2: 'GEO deep-read', G3: 'GEO map', G4: 'AI crawlers', G5: 'Entity pack', G6: 'GEO roll-up',
    JW1: 'Site triage', JW2: 'SERP pulse', JW3: 'On-page brief', JW4: 'Tech SEO log', JW5: 'Issue queue', JW6: 'SEO roll-up',
  };
  if (LOCALE === 'ru') {
    const askRu = window.DASORG_TASK_COPY?.askWordsRu || window.DASORG_I18N?.taskCopy?.askWordsRu || {};
    if (askRu[id]) return clampBubbleWords(askRu[id]);
  }
  if (byId[id]) return clampBubbleWords(byId[id]);

  // Role + top-run only (never other agents' notes)
  const topLow = (title + ' ' + String(r.note||'') + ' ' + id).toLowerCase();
  const roleOnly = {
    'justina-timber': [[/purchase|conversion|ads goal/i,'Ads purchase'],[/budget|j7|feasib|spend/i,'Budget J7'],[/matrix|price/i,'Price matrix']],
    'roberta-di-maria': [[/\bxa\b|external|citation/i,'Off-site'],[/blog|seo/i,'SEO blog'],[/send|emailer/i,'Send copy']],
    'lauda-briana': [[/lead|b2b|hunt|distributor/i,'B2B leads'],[/deck/i,'Buyer deck'],[/send|emailer/i,'Send copy'],[/pipeline/i,'Pipeline']],
    'lena-sergeeva': [[/brief/i,'Daily brief'],[/due/i,'Open problems'],[/seminar/i,'Seminar']],
    'alexandra-obnorskaya': [[/fbo|cover/i,'FBO cover'],[/review/i,'Reviews'],[/listing/i,'Listings']],
    'marika-nowicka': [[/creative|batch/i,'Creatives'],[/pack|photo|shot/i,'Pack shots'],[/brand/i,'Brand work']],
    'valentina-korolyeva': [[/sign|contract/i,'You sign'],[/dd|diligence/i,'Due diligence']],
    'mina-rutunya': [[/token|oauth/i,'Token rotate'],[/deploy/i,'Deploy'],[/health|worker/i,'Workers up']],
    'zina-pevtsova': [[/stock|cover/i,'Stock health'],[/ship/i,'Shipments']],
    'maya-krasochkina': [[/claim/i,'Claims audit'],[/formula/i,'Formula gate'],[/intel|research/i,'Intel sweep']],
    'julian-farah': [[/morning|report|finding|digest/i,'Morning report'],[/telegram|news|uber/i,'GEO research'],[/crawler|bot/i,'AI crawlers'],[/entity|answer/i,'Entity pack']],
    'jurgen-witt': [[/site|404|broken|webmaster|triage/i,'Site triage'],[/serp|keyword|rank/i,'SERP pulse'],[/on-page|meta|title/i,'On-page brief'],[/schema|index|crawl|tech/i,'Tech SEO log']],
  };
  for (const [re, lab] of (roleOnly[slug] || [])) {
    if (re.test(topLow)) return clampBubbleWords(lab);
  }

  // Distill title: max 3 words
  let raw = title.replace(/^[A-Z]{1,3}\d+\s*[—–:-]\s*/,'').replace(/\s+/g,' ').trim();
  if (!raw) raw = defaults[slug] || 'Open work';
  const stop = new Set(['the','a','an','of','to','for','and','or','on','in','at','this','that','every','from','with','one','our','her','his','is','are','be','as','when','before','after','only']);
  let words = raw.split(/\s+/).filter(w => {
    const k = w.toLowerCase().replace(/[^a-z0-9]/g,'');
    return k && !stop.has(k) && !['purchase','goal','goals','only'].includes(k);
  }).slice(0, 3);
  let label = words.map(w => w.replace(/[^a-zA-Z0-9/-]/g,'')).filter(Boolean).join(' ');
  if (!label || /^purchase/i.test(label)) label = defaults[slug] || 'Open work';
  return clampBubbleWords(label);
}

function clampBubbleWords(s){
  let w = String(s||'').trim().split(/\s+/).filter(Boolean);
  if (w.length > 3) w = w.slice(0, 3);
  let out = w.join(' ');
  if (out.length > 22) out = w.slice(0, 2).join(' ');
  // never the collapsed generic
  if (/^purchase\s*goal$/i.test(out)) out = 'Open work';
  return out;
}

/** After all cards computed — force unique bubble text across the board */
function uniquifyOwnerAsks(list){
  const used = new Map(); // lower -> count
  return list.map(a => {
    let ask = a.ownerAsk;
    if (!ask) return a;
    const base = ask;
    let key = ask.toLowerCase();
    let n = used.get(key) || 0;
    if (n > 0) {
      // disambiguate with agent first name — still short
      const fn = (a.name || a.slug || '?').split(/[\s-]/)[0];
      const short = fn.slice(0, 6);
      ask = clampBubbleWords(base.split(/\s+/).slice(0, 2).join(' ') + ' ' + short);
      key = ask.toLowerCase();
      let k = 2;
      while (used.has(key) && k < 5) {
        ask = clampBubbleWords(base.split(/\s+/).slice(0, 1).join(' ') + ' ' + short + k);
        key = ask.toLowerCase();
        k++;
      }
    }
    used.set(key, (used.get(key) || 0) + 1);
    return { ...a, ownerAsk: ask };
  });
}

/**
 * Ready result for card ! button: artifact / KPI / solid finished note.
 * Not a bare "Digest Boss POS" stamp — that is not a deliverable.
 */
function agentReadyResult(runs){
  const list = Array.isArray(runs) ? runs : [];
  const scored = list
    .map(r => {
      const art = String(r.artifact || '').trim();
      const kpi = String(r.kpi_value || '').trim();
      const note = String(r.note || '').trim();
      const pct = Math.max(0, Math.min(100, +r.percent || 0));
      let score = 0;
      if (art.length > 8) score += 100;
      if (kpi) score += 40;
      if ((r.status === 'done' || pct >= 80) && note.length > 80 && !/^Digest Boss/i.test(note)) score += 50;
      if (r.status === 'done' && (art || kpi)) score += 20;
      return { r, score };
    })
    .filter(x => x.score >= 40)
    .sort((a, b) => b.score - a.score || (b.r.id || 0) - (a.r.id || 0));
  return scored[0] ? scored[0].r : null;
}

  t = t.replace(/\bHTTP\s*40[0-9]\b/gi, ru ? 'страница не найдена / нет доступа' : 'page missing / no access');
  t = t.replace(/\bHTTP\s*50[0-9]\b/gi, ru ? 'сервер сайта сбоит' : 'site server error');
  t = t.replace(/\bHTTP\s*\d{3}\b/gi, ru ? 'нестандартный ответ сайта' : 'unusual site response');

  t = t.replace(/\btick\b/gi, ru ? 'этот проход' : 'this pass');
  t = t.replace(/\bproduct-skill\b/gi, ru ? 'карточка товара' : 'product card');
  t = t.replace(/\borg-board\b/gi, ru ? 'доска организации' : 'org board');

  t = t.replace(/\borganizacia-workers-dev\b/gi, ru ? 'служебный канал доски' : 'board side channel');

function humanizeResultReport(raw, run){
  const ru = LOCALE === 'ru';

  // Already director-language: keep ALL business numbers, only light tech strip
  if (looksBossHumanRu(t0) && !/###\s*Moved|###\s*Blocked|ONE Owner decision/i.test(t0)
      && !/\bLive check\b|\bLife check\b|\bHTTP\s*\d{3}\b/i.test(t0)) {
    return stripTechJunkLight(t0, ru);
  }

  // Owner brief sections → human headings
  if (/###\s*Moved|###\s*Blocked|###\s*Overdue|###\s*Fleet|ONE Owner decision|Hard gates/i.test(t0)
      || /Owner brief|Due-today list/i.test(t0)) {
    return humanizeOwnerBriefArtifact(t0, run);

  // XA / site awareness — rewrite only true tech dumps
  if (/\bLive check\b|Target site|Draft-only outreach|External awareness|title="|bytes=\d|xa_draft/i.test(t0)
      || ((run && String(run.task_id || '').toUpperCase() === 'XA') && !looksBossHumanRu(t0))) {
    return humanizeXaArtifact(t0, run);
  }
  if (run && String(run.task_id || '').toUpperCase() === 'XA' && looksBossHumanRu(t0)) {
    return stripTechJunkLight(t0, ru);
  }

  // N1 health — rewrite only classic dumps; keep numbered human notes
  if (/\bN1 health\b|critical down|probing worker|\bLife check\b/i.test(t0)
      || ((run && String(run.task_id || '').toUpperCase() === 'N1') && !looksBossHumanRu(t0))) {
    return humanizeN1Artifact(t0, run);
  }
  if (run && String(run.task_id || '').toUpperCase() === 'N1' && looksBossHumanRu(t0)) {
    return stripTechJunkLight(t0, ru);
  }

  return stripTechJunkLight(t0, ru);
}

  const lines = [];

    || text.match(/ответ\s*~?\s*(\d+)\s*мс/i)

    || text.match(/Заголовок страницы:\s*[«"]([^»"]+)[»"]/i)

    if (bytes) {
      const kb = bytesIsKb ? Number(bytes) : Math.round(Number(bytes) / 1024);
      if (kb > 0) lines.push('Размер страницы примерно ' + kb + ' КБ.');
    }
    lines.push('');
    lines.push('Черновые углы для упоминаний снаружи (ещё не отправлено):');
    lines.push('1) Экспертный гостевой материал: микробиом + ферментный уход (без пустых «немецкий бренд»).');
    lines.push('2) Ссылка только на научную страницу / конкретный механизм SKU (только то, что есть в карточке товара).');
    lines.push('3) Партнёрские каталоги / ассоциации — белые упоминания, без покупки ссылок.');
    lines.push('4) Микро-UGC: бартер-образец, одна клиническая фраза + бриф на фото.');
    lines.push('');
    lines.push('Вопрос к вам: какой из углов 1–4 берём в работу первым? Отправка писем — только после вашего «да».');
  } else {
    lines.push('External awareness check (draft only — nothing emailed).');
    lines.push('');
    lines.push('Site: ' + site);
    if (httpOk) lines.push('Site is up' + (ms ? ' (~' + ms + ' ms).' : '.'));
    else if (httpBad) lines.push('Site is hard to open — business risk for customers and search.');
    if (title) lines.push('Page title: “' + title.trim().slice(0, 120) + '”.');
    lines.push('');
    lines.push('Draft angles (not sent). Which of 1–4 do you want first? Email only after your yes.');
  }
  return lines.join('\n');
}

/** N1 system health → plain ops for Boss; keep per-service ms numbers. */
function humanizeN1Artifact(raw, run){
  const ru = LOCALE === 'ru';
  const text = String(raw || '');
  // Keep already-human notes with numbers (do not flatten to one sentence)
  if (looksBossHumanRu(text) && !/\bN1 health\b|\bLife check\b|workers\.dev|probing worker/i.test(text)) {
    return stripTechJunkLight(text, ru);
  }
  const blocked = /BLOCKED|critical down|не отвечает|критично/i.test(text)
    && !/Основное \(доска|всё основное отвечает|Основное \(доска \/ сайт\) отвечает/i.test(text);
  // Try to harvest ms numbers from tech dumps
  const msHits = [...text.matchAll(/(?:org-board|marketing-site|доска|сайт|board|site)[^\n]{0,40}?(\d+)\s*ms/gi)];
  const msList = msHits.map(m => m[1]).filter(Boolean);
  if (ru) {
    if (blocked) {
      let out = 'Проверка ключевых сервисов: есть критический сбой — сайт или доска могут быть недоступны.';
      if (msList.length) out += '\nОжидание ответа: ' + msList.map(x => '~' + x + ' мс').join(', ') + '.';
      out += '\n\nНужен разбор у Мины. Это техника, не «лень команды».';
      return out;
    }
    const ok = /N1 health OK|health OK|отвечает|ок/i.test(text);
    if (ok || msList.length || text.length > 20) {
      let out = 'Проверка ключевых сервисов: всё основное отвечает.';
      if (msList.length) {
        out += '\nВремя ответа: ' + msList.slice(0, 4).map(x => '~' + x + ' мс').join(', ') + '.';
      }
      out += '\n\nМелкие вспомогательные каналы могли не ответить — на бизнес обычно не влияет, пока доска и сайт живы.';
      out += '\n\nВопрос к вам: если у пользователей что-то «тупит» — напишите Мине; иначе можно не трогать.';
      return out;
    }
    return 'Проверка сервисов прошла. Если сайт или доска «тупят» — скажите Мине.';
  }
  if (blocked) return 'Critical services check failed — site or board may be down. Mina must dig in.';
  return 'Core services respond' + (msList.length ? ' (~' + msList.join(', ') + ' ms)' : '') + '. Soft side channels may lag without stopping the business.';
}

  };
  const humanTask = (line) => {
    let s = String(line || '').replace(/^\s*-\s*/, '').trim();
    if (!s || /^\(none\)$/i.test(s)) return '';
    s = s.replace(/\s*\[(due|blocked|missed|in_progress|done)\]\s*$/i, '');
    // lena-sergeeva A5 #53 due 2026-07-01 "Priority reconciliation"
    const m = s.match(
      /([a-z][a-z0-9-]*)\s+([A-Z]{1,3}\d{0,2})\s+#?\d*\s*(?:due\s+[\d-]+)?\s*[“"«]?([^”"»\[]*)/i
    );
    if (m) {
      const who = nameOf(m[1]);
      const code = String(m[2] || '').toUpperCase();
      const title = String(m[3] || '').replace(/[“"»]/g, '').trim();
      const nice = taskWords[code] || title || code;
      return `• ${who}: ${nice}`;
    }
    s = s.replace(/[a-z][a-z0-9-]*\s+[A-Z]+\d{0,2}\s+#\d+/gi, '').replace(/#\d+/g, '').trim();
    return s ? '• ' + s : '';
  };

  const section = (re) => {
    const m = text.match(re);
    return m ? m[1] : '';
  };
  const moved = section(/###\s*Moved[\s\S]*?\n([\s\S]*?)(?=\n###|\n*$)/i);
  const blocked = section(/###\s*Blocked[\s\S]*?\n([\s\S]*?)(?=\n###|\n*$)/i);
  const overdue = section(/###\s*Overdue[\s\S]*?\n([\s\S]*?)(?=\n###|\n*$)/i);
  const fleet = section(/###\s*Fleet[\s\S]*?\n([\s\S]*?)(?=\n###|\n*$)/i);
  const one = section(/###\s*ONE Owner decision\s*\n([\s\S]*?)(?=\n###|Hard gates|\n*$)/i)
    || section(/ONE Owner decision\s*\n?([\s\S]*?)(?=\nHard gates|\n*$)/i);

  const lines = [];
  if (ru) {
    lines.push('Краткий утренний обзор команды (для вас).');
    lines.push('');
    const movedLines = (moved || '').split('\n').map(humanTask).filter(Boolean);
    lines.push(movedLines.length
      ? 'Сделано за сутки:\n' + movedLines.join('\n')
      : 'Сделано за сутки: заметных закрытий в списке нет.');
    lines.push('');
    const bl = (blocked || '').trim();
    if (!bl || /\(none\)/i.test(bl)) lines.push('Сейчас ничто не стоит в жёстком блоке.');
    else lines.push('В блоке:\n' + bl.split('\n').map(humanTask).filter(Boolean).join('\n'));
    lines.push('');
    const od = (overdue || '').split('\n').map(humanTask).filter(Boolean);
    if (od.length) {
      lines.push('Просрочено (ещё открыто) — на это стоит смотреть:\n' + od.slice(0, 8).join('\n'));
      if (od.length > 8) lines.push('…и ещё ' + (od.length - 8) + ' позиций.');
    } else lines.push('Просроченных открытых задач в списке нет.');
    lines.push('');
    // Fleet: only human summary
    if (/FAIL|HTTP|404|500/i.test(fleet || '')) {
      lines.push('Автораздача работы части команды сегодня сбойнула (связь с сервисом). Это не про людей — про технический запуск. Мина / поддержка должны поправить.');
    } else if (/skipped/i.test(fleet || '')) {
      lines.push('Автозапуск «по списку дел» сегодня почти никого не дернул — либо дел в очереди нет, либо слоты пустые. Это нормально, если приоритеты вы уже задали вручную.');
    }
    lines.push('');
    if (one && one.trim() && !/\(none\)/i.test(one)) {
      let dec = one.trim()
        .replace(/Priority call:\s*/i, '')
        .replace(/[a-z-]+\s+([A-Z]+\d?)\s+#\d+\s*/i, (_, c) => (taskWords[c] ? taskWords[c] + ' — ' : ''))
        .replace(/[“"]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      lines.push('Одно решение, которое ждут от вас:\n' + dec);
    } else {
      lines.push('Отдельного «одного решения» в этом брифе нет — можно читать обзор и идти дальше.');
    }
    lines.push('');
    lines.push('Деньги, юрподписи и массовая рассылка писем сами по себе не запускаются — только с вашего явного «да».');
  } else {
    lines.push('Short morning team overview for you.');
    lines.push('');
    const movedLines = (moved || '').split('\n').map(humanTask).filter(Boolean);
    lines.push(movedLines.length ? 'Done in the last day:\n' + movedLines.join('\n') : 'Done in the last day: nothing major listed.');
    lines.push('');
    const bl = (blocked || '').trim();
    lines.push(!bl || /\(none\)/i.test(bl) ? 'Nothing hard-blocked right now.' : 'Blocked:\n' + bl.split('\n').map(humanTask).filter(Boolean).join('\n'));
    lines.push('');
    const od = (overdue || '').split('\n').map(humanTask).filter(Boolean);
    lines.push(od.length ? 'Overdue (still open):\n' + od.slice(0, 8).join('\n') : 'No overdue open items listed.');
    lines.push('');
    if (/FAIL|HTTP|404|500/i.test(fleet || '')) {
      lines.push('Automated work dispatch hit a connection problem for part of the team — tech side, not people. Needs a fix.');
    }
    if (one && one.trim() && !/\(none\)/i.test(one)) {
      lines.push('One decision they need from you:\n' + one.replace(/Priority call:\s*/i, '').replace(/#\d+/g, '').trim());
    }
    lines.push('Money, legal sign-off, and mass email do not auto-fire without your clear yes.');
  }
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function humanStatusLabel(st){
  const s = String(st || '').toLowerCase();
  if (LOCALE === 'ru') {
    if (s === 'done') return 'готово';
    if (s === 'in_progress') return 'в работе';
    if (s === 'blocked') return 'блок';
    if (s === 'missed') return 'просрочка';
    if (s === 'due') return 'к старту';
    return s || '—';
  }
  return s || '—';
}

function showResultPopup(slug, run){
  const el = ensureResultPop();
  if (!run) {
    el.classList.add('on');
    el.innerHTML = `<div class="result-pop-panel" onclick="event.stopPropagation()">
      <h3>${esc(t('card.result_ready'))}</h3>
      <p class="rp-meta">${esc(agentNameFromSlug(slug) || slug || '')}</p>
      <div class="rp-body">${esc(t('card.result_empty'))}</div>
      <div class="rp-actions">
        <button type="button" class="btn btn-dark" onclick="closeResultPop()">${esc(t('btn.close'))}</button>
      </div>
    </div>`;
    return;
  }
  const who = agentNameFromSlug(slug) || slug;
  const titleHuman = (() => {
    try {
      const b = getTaskBrief(run.task_id);
      if (b && b.what) return b.what;
    } catch (_) { /* */ }
    return casualWork(run.title, run.task_id) || run.title || t('card.result_ready');
  })();
  // Prefer human note body over internal URI "artifact"
  const art = String(run.artifact || '').trim();
  const note = String(run.note || '').trim();
  const kpi = String(run.kpi_value || '').trim();
  const artIsUri = /^[a-z0-9_.-]+?:\/\//i.test(art) && art.length < 160;
  const rawParts = [];
  if (note && !/^Digest Boss/i.test(note)) rawParts.push(note);
  else if (art && !artIsUri) rawParts.push(art);
  else if (kpi && kpi.length > 24 && !/^[a-z0-9_]+$/i.test(kpi)) rawParts.push(kpi);
  // If only URI artifact, still try note; humanizer drops bare URI
  if (!rawParts.length && art) rawParts.push(art);
  let body = humanizeResultReport(rawParts.join('\n\n'), run);
  if (!body || body.length < 12) body = t('card.result_empty');
  const metaLine = `${who} · ${humanStatusLabel(run.status)}`;
  el.classList.add('on');
  el.innerHTML = `<div class="result-pop-panel" onclick="event.stopPropagation()">
    <h3>${esc(titleHuman)}</h3>
    <p class="rp-meta">${esc(metaLine)}</p>
    <div class="rp-body">${esc(body)}</div>
    <div class="rp-actions">
      <button type="button" class="btn btn-primary" onclick="closeResultPop();openAgent('${esc(slug)}',{focusRunId:${Number(run.id)||0}})">${esc(t('card.result_open_agent'))}</button>
      <button type="button" class="btn btn-dark" onclick="closeResultPop()">${esc(t('btn.close'))}</button>
    </div>
  </div>`;
}

async function openStatusWidget(key){
  const bucket = STATUS_BUCKETS[key];
  if (!bucket) return;
  statusWidgetKey = key;
  const el = document.getElementById('sw');
  if (!el) return;
  el.classList.add('on');
  el.innerHTML = `<div class="sw"><div class="sw-head"><button type="button" class="sw-x" onclick="closeStatusWidget()" aria-label="${esc(t('sw.aria_close'))}">×</button>
    <h3 id="sw-title">${esc(t('sw.loading'))}</h3><p>${esc(t('sw.fetching'))}</p></div></div>`;

  const all = await fetchAllRuns();
  const counts = { blocked_missed:0, due:0, in_progress:0, done7:0 };
  all.forEach(r => {
    if (r.status==='blocked'||r.status==='missed') counts.blocked_missed++;
    else if (r.status==='due') counts.due++;
    else if (r.status==='in_progress') counts.in_progress++;
    else if (r.status==='done') counts.done7++;
  });
  let rows = all.filter(bucket.match);
  // for done7 prefer recent if we have completed_at
  if (key === 'done7') {
    const weekAgo = Date.now() - 8*24*3600*1000;
    const recent = rows.filter(r => r.completed_at && new Date(r.completed_at).getTime() >= weekAgo);
    if (recent.length) rows = recent;
  }
  // sort: hot first
  const order = { blocked:0, missed:1, due:2, in_progress:3, done:4 };
  rows.sort((a,b) => (order[a.status]??9)-(order[b.status]??9) || String(a.due_date).localeCompare(String(b.due_date)));

  const listHtml = rows.length
    ? rows.slice(0, 40).map(statusRowHtml).join('')
    : `<div class="sw-empty">${esc(t('sw.empty'))}</div>`;

  el.innerHTML = `<div class="sw" onclick="event.stopPropagation()">
    <div class="sw-head">
      <button type="button" class="sw-x" onclick="closeStatusWidget()" aria-label="${esc(t('sw.aria_close'))}">×</button>
      <h3 id="sw-title">${esc(bucket.label)}</h3>
      <p>${esc(t('sw.runs_click', { n: rows.length }))}</p>
      ${processStripHtml(key, counts)}
    </div>
    <div class="sw-body">${listHtml}</div>
  </div>`;

  // mark legend buttons
  document.querySelectorAll('.legend .leg-btn').forEach(btn => {
    btn.classList.toggle('on', btn.getAttribute('data-status') === key);
  });
}

function closeStatusWidget(){
  statusWidgetKey = null;
  const el = document.getElementById('sw');
  if (el){ el.classList.remove('on'); el.innerHTML = ''; }
  document.querySelectorAll('.legend .leg-btn').forEach(btn => btn.classList.remove('on'));
}

function stackBarHtml(s, size){
  const b = +s.blocked||0, m = +s.missed||0, d = +s.due||0, p = +s.prog||0, done = +s.done7||0;
  const t = b+m+d+p+done;
  if (!t) return `<div class="stack-bar ${size||''}"><i class="seg-idle" style="width:100%"></i></div>`;
  const w = n => Math.max(n?2:0, Math.round((n/t)*100));
  let segs = '';
  if (b) segs += `<i class="seg-blocked" style="width:${w(b)}%" title="Blocked ${b}"></i>`;
  if (m) segs += `<i class="seg-missed" style="width:${w(m)}%" title="Missed ${m}"></i>`;
  if (d) segs += `<i class="seg-due" style="width:${w(d)}%" title="Due ${d}"></i>`;
  if (p) segs += `<i class="seg-prog" style="width:${w(p)}%" title="In work ${p}"></i>`;
  if (done) segs += `<i class="seg-done" style="width:${w(done)}%" title="Done 7d ${done}"></i>`;
  return `<div class="stack-bar ${size||''}">${segs}</div>`;
}

function meterHtml(label, pct, tone){

    <div class="meter-row"><span class="lbl">${esc(label)}</span><span class="val">${p}</span></div>
    <div class="meter-track"><i class="${cls}" style="width:${p}%"></i></div>

/** One knowledge track: gold | green | blue + rest filler so track is always full card width */
function knowledgeStackBarHtml(k, size){
  const gold = Math.max(0, +((k && (k.primary != null ? k.primary : k.corporate)) || 0));
  const green = Math.max(0, +((k && k.self_learned) || 0));
  const blue = Math.max(0, +((k && k.research) || 0));
  let segs = '';
  // Person knowledge: Primary skills · Self-learned · Research (per agent, not org)
  if (gold > 0) segs += `<i class="seg-gold" style="width:${gold}%" title="${esc(t('knowledge.primary'))} ${gold}%"></i>`;
  if (green > 0) segs += `<i class="seg-green" style="width:${green}%" title="${esc(t('knowledge.self'))} ${green}%"></i>`;
  if (blue > 0) segs += `<i class="seg-blue" style="width:${blue}%" title="${esc(t('knowledge.research'))} ${blue}%"></i>`;
  const used = Math.min(100, gold + green + blue);
  // Always pin rest so the bar body runs to the right edge of the card (not cut short)
  if (used < 100 || !segs) {
    segs += `<i class="seg-rest" style="width:${Math.max(0, 100 - used)}%" title="${esc(t('knowledge.rest'))}"></i>`;
  }
  return `<div class="stack-bar ${size || 'sm'}">${segs}</div>`;
}

/**
 * One competitiveness track: drivers stacked with separate colors.
 * totalPct is generous relative fill (index×10), segments share that fill by weight×score.
 */
function competitivenessStackBarHtml(components, totalPct, size){
  const weights = {
    activity: 0.18,
    completion: 0.22,
    results: 0.2,
    reliability: 0.18,
    engagement: 0.12,
    knowledge: 0.1
  };
  const classes = {
    activity: 'seg-act',
    completion: 'seg-comp',
    results: 'seg-res',
    reliability: 'seg-rel',
    engagement: 'seg-eng',
    knowledge: 'seg-know'
  };
  const labels = {
    activity: 'Activity',
    completion: 'Completion',
    results: 'Results',
    reliability: 'Reliability',
    engagement: 'Engagement',
    knowledge: 'Knowledge'
  };
  const c = components || {};
  const keys = Object.keys(weights);
  const contrib = keys.map(k => Math.max(0, (+c[k] || 0) * weights[k]));
  const sum = contrib.reduce((a, b) => a + b, 0);
  const fill = Math.max(0, Math.min(100, +totalPct || 0));
  if (fill <= 0 || sum <= 0) {
    return `<div class="stack-bar ${size || 'sm'}"><i class="seg-idle" style="width:100%" title="No competitiveness signal"></i></div>`;
  }
  let segs = '';
  let used = 0;
  keys.forEach((k, i) => {
    const w = Math.max(contrib[i] > 0 ? 1 : 0, Math.round((contrib[i] / sum) * fill));
    if (w > 0) {
      used += w;
      segs += `<i class="${classes[k]}" style="width:${w}%" title="${labels[k]} ${(+c[k] || 0).toFixed(1)}/10"></i>`;
    }
  });
  // Remainder to 100% so the track always spans full card width
  if (used < 100) segs += `<i class="seg-rest" style="width:${100 - used}%" title="Room to grow"></i>`;
  return `<div class="stack-bar ${size || 'sm'}">${segs}</div>`;
}

/** Card/drawer: competitiveness bar — same layout as Knowledge (no rank # bubble). */
function competitivenessHtml(c, compact){
  if (!c || c.index == null) return '';
  const idx = Math.max(0, Math.min(10, +c.index || 0));
  // Relative/generous: index 0–10 maps to 0–100% fill — top can reach 80–90% when peers idle
  const pct = Math.round(idx * 10);
  const dept = c.department ? String(c.department) : '';
  const dIdx = c.department_index != null ? (+c.department_index).toFixed(1) : '—';
  const comp = c.components || {};
  const bar = competitivenessStackBarHtml(comp, pct, compact ? 'sm' : '');
  // Label: same meter-row pattern as Knowledge (Owner 2026-07-17 — no rank number)
  const lbl = (typeof t === 'function' && t('compete.label') !== 'compete.label')
    ? t('compete.label')
    : 'Competitiveness';

  if (compact) {
    return `<div class="card-bars" style="margin-top:8px">
      <div class="meter">
        <div class="meter-row">
          <span class="lbl">${esc(lbl)}</span>
          <span class="val">${pct}%</span>
        </div>
        ${bar}
      </div>
    </div>`;
  }

  // Full panel: bar + % only (same as Knowledge); drivers in accordion; no #rank
  const fmtC = (v) => (v == null || v === '') ? '—' : (+v).toFixed(1);
  const deptLine = dept
    ? `<div class="cidx-row"><span>Dept (${esc(dept)})</span><b>${esc(String(dIdx))}</b></div>`
    : '';
  return `<div class="dash-panel comp-panel" style="margin:12px 0 0;padding:12px">
    <h3 style="margin-bottom:6px">${esc(lbl)}</h3>
    <div class="meter">
      <div class="meter-row" style="margin-bottom:6px">
        <span class="lbl">${esc(lbl)}</span>
        <span class="val">${pct}%</span>
      </div>
      ${bar}
    </div>
    <details class="cidx-acc">
      <summary>Drivers</summary>
      <div class="comp-grid" style="margin-top:8px">
        ${deptLine}
        <span>Activity</span><b>${fmtC(comp.activity)}</b>
        <span>Completion</span><b>${fmtC(comp.completion)}</b>
        <span>Results</span><b>${fmtC(comp.results)}</b>
        <span>Reliability</span><b>${fmtC(comp.reliability)}</b>
        <span>Engagement</span><b>${fmtC(comp.engagement)}</b>
        <span>Knowledge</span><b>${fmtC(comp.knowledge)}</b>
      </div>
    </details>
  </div>`;
}

function isReportOnlyTaskClient(r){
  const id = String(r?.task_id || '').toUpperCase().trim();
  if (/^(A1|A2|A7|VP5)$/.test(id)) return true;
  const t = String(r?.title || '');
  // Real activity with KPI/GEO/research — keep
  if (/\b(KPI|GEO|DA|SEO|research|finding|rollup|roll-up|скан|сводк)\b/i.test(t)
      && !/owner\s*brief|company\s*brief|due-today|digest completeness/i.test(t)) {
    return false;
  }
  if (/owner\s*(daily\s*)?brief|company\s*brief|due-today\s*list|digest\s*completeness|бриф\s*для\s*(шефа|вас)/i.test(t)) {
    return true;

/** Shared: open runs sorted for "what they are doing now". */
function openRunsNow(runs){
  const open = (runs || []).filter(r =>
    (r.status === 'due' || r.status === 'in_progress' || r.status === 'blocked' || r.status === 'missed')
    && !isReportOnlyTaskClient(r)
  );
  const rank = { blocked: 0, missed: 1, in_progress: 2, due: 3 };
  open.sort((a, b) => (rank[a.status] ?? 9) - (rank[b.status] ?? 9)
    || String(a.task_id || '').localeCompare(String(b.task_id || '')));
  return open;
}

/**
 * SUMMARIZE WHAT THEY ARE DOING — not the standing job description.
 * Rules (Owner chat, 2026-07):
 *  1) Situation now, not "this is their duty A1–A5".
 *  2) Same task_id stacked N times = ONE broken rhythm, not N duties.
 *  3) Delayed / blocked first — never bury the slip.
 *  4) No generic "why it matters" from TASK_BRIEF on the Owner face.
 *  5) Compress to short plain speech a person would say walking in.
 */
function openWorkstreams(runs){
  const open = openRunsNow(runs);
  const by = new Map();
  const statusRank = { blocked: 0, missed: 1, in_progress: 2, due: 3 };
  for (const r of open) {
    const id = String(r.task_id || r.title || r.id);
    let g = by.get(id);
    if (!g) {
      g = {
        task_id: r.task_id,
        title: r.title,
        status: r.status,
        percents: [],
        count: 0,
        hasDueZero: false,
        note: '',
        worstDue: r.due_date || ''
      };
      by.set(id, g);
    }
    g.count++;
    const pct = Math.max(0, Math.min(100, +r.percent || 0));
    if (pct > 0) g.percents.push(pct);
    if (r.status === 'due' && pct === 0) g.hasDueZero = true;
    if ((statusRank[r.status] ?? 9) < (statusRank[g.status] ?? 9)) g.status = r.status;
    if (!g.note && r.note) g.note = humanizeNote(r.note);
    if (r.due_date && (!g.worstDue || r.due_date < g.worstDue)) g.worstDue = r.due_date;
    if (r.title) g.title = r.title;
  }
  return [...by.values()].sort((a, b) =>
    (statusRank[a.status] ?? 9) - (statusRank[b.status] ?? 9)
    || (b.count - a.count)
    || String(a.task_id || '').localeCompare(String(b.task_id || ''))
  );
}

function doingNoun(ws){
  const id = String((ws && ws.task_id) || '').trim();
  if (LOCALE === 'ru') {
    const ruMap = window.DASORG_TASK_COPY?.doingNoun?.ru || window.DASORG_I18N?.taskCopy?.doingNoun?.ru || {};
    if (ruMap[id]) return ruMap[id];
    const short = window.DASORG_TASK_COPY?.shortTitle?.ru?.[id];
    if (short) return short;
  }
  if (DOING_NOUN[id]) return DOING_NOUN[id];
  const raw = String((ws && ws.title) || id || (LOCALE === 'ru' ? 'открытая работа' : 'open work'))
    .replace(/^[A-Z]{1,3}\d+\s*[—–:-]\s*/i, '')
    .replace(/\s+/g, ' ')
    .trim();
  return raw || (LOCALE === 'ru' ? 'открытая работа' : 'open work');
}

/** Verb phrase: what is happening on this workstream RIGHT NOW. */
function doingVerbPhrase(ws){
  const noun = doingNoun(ws);
  const maxP = (ws.percents && ws.percents.length) ? Math.max(...ws.percents) : 0;
  const ru = LOCALE === 'ru';
  const pct = maxP > 0 && maxP < 100
    ? (ru ? ` (~${maxP}%)` : ` (~${maxP}% done)`)
    : '';
  if (ws.status === 'blocked') return ru ? `застряла на «${noun}»${pct}` : `stuck on ${noun}${pct}`;
  if (ws.status === 'missed') return ru ? `опаздывает с «${noun}»${pct}` : `late on ${noun}${pct} and catching up`;
  if (ws.status === 'in_progress') return ru ? `в работе над «${noun}»${pct}` : `mid-run on ${noun}${pct}`;
  if (ws.count > 1) {
    return ru
      ? `${ws.count} копии «${noun}» на столе`
      : `has ${ws.count} copies of ${noun} piled up (one-at-a-time rhythm broke)`;
  }
  return null; // pure due — listed separately
}

/**
 * Owner prose: what she is doing — not a fingerprint catalog.
 * Lead with in-progress / blocked / late; then “still on desk, not started”.
 */
function agentDoingSpeech(first, she, runs){
  const streams = openWorkstreams(runs);
  if (!streams.length) return t('speech.nothing', { name: first });

  const live = streams.filter(s =>
    s.status === 'in_progress' || s.status === 'blocked' || s.status === 'missed' || s.count > 1
  );
  const dueOnly = streams.filter(s => s.status === 'due' && s.count === 1 && !live.includes(s));

  const bits = [];
  if (live.length) {
    const phrases = live.slice(0, 2).map(doingVerbPhrase).filter(Boolean);
    if (phrases.length === 1) {
      bits.push(t('speech.is_one', { name: first, phrase: phrases[0] }));
    } else if (phrases.length >= 2) {
      bits.push(t('speech.is_two', { name: first, a: phrases[0], b: phrases[1] }));
    }
  } else {
    bits.push(t('speech.not_started', { name: first }));
  }

  if (dueOnly.length) {
    const names = dueOnly.slice(0, 5).map(doingNoun);
    const more = dueOnly.length > 5 ? ` (+${dueOnly.length - 5})` : '';
    if (live.length) {
      bits.push(t('speech.desk', { poss: she.poss, names: names.join('; '), more }));
    } else {
      bits.push(t('speech.wait', { names: names.join('; '), more }));
    }
  }
  return bits.join(' ');
}

/** Card: short human line (no catalog dump). */
function cardDoingSpeech(runs){
  const streams = openWorkstreams(runs);
  if (!streams.length) return t('card.clear');
  const live = streams.filter(s =>
    s.status === 'in_progress' || s.status === 'blocked' || s.status === 'missed'
  );
  if (live.length) {
    const p = doingVerbPhrase(live[0]);
    if (p) {
      const rest = streams.length - 1;
      const head = p.charAt(0).toUpperCase() + p.slice(1);
      return rest > 0 ? head + t('card.more_open', { n: rest }) : head;
    }
  }
  const due = streams.filter(s => s.status === 'due');
  if (due.length === 1) return t('card.not_started_one', { name: doingNoun(due[0]) });
  if (due.length > 1) return t('card.not_started_n', { n: due.length });
  return t('card.open_work');
}

/** Always show the latest message when chat opens or updates. */
function scrollChatToLatest(logEl){
  const log = logEl
    || document.getElementById('float-chat-log')
    || document.getElementById('chat-log');
  if (!log) return;
  const go = () => {
    // Bottom of scrollable log = last message
    log.scrollTop = log.scrollHeight + 9999;
    const last = log.querySelector('.chat-msg:last-of-type, .chat-empty:last-child');
    if (last && typeof last.scrollIntoView === 'function') {
      try { last.scrollIntoView({ block: 'end', behavior: 'instant' }); } catch (_) {
        try { last.scrollIntoView(false); } catch (__) {}
      }
    }
  };
  go();
  requestAnimationFrame(() => {
    go();
    requestAnimationFrame(go);
  });
  setTimeout(go, 40);
  setTimeout(go, 160);
  setTimeout(go, 400);
}

/**
 * Boss-facing note only. Ops dumps / file paths / quota walls → short plain summary or ''.
 * Never show BACKLOGS paths, SSOT, ACCELERATED MODE walls of text to Owner.
 */
function humanizeNote(note){
  if (!note) return '';
  let n = String(note).trim();
  // Hard drop: internal canon dumps
  if (/BACKLOGS\/|ACCELERATED|SSOT:|das-architektura\/|link opps\/day|B2B touches\/day|White-hat only/i.test(n)) {
    if (/ACCELERATED|DA target|link opp/i.test(n)) {
      return 'Growth mode is on: team daily quotas (links, creatives, B2B, ads). White-hat only.';
    }
    return '';
  }
  if (/ADS LEARNING:|Do not execute Ads/i.test(n)) {
    return 'Ads learning note for the intelligence pack — no ads execution here.';
  }
  // kill ticket / API dump language
  n = n.replace(/^GOALS?\s*#?\d*\s*UPDATE:\s*/i, '');
  n = n.replace(/^REASSIGN intent:\s*/i, '');
  n = n.replace(/\bAPI cleared[^.]*\./gi, '');
  n = n.replace(/\bONLY UI left:\s*/gi, 'Your UI step left. ');
  n = n.replace(/\bbegin_checkout\b/gi, '');
  n = n.replace(/\bATC\b/g, '');
  n = n.replace(/\bYT subscriptions?\b/gi, '');
  n = n.replace(/\bCCG soft biddable off\b/gi, '');
  n = n.replace(/\bPACKAGE DELIVERED\.?\s*/gi, '');
  n = n.replace(/\bClaims standby[^.]*\./gi, '');
  n = n.replace(/\s+/g, ' ').replace(/\s*,\s*,/g, ',').trim();
  n = n.replace(/^[\s,;:.-]+|[\s,;:.-]+$/g, '');
  // if still looks like code / path dump, drop
  if (/include\s*=|biddable|mutate|soft goals|\.md\b|\/[A-Z0-9_-]+\/[A-Z0-9_-]+/i.test(n) && n.length > 50) {
    if (/purchase/i.test(n)) return 'Almost purchase-only; one UI step left for you.';
    return '';
  }
  if (n.length > 110) n = n.slice(0, 107) + '…';
  return n;
}

/** Short Boss line for a run card: what + simple status — not ops note wall */
function bossRunSummary(r, doneView){
  const brief = getTaskBrief(r.task_id);
  const what = brief && brief.what
    ? brief.what
    : casualWork(r.title, r.task_id);
  const note = humanizeNote(r.note);
  if (doneView || r.status === 'done') {
    return note ? t('run.done_note', { note }) : t('run.done_short');
  }
  if (r.status === 'blocked') {
    return note ? t('run.stuck_note', { note }) : t('run.stuck');
  }
  if (r.status === 'missed') {
    return note ? t('run.late_note', { note }) : t('run.late');
  }
  const pct = Math.max(0, Math.min(100, +r.percent || 0));
  let s = what;
  if (pct > 0 && isComplexProgress(r, doneView)) s += t('run.pct_done', { pct });
  else if (r.status === 'in_progress') s += t('run.in_progress_dot');
  else s += t('run.not_finished');
  if (note && note.length < 80) s += ' ' + note;
  return s;
}

function reportState(status, doneView){
  if (doneView || status === 'done') return { cls:'done', label: t('status.done') };
  if (status === 'blocked') return { cls:'stuck', label: t('status.stuck') };
  if (status === 'missed') return { cls:'missed', label: t('status.delayed') };
  if (status === 'in_progress') return { cls:'doing', label: t('status.in_progress') };
  if (status === 'due') return { cls:'doing', label: t('status.due') };
  return { cls:'doing', label: statusLabel(status) || '—' };
}
function isComplexProgress(r, doneView){
  // Bar only when partial progress is meaningful (1–99). Binary done/not-done → checkbox.
  if (doneView || r.status === 'done') return false;
  const pct = Math.max(0, Math.min(100, +r.percent || 0));
  if (r.status === 'in_progress' && pct > 0 && pct < 100) return true;
  if (r.status === 'blocked' && pct > 0 && pct < 100) return true;
  if (r.status === 'missed' && pct > 0 && pct < 100) return true;
  return false;
}
function taskCheckHtml(r, doneView){
  if (doneView || r.status === 'done') return `<span class="task-check done" title="${esc(t('status.done'))}" aria-label="${esc(t('status.done'))}"></span>`;
  if (r.status === 'blocked') return `<span class="task-check stuck" title="${esc(t('status.stuck'))}" aria-label="${esc(t('status.stuck'))}"></span>`;
  if (r.status === 'missed') return `<span class="task-check missed" title="${esc(t('status.missed'))}" aria-label="${esc(t('status.missed'))}"></span>`;
  return `<span class="task-check wait" title="${esc(t('status.not_done'))}" aria-label="${esc(t('status.not_done'))}"></span>`;
}
function reportCard(r, she, doneView){
  const st = reportState(r.status, doneView);
  const what = casualWork(r.title, r.task_id);
  const pct = doneView ? 100 : Math.max(0, Math.min(100, +r.percent || 0));
  const complex = isComplexProgress(r, doneView);
  const barCls = doneView || pct>=100 ? 'done' : (r.status==='blocked'||r.status==='missed' ? 'hot' : '');
  const summary = bossRunSummary(r, doneView);
  const say = esc(summary);
  let issue = '';
  if (r.status === 'blocked' && !/Stuck|Застряло/i.test(summary)) {
    issue = `<div class="rc-issue"><b>${esc(t('run.snag'))}</b> ${esc(t('run.snag_body'))}</div>`;
  }
  // Short title for card header (bubble-style), full plain summary in body
  const titleShow = String(r.title || what || 'Work').replace(/^[A-Z]{1,3}\d+\s*[—–:-]\s*/, '');
  const progressUi = complex
    ? `<div class="rc-pct-row">
        <span class="lbl">${esc(t('run.done_level'))}</span>
        <span class="val">${pct}%</span>
      </div>
      <div class="rc-bar"><i class="${barCls}" style="width:${pct}%"></i></div>`
    : `<div class="rc-check-row">
        ${taskCheckHtml(r, doneView)}
        <span class="lab">${esc(doneView || r.status==='done' ? t('status.done') : r.status==='blocked' ? t('status.stuck') : r.status==='missed' ? t('status.missed') : t('status.not_done'))}</span>
      </div>`;
  return `
    <article class="report-card ${st.cls==='stuck'||st.cls==='missed'?'hot':''}">
      <div class="rc-top">
        <h3 class="rc-title">${esc(titleShow)}</h3>
        <span class="rc-state ${st.cls}">${st.label}</span>
      </div>
      <p class="rc-say">${say}</p>
      ${issue}
      ${progressUi}
    </article>`;
}

/**
 * Live work table (Owner 2026-07-17): real board runs.
 * Russian multi-line task · square avatar next to name · % at end of row.
 * Headings and body lines: capital letter first (Owner — grammar).
 */
function capitalizePhrase(s){
  const t = String(s || '').trim();
  if (!t) return t;
  // First letter of the phrase (after optional quotes/brackets) → uppercase ru-RU
  return t.replace(/^([«"„'(\[]*)(\S)/, (m, pre, ch) => pre + ch.toLocaleUpperCase('ru-RU'));
}

function liveWorkTaskTitle(r){
  const id = String(r.task_id || '').trim();
  const pack = window.DASORG_TASK_COPY || window.DASORG_I18N?.taskCopy || {};
  const ruLong = pack.doingNoun?.ru?.[id];
  if (ruLong) return capitalizePhrase(ruLong);
  const ruShort = pack.shortTitle?.ru?.[id];
  if (ruShort) return capitalizePhrase(ruShort);
  const raw = String(r.title || '').trim()
    .replace(/^[A-Z]{1,3}\d+\s*[—–:-]\s*/i, '')
    .trim();
  if (raw && /[а-яА-ЯёЁ]/.test(raw)) return capitalizePhrase(raw);
  return capitalizePhrase(id || 'открытая работа');
}

/** Russian body lines for the task cell: what / why / done (always ≥3 lines). */
function liveWorkTaskLines(r){
  const id = String(r.task_id || '').trim();
  const pack = window.DASORG_TASK_COPY || window.DASORG_I18N?.taskCopy || {};
  const brief = pack.brief?.ru?.[id] || null;
  const title = liveWorkTaskTitle(r);
  const lines = [];
  if (brief && (brief.what || brief.why || brief.done)) {
    if (brief.what) lines.push(capitalizePhrase(brief.what));
    if (brief.why) lines.push(capitalizePhrase(brief.why));
    if (brief.done) lines.push(capitalizePhrase(brief.done));
  }
  while (lines.length < 3) {
    if (lines.length === 0) {
      lines.push('Открытый cadence-прогон на доске — реальная задача, не KPI-плитка.');
    } else if (lines.length === 1) {
      lines.push('Источник: org_task_runs (cron / worker / cadence); статус открыт.');
    } else {
      lines.push('Клик по строке — карточка агента и контекст работы.');
    }
  }
  return { title, lines: lines.slice(0, 4).map(capitalizePhrase) };
}

function liveWorkRunRowHtml(r, agentBySlug){
  const slugRaw = r.agent_slug || '';
  const prog = liveWorkProgress(r);
  const { title, lines } = liveWorkTaskLines(r);
  // Real ops note → native Russian first (Owner). Case notes (HA2608 etc.) stand alone —
  // do not glue generic task-brief («ежемесячный пересчёт…») under a live case.
  const noteLines = liveWorkNoteRu(r.note, r);
  const isCaseNote = noteLines.length >= 2 && /HA2608|HHUI-26070301|адресаты с|Goals #1|Ускоренный режим|listicle|NewMouth|Ellen|Guangzhou/i.test(noteLines.join(' '));
  const bodyLines = [];
  for (const ln of noteLines) {
    if (bodyLines.length >= 4) break;
    bodyLines.push(ln);
  }
  if (!isCaseNote) {
    for (const ln of lines) {
      if (bodyLines.length >= 4) break;
      if (!bodyLines.includes(ln)) bodyLines.push(ln);
    }
  }
  while (bodyLines.length < 3) {
    bodyLines.push('Реальная операция (есть след на доске).');
  }
  // Case title: prefer first note line sense over generic cadence title when HA2608 logistics
  let showTitle = title;
  if (/HA2608|HHUI-26070301/i.test(String(r.note || '') + String(r.task_id || ''))) {
    if (/Z4/i.test(String(r.task_id || ''))) showTitle = 'Координация закупки с Justina (логистика)';
    else if (/Z3/i.test(String(r.task_id || ''))) showTitle = 'Снабжение на паузе до фиксации цены';
    else if (/J7/i.test(String(r.task_id || ''))) showTitle = 'Счёт HA2608 — финпроверка и цена';
    else if (/J3/i.test(String(r.task_id || ''))) showTitle = 'Контрпредложение по счёту HA2608';
  }
  const { html: agentTd } = liveWorkAgentCell(slugRaw, agentBySlug, prog, showTitle);
  const body = bodyLines.slice(0, 4).map(ln => `<span class="task-line">${esc(ln)}</span>`).join('');
  const slug = esc(slugRaw);
  return `<tr onclick="openAgent('${slug}')" data-kind="run" data-slug="${slug}" data-task="${esc(r.task_id || '')}">
    ${agentTd}
    <td class="col-task"><span class="task-title">${esc(showTitle)}</span>${body}</td>
    <td class="col-progress ${prog.cls}">${esc(prog.text)}</td>
  </tr>`;
}

function liveWorkChatChannelLabel(ch){
  const c = String(ch || 'board').toLowerCase();
  if (c === 'telegram') return 'Telegram';
  if (c === 'digest') return 'Digest';
  if (c === 'system') return 'System';
  return 'Доска';
}

function liveWorkChatRowHtml(c, agentBySlug){
  const slugRaw = c.agent_slug || '';
  const prog = { text: '—', cls: 'empty' };
  const chLab = liveWorkChatChannelLabel(c.channel);
  const title = capitalizePhrase(`Переписка · ${chLab}`);
  const { html: agentTd } = liveWorkAgentCell(slugRaw, agentBySlug, prog, title);
  const msgs = Array.isArray(c.messages) ? c.messages : [];
  const lines = msgs.slice(-3).map((m) => {
    const who = m.role === 'user' ? 'Шеф' : 'Агент';
    const text = String(m.content || '').replace(/\s+/g, ' ').trim().slice(0, 220);
    return capitalizePhrase(`${who}: ${text}`);
  });
  while (lines.length < 3) {
    if (lines.length === 0) lines.push('Живой чат с агентом (board / telegram / digest).');
    else if (lines.length === 1) lines.push('Источник: agent_chat_messages в D1 — не выдуманная задача.');
    else lines.push('Клик — карточка агента и полный тред.');
  }
  const body = lines.slice(0, 4).map(ln => `<span class="task-line">${esc(ln)}</span>`).join('');
  const slug = esc(slugRaw);
  return `<tr onclick="openAgent('${slug}')" data-kind="chat" data-slug="${slug}" data-channel="${esc(c.channel || 'board')}">
    ${agentTd}
    <td class="col-task"><span class="task-title">${esc(title)}</span>${body}</td>
    <td class="col-progress empty">—</td>
  </tr>`;
}

async function loadKpi(){
  $('#body').innerHTML = `<p class="sec">${esc(t('kpi.loading'))}</p>`;
  if (!agents.length) {
    try { agents = await api('/agents'); } catch (e) { agents = []; }
  }

  // Real executed work only: worker runs with evidence + recent chats (API /live-work)
  let pack = { runs: [], chats: [], counts: { total: 0, runs: 0, chats: 0 } };
  try {
    const res = await api('/live-work?hours=72');
    if (res && res.ok) {
      pack = {
        runs: Array.isArray(res.runs) ? res.runs : [],
        chats: Array.isArray(res.chats) ? res.chats : [],
        counts: res.counts || { total: 0, runs: 0, chats: 0 }
      };
    }
  } catch (e) {
    pack = { runs: [], chats: [], counts: { total: 0, runs: 0, chats: 0 } };
  }

  const agentBySlug = Object.fromEntries((agents || []).map(a => [a.slug, a]));
  const runRows = pack.runs.map(r => liveWorkRunRowHtml(r, agentBySlug));
  const chatRows = pack.chats.map(c => liveWorkChatRowHtml(c, agentBySlug));
  const rows = runRows.concat(chatRows).join('');
  const n = (pack.counts && pack.counts.total) || (pack.runs.length + pack.chats.length);
  const table = n
    ? `<div class="live-wrap"><table class="live-table" role="table">
        <colgroup>
          <col class="live-col-agent">
          <col class="live-col-task">
          <col class="live-col-pct">
        </colgroup>
        <thead>
          <tr>
            <th scope="col" class="col-agent">${esc(t('kpi.col.agent'))}</th>
            <th scope="col" class="col-task">${esc(t('kpi.col.task'))}</th>
            <th scope="col" class="col-progress" style="text-align:right">${esc(t('kpi.col.progress'))}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table></div>`
    : `<div class="live-empty">${esc(t('kpi.empty'))}</div>`;

  const meta = t('kpi.count', { n })
    + (pack.counts
      ? ` · ${t('kpi.count.split', { runs: pack.counts.runs || pack.runs.length, chats: pack.counts.chats || pack.chats.length })}`
      : '');

  $('#body').innerHTML = `
    <header class="live-head">
      <h2>${esc(t('kpi.title'))}</h2>
      <p>${esc(t('kpi.lead'))}</p>
      <div class="live-meta">${esc(meta)}</div>
    </header>
    ${table}`;
}
