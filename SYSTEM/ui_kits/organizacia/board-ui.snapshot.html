let seminarState = null;
let seminarPollTimer = null;
/** Structure signature of last full render (id|qMap) — progress % not included. */
let seminarRenderSig = '';
/**
 * Owner preference: opening the Seminar button = clean blank start.
 * Never auto-resume a leftover open room (old YouTube/material stuck in D1).
 * Poll only after Start (or explicit Resume).
 */
let seminarRoomLive = false;

function closeSeminar(){
  const el = document.getElementById('sem-modal');
  if (el){ el.classList.remove('on'); el.innerHTML = ''; }
  if (seminarPollTimer){ clearInterval(seminarPollTimer); seminarPollTimer = null; }
  seminarRenderSig = '';
  seminarRoomLive = false;
  seminarState = null;
  semResetPreviewCache();
}

function stopSeminarPoll(){
  if (seminarPollTimer){ clearInterval(seminarPollTimer); seminarPollTimer = null; }
}

function startSeminarPoll(){
  stopSeminarPoll();
  seminarPollTimer = setInterval(() => {
    if (!seminarRoomLive) return;
    refreshSeminarPanel(true);
  }, 4000);
}

/**
 * Seminar is a form modal: NEVER close on backdrop click/drag.
 * Close only via X or "Close seminar" button.
 * (Selecting text in Material used to mouseup on dimmer → false close.)
 */
function bindSeminarBackdrop(el){
  if (!el || el.dataset.boundClose) return;
  el.dataset.boundClose = '1';
  const block = (ev) => {
    if (ev.target === el || ev.target.id === 'sem-modal') {
      ev.preventDefault();
      ev.stopPropagation();
    }
  };
  el.addEventListener('mousedown', block, true);
  el.addEventListener('mouseup', block, true);
  el.addEventListener('click', block, true);
}

/** Owner is interacting with Material / title / answers — do not full-rebuild DOM. */
function seminarOwnerIsEditing(){
  const ae = document.activeElement;
  if (ae) {
    if (ae.id === 'sem-body-in' || ae.id === 'sem-title') return true;
    if (ae.classList && ae.classList.contains('sem-ans')) return true;
    // Textarea selection is NOT in window.getSelection — check caret range
    if (typeof ae.selectionStart === 'number' && typeof ae.selectionEnd === 'number'
        && ae.selectionStart !== ae.selectionEnd) {
      return true;
    }
  }
  try {
    const sel = window.getSelection && window.getSelection();
    if (sel && !sel.isCollapsed && String(sel).length) {
      const body = document.getElementById('sem-body');
      if (body && sel.rangeCount) {
        const n = sel.getRangeAt(0).commonAncestorContainer;
        if (body.contains(n)) return true;
      }
    }
  } catch (_) {}
  return false;
}

/** Keep in sync with api/seminar-logic.mjs seminarActiveStructureSig */
function semActiveStructureSig(seminarId, questions){
  if (!seminarId) return 'idle';
  const qPart = (questions || []).map(q =>
    q.id + ':' + (q.answer && String(q.answer).trim() ? 'a' : 'o')
  ).join(',');
  return String(seminarId) + '|' + qPart;
}

/**
 * Soft-poll policy — keep in sync with api/seminar-logic.mjs seminarSoftRenderMode
 * skip | patch-progress | full-render
 */
function seminarSoftRenderModeLocal(p){
  if (!p || !p.soft) return 'full-render';
  if (!p.hasActive) {
    // Old seminar closed/replaced but progress chrome still on screen → rebuild idle form
    if (p.progressDomExists) return 'full-render';
    return p.materialFieldExists ? 'skip' : 'full-render';
  }
  const prev = String(p.prevSig || '').split('|');
  const next = String(p.nextSig || '').split('|');
  // New seminar id (Owner started fresh material) → full rebuild, not patch old room
  if (prev[0] && next[0] && prev[0] !== next[0]) return 'full-render';
  if (p.progressDomExists && prev[0] && prev[0] === next[0] && (prev[1] || '') === (next[1] || '')) {
    return 'patch-progress';
  }
  return 'full-render';
}

/** Clear link-preview cache so a new URL (or same URL re-paste) reloads. */
function semResetPreviewCache(){
  semPreviewLastUrl = '';
  semPreviewInflight = '';
  const box = document.getElementById('sem-preview');
  if (box) {
    box.dataset.ready = '0';
  }
}

/**
 * Title field = content title only (mirror api/link-preview.mjs cleanContentTitle).
 * "DASORG seminar · ◤Больше не торгуем в минус? · video" → "Больше не торгуем в минус"
 */
function cleanSeminarContentTitle(raw){
  let t = String(raw || '').trim();
  t = t
    .replace(/^\s*DASORG\s+seminar\s*[·|•:\-–—]\s*/i, '')
    .replace(/\s*[·|•]\s*video\s*$/i, '')
    .replace(/\s*[\|·•]\s*YouTube\s*$/i, '')
    .replace(/\s*-\s*YouTube\s*$/i, '')
    .replace(/\s*\(\s*YouTube\s*\)\s*$/i, '');
  t = t.replace(/[◤◥◣◢◆◇■□▪▫●○•★☆▶►◀◄]+/g, ' ');
  t = t.replace(/\s+/g, ' ').trim();
  t = t.replace(/[\s?!.…]+$/u, '').trim();
  t = t.replace(/^\s*DASORG\s+seminar\s*[·|•:\-–—]\s*/i, '').trim();
  return t;
}

/**
 * Owner-facing Refresh: hard reload panel from API + re-fetch preview for current Material.
 * Use when replacing old seminar material/link with a new one — soft poll alone can stick.
 */
async function forceSeminarRefresh(){
  const mat = document.getElementById('sem-body-in')?.value;
  const titleEl = document.getElementById('sem-title');
  const title = titleEl ? titleEl.value : null;
  const autoT = titleEl ? (titleEl.dataset.autoTitle || '1') : '1';
  const drafts = semCaptureAnswerDrafts();
  seminarRenderSig = '';
  semResetPreviewCache();
  try {
    // Idle: refresh empty form + current paste only. Live room: reload from API.
    await refreshSeminarPanel(false, seminarRoomLive ? undefined : { forceIdle: true });
  } catch (e) {
    toast(t('toast.refresh_fail'));
    return;
  }
  // Keep what Owner typed (new material) across the hard rebuild
  const ta = document.getElementById('sem-body-in');
  const ti = document.getElementById('sem-title');
  if (ta && mat != null) ta.value = mat;
  if (ti && title != null) {
    ti.value = title;
    ti.dataset.autoTitle = autoT;
  }
  semRestoreAnswerDrafts(drafts, null, null);
  scheduleSemLinkPreview(true, true);
  toast(t('toast.refreshed'));
}

/** Capture Owner answer drafts so soft poll cannot wipe mid-typing. */
function semCaptureAnswerDrafts(){
  const drafts = {};
  document.querySelectorAll('textarea.sem-ans[id^="semans-in-"]').forEach(ta => {
    const id = String(ta.id || '').replace(/^semans-in-/, '');
    if (id) drafts[id] = ta.value;
  });
  return drafts;
}
function semRestoreAnswerDrafts(drafts, focusedId, focusedVal){
  if (!drafts) return;
  Object.keys(drafts).forEach(id => {
    const ta = document.getElementById('semans-in-' + id);
    if (!ta) return;
    if (focusedId === ta.id && focusedVal != null) {
      ta.value = focusedVal;
    } else {
      ta.value = drafts[id];
    }
  });
  if (focusedId) {
    const ta = document.getElementById(focusedId);
    if (ta) {
      try { ta.focus(); } catch (_) {}
    }
  }
}

/** Soft poll: patch progress only — never rebuild Material field or full panel. */
function semPatchProgressDom(s, digs, roster, story){
  const frozen = !!(story && story.agents_frozen);
  const pct = frozen ? 0 : Math.max(0, Math.min(100, +s.progress || 0));
  const headB = document.querySelector('#sem-body .sem-prog-head b');
  if (headB) headB.textContent = frozen ? '…' : (pct + '%');
  const bar = document.querySelector('#sem-body .sem-prog');
  const fill = document.querySelector('#sem-body .sem-prog i');
  if (bar) bar.setAttribute('aria-valuenow', String(pct));
  if (fill) fill.style.width = pct + '%';
  const left = frozen ? [] : (story.left || digs.filter(d => d.disposition === 'left').map(d => d.agent_slug));
  const digested = frozen ? [] : (story.digested || digs.filter(d => d.disposition !== 'left').map(d => d.agent_slug));
  const digList = digested.length ? digested.map(esc).join(', ') : '—';
  const leftList = left.length ? left.map(esc).join(', ') : '—';
  const meta = document.querySelector('#sem-body .sem-prog-meta');
  if (meta) {
    if (frozen) {
      const ch = story.text_chars != null ? story.text_chars : 0;
      const err = story.transcript_error ? (' · ' + story.transcript_error) : '';
      meta.textContent = `Waiting for full text (agent-reach yt-dlp) — agents frozen. Chars: ${ch}${err}`;
    } else {
      meta.textContent = `Settled ${digs.length}/${roster || '—'} · Digested: ${digList} · Left room: ${leftList}`;
    }
  }
  const waitEl = document.getElementById('sem-wait-tx');
  if (waitEl) waitEl.hidden = !frozen;
}

async function openSeminar(){
  const el = document.getElementById('sem-modal');
  if (!el) return;
  bindSeminarBackdrop(el);
  el.classList.add('on');
  // stopPropagation so panel never bubbles to dimmer; backdrop itself never closes the room
  el.innerHTML = `<div class="sem-panel" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" onmouseup="event.stopPropagation()">
    <div class="sem-head">
      <h2>${esc(t('sem.title'))}</h2>
      <button type="button" class="x" onclick="event.stopPropagation();closeSeminar()" aria-label="${esc(t('btn.close'))}">×</button>
    </div>
    <div class="sem-body" id="sem-body"><p class="muted">${esc(t('status.loading'))}</p></div>
  </div>`;
  seminarRenderSig = '';
  seminarRoomLive = false;
  stopSeminarPoll();
  semResetPreviewCache();
  // Discard any leftover open room in D1 so old material (e.g. «перекупщики») never reappears
  try {
    const cur = await api('/seminars/active');
    if (cur && cur.active && cur.active.id) {
      await api('/seminars/' + encodeURIComponent(cur.active.id) + '/close', {
        method: 'POST', body: '{}'
      });
    }
  } catch (_) { /* still show blank form */ }
  seminarState = { active: null, questions: [], digests: [], roster: 0, story: {} };
  // Always blank start form — never auto-open previous seminar content
  await refreshSeminarPanel(false, { forceIdle: true });
}

/**
 * @param {boolean} soft
 * @param {{ forceIdle?: boolean }} opts  forceIdle = ignore server active, paint empty Start form
 */
async function refreshSeminarPanel(soft, opts){
  const body = document.getElementById('sem-body');
  if (!body) return;
  const forceIdle = !!(opts && opts.forceIdle);
  if (!forceIdle && seminarRoomLive) {
    try {
      seminarState = await api('/seminars/active');
    } catch (e) {
      if (!soft) body.innerHTML = `<p class="muted">Could not load seminar API.</p>`;
      return;
    }
  } else if (forceIdle) {
    seminarState = { active: null, questions: [], digests: [], roster: 0, story: {} };
  } else if (!seminarRoomLive) {
    // Idle blank form: do not pull sticky active seminar from API
    if (!seminarState) seminarState = { active: null };
    if (soft) {
      // keep Owner typing; no server restore of old room
      wireSemMaterialField();
      ensureSemPreviewIfNeeded();
      return;
    }
  }
  const s = (!forceIdle && seminarRoomLive) ? (seminarState && seminarState.active) : null;
  const qs = (seminarState && seminarState.questions) || [];
  const digs = (seminarState && seminarState.digests) || [];
  const roster = (seminarState && seminarState.roster) || 0;
  const story = (seminarState && seminarState.story) || {};
  const pct = s ? Math.max(0, Math.min(100, +s.progress || 0)) : 0;
  const nextStructSig = s ? semActiveStructureSig(s.id, qs) : 'idle';
  const softMode = seminarSoftRenderModeLocal({
    soft: !!soft,
    hasActive: !!s,
    materialFieldExists: !!document.getElementById('sem-body-in'),
    progressDomExists: !!document.querySelector('#sem-body .sem-prog'),
    prevSig: seminarRenderSig,
    nextSig: nextStructSig
  });

  // Soft poll: never destroy Owner Material typing, selection, or answer drafts
  if (softMode === 'skip') {
    // Still kick link preview if URL is present but card not ready (paste after first paint)
    wireSemMaterialField();
    ensureSemPreviewIfNeeded();
    return;
  }
  if (softMode === 'patch-progress' && s) {
    semPatchProgressDom(s, digs, roster, story);
    seminarRenderSig = nextStructSig;
    wireSemMaterialField();
    ensureSemPreviewIfNeeded();
    return;
  }
  // Hard rule: while Owner edits/selects in Material or answers — only patch bar, never full rebuild
  if (soft && seminarOwnerIsEditing()) {
    if (s && document.querySelector('#sem-body .sem-prog')) {
      semPatchProgressDom(s, digs, roster, story);
    }
    wireSemMaterialField();
    ensureSemPreviewIfNeeded();
    return;
  }

  // Preserve drafts across full soft rebuild
  const matDraft = soft && document.getElementById('sem-body-in')
    ? document.getElementById('sem-body-in').value
    : null;
  const titleElPrev = document.getElementById('sem-title');
  const titleDraft = soft && titleElPrev ? titleElPrev.value : null;
  const titleAutoFlag = titleElPrev ? (titleElPrev.dataset.autoTitle || '1') : '1';
  const drafts = soft ? semCaptureAnswerDrafts() : {};
  const ae = document.activeElement;
  const focusedId = (ae && ae.id) || '';
  const focusedVal = (ae && (ae.id === 'sem-body-in' || ae.id === 'sem-title' || (ae.classList && ae.classList.contains('sem-ans'))))
    ? ae.value : null;

  // --- ALWAYS: Material is first editable field (paste or link) ---
  // Idle: empty on hard open; soft poll keeps Owner paste. Active: room material (live only).
  const materialValue = (!s)
    ? (matDraft != null ? matDraft : '')
    : (matDraft != null && document.activeElement && document.activeElement.id === 'sem-body-in'
        ? matDraft
        : String(s.body || ''));
  const titleValue = (!s)
    ? (titleDraft != null ? titleDraft : '')
    : (titleDraft != null && document.activeElement && document.activeElement.id === 'sem-title'
        ? titleDraft
        : String(s.title || ''));

  let belowHtml = '';
  if (!s) {
    // Idle: always empty material on hard open (forceIdle / first paint). Soft keeps drafts via matDraft.
    belowHtml = `
      <div class="sem-actions" style="margin-top:12px">
        <button class="btn btn-dark" type="button" id="sem-start-btn" onclick="startSeminar()">${esc(t('sem.start'))}</button>
        <button class="btn btn-ghost" type="button" onclick="forceSeminarRefresh()" title="${esc(t('sem.refresh_title'))}">${esc(t('sem.refresh'))}</button>
      </div>
      <p class="sem-lead" style="margin-top:10px">${esc(t('sem.lead_idle'))}</p>`;
  } else {
    const frozen = !!(story.agents_frozen);
    const left = frozen ? [] : (story.left || digs.filter(d => d.disposition === 'left').map(d => d.agent_slug));
    const digested = frozen ? [] : (story.digested || digs.filter(d => d.disposition !== 'left').map(d => d.agent_slug));
    const digList = digested.length ? digested.map(esc).join(', ') : '—';
    const leftList = left.length ? left.map(esc).join(', ') : '—';
    const showPct = frozen ? 0 : pct;
    let qHtml;
    if (frozen) {
      qHtml = `<p class="muted" id="sem-wait-tx">${esc(t('sem.wait_tx'))}</p>`;
    } else if (pct < 100 && !qs.length) {
      qHtml = `<p class="muted">${esc(t('sem.q_after'))}</p>`;
    } else if (!qs.length) {
      qHtml = `<p class="muted">${esc(t('sem.settled'))}</p>`;
    } else {
      qHtml = qs.map(q => {
        const open = !(q.answer && String(q.answer).trim());
        const who = esc(q.agent_slug || 'agent');
        if (open) {
          return `<div class="sem-q open" id="semq-${q.id}">
            <div class="sem-q-btn static">
              <span class="sem-q-who">${who}</span>
              <span class="sem-q-text">${esc(q.question)}</span>
              <span class="sem-q-hint">${esc(t('sem.answer_hint'))}</span>
            </div>
            <div class="sem-ans-wrap" id="semans-${q.id}">
              <textarea class="sem-ans" id="semans-in-${q.id}" rows="2" placeholder="${esc(t('sem.answer_ph'))}"
                onkeydown="return semAnswerKey(event, '${esc(s.id)}', ${q.id})"></textarea>
              <div class="sem-actions" style="margin-top:8px">
                <button type="button" class="btn btn-dark" onclick="submitSemAnswer('${esc(s.id)}', ${q.id})">${esc(t('btn.send'))}</button>
              </div>
            </div>
          </div>`;
        }
        return `<div class="sem-q done">
          <div class="sem-q-btn static">
            <span class="sem-q-who">${who}</span>
            <span class="sem-q-text">${esc(q.question)}</span>
          </div>
          <div class="sem-a"><strong>${esc(t('sem.owner_label'))}</strong> ${esc(q.answer)}</div>
        </div>`;
      }).join('');
    }
    const metaLine = frozen
      ? `Waiting · chars: ${story.text_chars || 0}${story.transcript_error ? ' · ' + esc(story.transcript_error) : ''}`
      : `Settled ${digs.length}/${roster || '—'} · Digested: ${digList} · Left: ${leftList}`;
    belowHtml = `
      <div class="sem-prog-head"><span>${esc(t('sem.prog'))}</span><b>${frozen ? '…' : (showPct + '%')}</b></div>
      <div class="sem-prog" aria-valuenow="${showPct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${showPct}%"></i></div>
      <p class="sem-prog-meta muted">${metaLine}</p>
      ${frozen ? `<p class="sem-lead" id="sem-wait-tx" style="margin:0 0 12px">${esc(t('sem.wait_tx'))}</p>` : ''}
      <div class="sem-sec">${esc(t('sem.prog'))}</div>
      <div class="sem-q-list">${qHtml}</div>
      <div class="sem-actions">
        <button class="btn btn-dark" type="button" onclick="closeActiveSeminar()">${esc(t('sem.close_btn'))}</button>
        <button class="btn btn-ghost" type="button" onclick="forceSeminarRefresh()" title="${esc(t('sem.refresh_hard'))}">${esc(t('sem.refresh'))}</button>
      </div>`;
  }

  body.innerHTML = `
    <label class="sem-label" for="sem-body-in">${esc(t('sem.material_label'))}</label>
    <textarea id="sem-body-in" class="sem-ta" rows="5" placeholder="${esc(t('sem.material_ph'))}">${esc(materialValue)}</textarea>
    <div id="sem-preview" class="sem-preview" hidden></div>
    <label class="sem-label" for="sem-title">${esc(t('sem.title_label'))} <span class="muted">${esc(t('sem.title_hint_span'))}</span></label>
    <input id="sem-title" class="sem-input" placeholder="${esc(t('sem.title_ph'))}" value="${esc(titleValue)}"
      data-auto-title="${esc(titleAutoFlag)}" />
    <p class="sem-title-hint">${esc(t('sem.title_hint'))}</p>
    ${belowHtml}`;

  seminarRenderSig = s ? nextStructSig : 'idle';
  if (soft) {
    if (matDraft != null && focusedId === 'sem-body-in') {
      const ta = document.getElementById('sem-body-in');
      if (ta) ta.value = focusedVal != null ? focusedVal : matDraft;
    }
    if (titleDraft != null && focusedId === 'sem-title') {
      const ti = document.getElementById('sem-title');
      if (ti) ti.value = focusedVal != null ? focusedVal : titleDraft;
    }
    semRestoreAnswerDrafts(drafts, focusedId, focusedVal);
  }
  wireSemMaterialField();
  scheduleSemLinkPreview(true);
}

/* ---------- Seminar link preview + auto title (DASORG-tagged) ---------- */
let semPreviewTimer = null;
let semPreviewLastUrl = '';
let semPreviewInflight = '';

function wireSemMaterialField(){
  const ta = document.getElementById('sem-body-in');
  const titleEl = document.getElementById('sem-title');
  if (ta && !ta.dataset.previewWired) {
    ta.dataset.previewWired = '1';
    ta.addEventListener('input', () => scheduleSemLinkPreview(false));
    ta.addEventListener('change', () => scheduleSemLinkPreview(true));
    ta.addEventListener('paste', () => {
      setTimeout(() => scheduleSemLinkPreview(true), 20);
    });
    // Ctrl/Cmd+Enter = Start seminar when idle
    ta.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
        ev.preventDefault();
        if (!seminarState || !seminarState.active) startSeminar();
      }
    });
  }
  if (titleEl && !titleEl.dataset.wired) {
    titleEl.dataset.wired = '1';
    titleEl.addEventListener('input', () => { titleEl.dataset.autoTitle = '0'; });
    titleEl.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        if (!seminarState || !seminarState.active) startSeminar();
      }
    });
  }
}

function ensureSemPreviewIfNeeded(){
  const ta = document.getElementById('sem-body-in');
  const box = document.getElementById('sem-preview');
  if (!ta || !box) return;
  const url = extractUrlFromText(ta.value);
  if (url && box.dataset.ready !== '1') scheduleSemLinkPreview(true);
}

function scheduleSemLinkPreview(immediate, force){
  const ta = document.getElementById('sem-body-in');
  if (!ta) return;
  if (force) semResetPreviewCache();
  if (semPreviewTimer) clearTimeout(semPreviewTimer);
  const run = () => { refreshSemLinkPreview(ta.value, !!force); };
  if (immediate) run();
  else semPreviewTimer = setTimeout(run, 300);
}

function extractUrlFromText(text){
  const m = String(text || '').match(/https?:\/\/[^\s<>"')\]]+/i);
  if (!m) return '';
  return m[0].replace(/[.,;:!?)]+$/, '');
}

async function refreshSemLinkPreview(materialText, force){
  const box = document.getElementById('sem-preview');
  const titleEl = document.getElementById('sem-title');
  if (!box) return;
  const url = extractUrlFromText(materialText);
  if (!url) {
    box.hidden = true;
    box.innerHTML = '';
    box.dataset.ready = '0';
    semPreviewLastUrl = '';
    return;
  }
  // New material/url after old one: always re-fetch when force, or when URL changed
  if (!force && url === semPreviewLastUrl && box.dataset.ready === '1') return;
  if (!force && url === semPreviewInflight) return;
  if (force) {
    semPreviewInflight = '';
    box.dataset.ready = '0';
  }
  semPreviewInflight = url;
  semPreviewLastUrl = url;
  box.hidden = false;
  box.dataset.ready = '0';
  box.innerHTML = `<div class="sp-loading">${esc(t('sem.preview_loading'))}</div>`;
  try {
    const prev = await api('/link-preview?url=' + encodeURIComponent(url));
    // stale response?
    const still = extractUrlFromText((document.getElementById('sem-body-in') || {}).value || '');
    if (still && still !== url) return;
    if (!prev || prev.ok === false) {
      box.innerHTML = `<div class="sp-err">${esc(t('sem.preview_none'))}</div>`;
      box.dataset.ready = '0';
      return;
    }
    renderSemPreviewCard(box, prev);
    box.dataset.ready = '1';
    if (titleEl && titleEl.dataset.autoTitle !== '0') {
      // Content title only — never brand-prefix (server suggestedTitle is clean; local fallback strips noise)
      const raw = prev.suggestedTitle || prev.title || 'External material';
      const suggested = cleanSeminarContentTitle(raw);
      titleEl.value = suggested;
      titleEl.dataset.autoTitle = '1';
    }
  } catch (e) {
    box.innerHTML = `<div class="sp-err">${esc(t('sem.preview_fail'))}</div>`;
    box.dataset.ready = '0';
  } finally {
    if (semPreviewInflight === url) semPreviewInflight = '';
  }
}

function renderSemPreviewCard(box, prev){
  const kind = prev.kind === 'youtube' ? 'YouTube' : 'Web page';
  let media = '';
  if (prev.kind === 'youtube' && (prev.embedUrl || prev.videoId)) {
    const emb = prev.embedUrl || ('https://www.youtube.com/embed/' + prev.videoId);
    media = `<div class="sp-media"><iframe src="${esc(emb)}" title="YouTube preview" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
  } else if (prev.image) {
    media = `<div class="sp-media"><img src="${esc(prev.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'" /></div>`;
  }
  box.innerHTML = `<div class="sp-inner">
    ${media}
    <div class="sp-body">
      <p class="sp-kind">${esc(kind)} preview</p>
      <p class="sp-title">${esc(prev.title || 'Untitled')}</p>
      ${prev.description ? `<p class="sp-desc">${esc(prev.description)}</p>` : ''}
      <div class="sp-url">${esc(prev.url || '')}</div>
    </div>
  </div>`;
}

async function startSeminar(){
  const titleEl = document.getElementById('sem-title');
  const bodyEl = document.getElementById('sem-body-in');
  let title = (titleEl?.value || '').trim();
  const body = (bodyEl?.value || '').trim();
  if (!body){ toast(t('toast.sem_paste')); return; }
  // If title empty but we have a URL, force one preview pass then start
  if (!title && extractUrlFromText(body)) {
    try {
      const prev = await api('/link-preview?url=' + encodeURIComponent(extractUrlFromText(body)));
      if (prev && (prev.suggestedTitle || prev.title)) {
        title = cleanSeminarContentTitle(prev.suggestedTitle || prev.title);
        if (titleEl) { titleEl.value = title; titleEl.dataset.autoTitle = '1'; }
      }
    } catch (_) { /* start anyway */ }
  }
  if (!title) title = cleanSeminarContentTitle(body.split(/\n/)[0].slice(0, 80)) || t('sem.material_pack');
  try {
    // Replacing an open seminar: API closes old rows; force UI structure reset
    seminarRenderSig = '';
    semResetPreviewCache();
    seminarState = await api('/seminars', { method: 'POST', body: JSON.stringify({ title, body, material: body }) });
    seminarRoomLive = true;
    toast(t('toast.sem_started'));
    await refreshSeminarPanel(false);
    startSeminarPoll();
  } catch (e) {
    toast(t('toast.sem_start_fail', { msg: e && e.message ? e.message : 'error' }));
  }
}

function semAnswerKey(ev, sid, qid){
  if (ev.key === 'Enter' && !ev.shiftKey) {
    ev.preventDefault();
    submitSemAnswer(sid, qid);
    return false;
  }
  return true;
}

async function submitSemAnswer(sid, qid){
  const ta = document.getElementById('semans-in-' + qid);
  const answer = (ta && ta.value || '').trim();
  if (!answer) return;
  try {
    seminarState = await api('/seminars/' + encodeURIComponent(sid) + '/questions/' + qid + '/answer', {
      method: 'POST', body: JSON.stringify({ answer })
    });
    await refreshSeminarPanel();
  } catch (e) { toast(t('toast.sem_answer_fail')); }
}

async function closeActiveSeminar(){
  const s = seminarState && seminarState.active;
  if (!s) {
    seminarRoomLive = false;
    stopSeminarPoll();
    await refreshSeminarPanel(false, { forceIdle: true });
    return;
  }
  try {
    await api('/seminars/' + encodeURIComponent(s.id) + '/close', { method: 'POST', body: '{}' });
    toast(t('toast.sem_closed'));
    seminarState = { active: null };
    seminarRoomLive = false;
    seminarRenderSig = '';
    semResetPreviewCache();
    stopSeminarPoll();
    // Hard rebuild empty Start form — no old material
    await refreshSeminarPanel(false, { forceIdle: true });
  } catch (e) { toast(t('toast.sem_close_fail')); }
}

// Text pipeline SSOT lives in ui-logic.js (injected above by the Worker) —
// tested in ui-logic.test.mjs. Shims below keep hoisting + call sites intact.
function esc(s){ return DUI.esc(s); }

/** Render agent speech: **essence** → <strong>; rest italic via CSS. Labels stay normal weight. */
function formatAgentSpeech(s){
  let t = esc(s);
  // **essence** or __essence__ → bold (only the core idea, not whole paragraph)
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  return t;
}

function renderChatLog(slug, name){
  const hist = chatHist[slug] || [];
  if (!hist.length){
    return `<div class="chat-empty">${esc(t('chat.empty'))}</div>`;
  }
  const first = (name||'').split(' ')[0] || name || 'Agent';
  return hist.map((m, i) => {
    const isTg = (m.channel || '') === 'telegram' || /^\[Telegram\]/i.test(m.content || '');
    const cls = (m.role === 'user' ? 'user' : (m.role === 'error' ? 'assistant err' : 'assistant')) + (isTg ? ' tg' : '');
    const who = m.role === 'user' ? t('you') : first;
    const ch = isTg ? ' · Telegram' : '';
    let raw = m.content || '';
    if (isTg && m.role === 'user') raw = raw.replace(/^\[Telegram\]\s*/i, '');
    const body = m.role === 'assistant' ? formatAgentSpeech(raw) : esc(raw);
    const say = (m.role === 'assistant')
      ? `<button type="button" class="chat-say" onclick="playAgentVoice(this,'${esc(slug)}',${i})" title="${esc(t('chat.say'))}" aria-label="${esc(t('chat.say'))}">${chatSayIconSvg()}</button>`
      : '';
    return `<div class="chat-msg ${cls}"><span class="who">${esc(who)}<span class="ch">${esc(ch)}</span>${say}</span>${body}</div>`;
  }).join('');
}
/** Enter = send; Ctrl/Cmd/Shift+Enter = newline */
function chatKeydown(ev, slug, name){
  if (ev.key !== 'Enter') return true;
  if (ev.ctrlKey || ev.metaKey || ev.shiftKey) return true; // allow newline
  ev.preventDefault();
  sendChat(ev, slug, name);
  return false;
}

/** Speak an agent reply with the agent's ElevenLabs voice. Click again = stop. */
let agentVoiceAudio = null; // { audio, btn }

function stopAgentVoice(){
  if (!agentVoiceAudio) return;
  try { agentVoiceAudio.audio.pause(); } catch (_) {}
  if (agentVoiceAudio.btn) agentVoiceAudio.btn.classList.remove('playing', 'loading');
  agentVoiceAudio = null;
}

async function playAgentVoice(btn, slug, idx){
  if (agentVoiceAudio && agentVoiceAudio.btn === btn) { stopAgentVoice(); return; }
  stopAgentVoice();
  const m = (chatHist[slug] || [])[idx];
  if (!m || !m.content) return;
  btn.classList.add('loading');
  try {
    if (!m._voiceUrl) {
      // Strip markdown bold + reach footers so TTS reads clean prose
      const text = m.content.replace(/\*\*/g, '').replace(/\n·\s*📡[^\n]*$/g, '').trim();
      const r = await fetch('/api/agents/' + slug + '/tts', {
        method: 'POST',
        headers: { 'content-type': 'application/json', ...(KEY ? { authorization: 'Bearer ' + KEY } : {}) },
        body: JSON.stringify({ text })
      });
      if (!r.ok) {
        let detail = '';
        try { detail = (await r.json()).detail || ''; } catch (_) {}
        throw new Error(detail || ('HTTP ' + r.status));
      }
      m._voiceUrl = URL.createObjectURL(await r.blob());
    }
    const audio = new Audio(m._voiceUrl);
    agentVoiceAudio = { audio, btn };
    audio.onended = audio.onerror = () => { if (agentVoiceAudio && agentVoiceAudio.audio === audio) stopAgentVoice(); };
    btn.classList.remove('loading');
    btn.classList.add('playing');
    await audio.play();
  } catch (e) {
    btn.classList.remove('loading', 'playing');
    if (agentVoiceAudio && agentVoiceAudio.btn === btn) agentVoiceAudio = null;
    toast(t('chat.say_failed', { msg: (e && e.message) || e }));
  }
}

/** Voice input: MediaRecorder → POST /api/chat/transcribe → text into the reply box. */
let chatMic = null; // { rec, stream, chunks, timer }

function chatMicStop(){
  if (!chatMic) return;
  clearTimeout(chatMic.timer);
  try { if (chatMic.rec && chatMic.rec.state !== 'inactive') chatMic.rec.stop(); } catch (_) {}
  try { (chatMic.stream?.getTracks() || []).forEach(tr => tr.stop()); } catch (_) {}
}

/** Abort recording without transcribing (e.g. chat window closed). */
function chatMicAbort(){
  if (!chatMic) return;
  chatMic.aborted = true;
  chatMicStop();
  chatMic = null;
  const btn = chatMicEl();
  if (btn) btn.classList.remove('rec', 'busy');
}

async function toggleChatMic(){
  const btn = chatMicEl();
  if (chatMic) { chatMicStop(); return; } // second click → stop + transcribe

  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
    toast(t('chat.mic_unsupported'));
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    toast(t('chat.mic_denied'));
    return;
  }
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']
    .find(m => MediaRecorder.isTypeSupported(m)) || '';
  const rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  const state = { rec, stream, chunks: [], timer: 0, aborted: false };
  chatMic = state;
  rec.ondataavailable = (e) => { if (e.data && e.data.size) state.chunks.push(e.data); };
  rec.onstop = async () => {
    try { stream.getTracks().forEach(tr => tr.stop()); } catch (_) {}
    if (chatMic === state) chatMic = null;
    const b = chatMicEl();
    if (state.aborted) { if (b) b.classList.remove('rec', 'busy'); return; }
    if (b) { b.classList.remove('rec'); b.classList.add('busy'); }
    try {
      const blob = new Blob(state.chunks, { type: rec.mimeType || mime || 'audio/webm' });
      if (blob.size < 1000) throw new Error(t('chat.mic_short'));
      const res = await api('/chat/transcribe', {
        method: 'POST',
        headers: { 'content-type': blob.type },
        body: blob
      });
      if (!res || res.error || !res.text) {
        throw new Error((res && (res.detail || res.error)) || t('chat.mic_empty'));
      }
      const ta = chatUiEls().ta;
      if (ta) {
        ta.value = (ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '') + res.text.trim();
        ta.focus();
      }
    } catch (e) {
      toast(t('chat.mic_failed', { msg: (e && e.message) || e }));
    } finally {
      const b2 = chatMicEl();
      if (b2) b2.classList.remove('rec', 'busy');
    }
  };
  rec.start();
  if (btn) btn.classList.add('rec');
  state.timer = setTimeout(chatMicStop, 60000); // safety cap: 60s per take
}

async function sendChat(ev, slug, name){
  if (slug) { window.__dasorgChatSlug = slug; window.__dasorgChatName = name || slug; }
  if (ev && ev.preventDefault) ev.preventDefault();
  if (chatBusy) {
    if (typeof toast === 'function') toast(t('chat.busy'));
    return false;
  }
  const ui = chatUiEls();
  const ta = ui.ta;
  const text = (ta && ta.value || '').trim();
  if (!text) return false;
  chatHist[slug] = chatHist[slug] || [];
  chatHist[slug].push({ role:'user', content:text, channel:'board' });
  ta.value = '';
  chatBusy = true;
  const setBusyUi = (busy, statusText) => {
    const u = chatUiEls();
    if (u.send) u.send.disabled = !!busy;
    const logEl = u.log;
    if (!logEl) return;
    if (busy) {
      logEl.innerHTML = renderChatLog(slug, name) + `<div class="chat-empty">${esc(statusText || t('chat.thinking'))}</div>`;
    } else {
      logEl.innerHTML = renderChatLog(slug, name);
    }
    scrollChatToLatest(logEl);
  };
  const needsReach = /https?:\/\/|telegram|телег|t\.me\/|@\w{4,}|research|найди|источник|прочитай|GEO|очеред/i.test(text);
  setBusyUi(true, needsReach ? t('chat.reach') : t('chat.thinking'));
  const ac = new AbortController();
  const kill = setTimeout(() => ac.abort(), 35000);
  try {
    const msgs = chatHist[slug].filter(m => m.role === 'user' || m.role === 'assistant').slice(-10)
      .map(m => ({ role: m.role, content: m.content }));
    const res = await api('/agents/'+slug+'/chat', {
      method:'POST',
      body: JSON.stringify({ messages: msgs, channel: 'board', use_history: true }),
      signal: ac.signal
    });
    if (res && res.error) throw new Error(res.error + (res.detail ? (': '+res.detail) : ''));
    if (!res || !res.reply) throw new Error('Empty reply from server');
    let reply = res.reply;
    if (res.reach && res.reach.used) {
      const ch = (res.reach.channels || []).join(', ') || 'reach';
      reply += `\n\n· ${res.reach.ok ? '📡 live '+ch : '📡 reach miss'}`;
    }
    chatHist[slug].push({ role:'assistant', content: reply, channel: res.channel || 'board' });
    await loadAgentChatHistory(slug);
  } catch (e) {
    const msg = (e && e.name === 'AbortError')
      ? t('chat.timeout')
      : t('chat.failed', { msg: e.message || e });
    chatHist[slug].push({ role:'error', content: msg });
  } finally {
    clearTimeout(kill);
    chatBusy = false;
    setBusyUi(false);
  }
  return false;
}

  if (s && (s.kind === 'gm1_company' || s.slug === 'gm1-company')) {

    ? String(seedText).trim()
    : ((document.getElementById('dg-ta') && document.getElementById('dg-ta').value) || '').trim();
  const ta = document.getElementById('dg-ta');

  openAgentChatWindow(s.slug, {
    name: s.name,
    role: s.role,
    seed: seed || '',
    context: s.question || '',
    fromDigest: true
  });
}

/** Build spoken brief from current Digest slide (no UI labels «отчёт»). */
function digestCallBriefFromSlide(s){
  if (!s) return null;
  const firstName = String(s.name || '').split(/\s+/)[0] || '';
  // Text pipeline → DUI (ui-logic.js); voice brief is always RU
  const cleanPara = (text) => DUI.cleanPara(text, firstName, 'ru');
  const briefParts = (s.brief && s.brief.length)
    ? s.brief.map(cleanPara).filter(Boolean)
    : [];
  const reportPara = briefParts.length
    ? briefParts.join(' ').replace(/\s+/g, ' ').trim()
    : '';
  const stripViewLead = (text) => {
    let x = String(text || '').trim();
    x = x.replace(/^(my\s+view|мой\s+взгляд)\s*[:—–\-]\s*/i, '').trim();
    return cleanPara(x);
  };
  let viewPara = s.opinion ? stripViewLead(s.opinion) : '';
  if (!viewPara && briefParts.length > 1) viewPara = briefParts[briefParts.length - 1];
  let reportShow = reportPara;
  if (briefParts.length > 1 && viewPara === briefParts[briefParts.length - 1] && !s.opinion) {
    reportShow = briefParts.slice(0, -1).join(' ').replace(/\s+/g, ' ').trim();
  }
  return {
    question: cleanPara(s.question || ''),
    report: reportShow,
    view: viewPara,
    options: (s.options || []).map(o => ({
      key: o.key,
      label: o.label,
      tag: o.tag || null
    })),
    agent_name: s.name || s.slug,
    agent_role: s.role || ''
  };
}

/** Digest top-right phone → Realtime Call for current slide agent (icon only). */
async function digestOpenCall(){
  if (!digestDeck) return;
  const s = digestDeck.slides[digestDeck.index];
  if (!s || !s.slug) {
    if (typeof toast === 'function') toast('No agent on this Digest slide');
    return;
  }
  if (s.kind === 'gm1_company' || s.slug === 'gm1-company') {
    if (typeof toast === 'function') toast(LOCALE === 'ru'
      ? 'На сводке GM1 звонка нет — листайте к агенту'
      : 'No Call on company GM1 — flip to an agent');
    return;
  }
  window.__dasorgChatSlug = s.slug;
  window.__dasorgChatName = s.name || s.slug;
  window.__dasorgCallBrief = digestCallBriefFromSlide(s);
  window.__dasorgCallFromDigest = true;
  // Prefer floatChat shape used by Call resolver
  try {
    if (typeof floatChat === 'undefined' || !floatChat) {
      window.floatChat = { slug: s.slug, name: s.name || s.slug, role: s.role || '' };
    } else {
      floatChat.slug = s.slug;
      floatChat.name = s.name || s.slug;
      if (s.role) floatChat.role = s.role;
    }
  } catch (_) {
    window.__dasorgChatSlug = s.slug;
    window.__dasorgChatName = s.name || s.slug;
  }
  if (typeof toggleAgentCallConvai === 'function') {
    await toggleAgentCallConvai();
    // sync phone icon on/off
    const b = document.getElementById('dg-call-btn');
    if (b && typeof agentCallConvai !== 'undefined') {
      b.classList.toggle('on', !!agentCallConvai.active);
    }
  } else if (typeof toast === 'function') {
    toast('Call not available');
  }
}
